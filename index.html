    <div class="sub">${sub}</div>
  </section>`;
}
function bars(key){
  const s=D.scores[key]; const doms=Object.entries(s.domaines).sort((a,b)=>b[1]-a[1]);
  return `<div class="bars">${doms.map(([d,v])=>`<div class="lab">${DOM_LABEL[d]} <span class="w">coef ${s.poids[d].toFixed(2).replace('.',',')}</span></div><div class="track"><div class="fill" style="width:${(v/5*100).toFixed(1)}%;--c:${SEVC[Math.round(v)]}"></div></div><div class="val">${f2(v)}</div>`).join('')}</div>`;
}
function chip(x){
  const t=x.tendance==='hausse'?'<span class="chip up">▲ aggravation</span>':x.tendance==='baisse'?'<span class="chip down">▼ apaisement</span>':'<span class="chip">→ stable</span>';
  const RL={officiel:'source officielle ×1,0',institut:'institut de référence ×0,9',presse:'presse ×0,8',secondaire:'source secondaire ×0,6',lacune:'lacune 2026 ×0,5'};
  return t+(x.puissance_nucleaire?'<span class="chip nuc">☢ puissances nucléaires ×1,5</span>':'')+`<span class="chip">${RL[x.rang_source]||x.rang_source}</span>`;
}
function ind(x){
  return `<article class="ind"><div class="sev" style="--sb:${SEVB[x.severite]};--sc:${SEVC[x.severite]}" title="Sévérité ${x.severite}/5">${x.severite}</div>
   <div><div class="t"><b>${esc(x.libelle)}</b>${chip(x)}</div>
   ${x.valeur?`<div class="v">${esc(x.valeur)}</div>`:''}
   <div class="j">${esc(x.justification)}</div>
   <div class="src">${x.sources.map(s=>`<a target="_blank" rel="noopener" href="${esc(s.url)}">${esc(s.titre)}${s.date?' ('+esc(s.date)+')':''}</a>`).join('')}</div></div></article>`;
}
function domainSection(dom, intro){
  const xs=D.indicateurs.filter(x=>x.domaine===dom).sort((a,b)=>b.severite_ajustee-a.severite_ajustee);
  const st=D.scores.stabilite.domaines[dom], gu=D.scores.guerre.domaines[dom];
  return `<h3>${DOM_LABEL[dom]} <span class="chip">score domaine ${f2(st)} (stabilité) · ${f2(gu)} (guerre)</span></h3>${intro?`<p class="lede">${intro}</p>`:''}<div class="card">${xs.map(ind).join('')}</div>`;
}

P.methode=()=>{
  const ws=D.scores.stabilite.poids, wg=D.scores.guerre.poids;
  const rows=Object.keys(DOM_LABEL).map(d=>`<tr><td>${DOM_LABEL[d]}</td><td class="num">${ws[d].toFixed(2).replace('.',',')}</td><td class="num">${wg[d].toFixed(2).replace('.',',')}</td><td>${{
   geopolitique:'Théâtres de conflit actifs et tensions interétatiques (11 indicateurs).',financier:'Stress de marché, taux, énergie, fret ; pèse lourd pour la stabilité, peu pour la guerre.',maritime:'Détroits, sécurité de la navigation, déploiements navals.',nucleaire:'Horloge, traités, postures, arsenaux, prolifération ; premier poste pour la guerre mondiale.',hybride:'Sabotage, cyber, GNSS, câbles.',aerien:'Fermetures d\'espace aérien, violations, incursions.',alliances:'Réarmement, désengagement US, évaluations des services.',diplomatie:'Canaux de désescalade, marchés de prévision, seuil OTAN : les contre-poids.'}[d]}</td></tr>`).join('');
  return `<h2>Méthode de scoring</h2>
  <p class="lede">Le modèle s'inspire des indices composites de référence (Global Peace Index : 23 indicateurs notés 1-5 et pondérés par domaine ; ACLED : moyenne de rangs ; DEFCON : niveaux déclarés selon des critères qualitatifs). Chaque indicateur reçoit une sévérité de 1 (calme) à 5 (critique), puis des coefficients selon le sujet.</p>
  <h3>1. Sévérité ajustée par indicateur</h3>
  <div class="formula">sévérité_ajustée = borne[1;5]( sévérité + tendance )      tendance : aggravation +0,25 · stable 0 · apaisement −0,25</div>
  <h3>2. Coefficients par sujet</h3>
  <div class="formula">coef = rang_source × nucléaire
rang_source : officiel (ministère, agence, banque centrale, OTAN, ONU, données FRED/EASA/UKMTO…) 1,0
              institut de référence (ISW, SIPRI, IISS, ACLED, Crisis Group, CSIS, Metaculus…)      0,9
              presse générale ou spécialisée                                                       0,8
              source secondaire (encyclopédie, agrégateur, résumé)                                  0,6
              lacune (aucune donnée 2026 trouvée, sévérité estimée)                                 0,5
   → on retient le meilleur rang parmi les sources citées ; une donnée de plus de 30 jours est rétrogradée d'un cran
nucléaire   : ×1,5 si le sujet implique une confrontation entre ou avec des puissances nucléaires (indice guerre mondiale uniquement)</div>
  <h3>3. Deux couches : conjoncturelle et structurelle</h3>
  <div class="formula">Couche conjoncturelle (indicateurs hebdomadaires, 8 domaines) :
  score_domaine = Σ(sévérité_ajustée × coef) / Σ(coef)
  conjoncturel  = Σ_domaines ( poids_domaine × score_domaine )                       Σ poids = 1
Couche structurelle (indices annuels de niveau A : GPI, SIPRI, Horloge, MSC, ODNI, WEF, ACLED, IISS, prévisions long terme) :
  structurel    = Σ(sévérité_ajustée × pertinence × rang_source) / Σ(pertinence × rang_source)
Composite :
  sévérité_composite = 0,70 × conjoncturel + 0,30 × structurel
  niveau (type DEFCON) = 6 − sévérité_composite   → arrondi à l'entier</div>
  <p>La couche structurelle ne change qu'à la parution d'une nouvelle édition (calendrier dans l'onglet « Socle structurel ») : elle stabilise l'indice et donne leur juste place aux instituts de référence, qui ne publient pas chaque semaine. La couche conjoncturelle porte la variation hebdomadaire.</p>
  <h3>4. Poids des domaines (couche conjoncturelle)</h3>
  <div class="tw"><table><tr><th>Domaine</th><th>Stabilité</th><th>Guerre mondiale</th><th>Contenu</th></tr>${rows}</table></div>
  <h3>5. Paliers qualitatifs de l'indice « guerre mondiale »</h3>
  <p>Comme le DEFCON, un niveau critique se déclare sur des faits, il ne se calcule pas seul. Le niveau calculé ne peut descendre :</p>
  <ul class="tight"><li>sous <b>3</b> que si des forces de puissances nucléaires (ou de leurs alliances) échangent des tirs directs et délibérés, ou si l'article 5 est invoqué ;</li>
  <li>sous <b>2</b> que si une guerre ouverte et soutenue oppose au moins deux puissances nucléaires ou blocs.</li></ul>
  <p>Au 23 oct. 2026 : aucune des deux conditions n'est remplie (drones russes abattus par des F-16 roumains au-dessus du territoire roumain le 17 oct. et navires frappés dans les eaux roumaines et bulgares du 13 au 17 oct. : Conseil de l'Atlantique Nord saisi mais pas d'article 4 ; la guerre États-Unis/Israël–Iran oppose des puissances nucléaires à un État non doté). Le niveau calculé (1,92) est donc relevé à 3, mais la valeur continue est conservée pour suivre la trajectoire.</p>
  <h3>6. Échelles</h3>
  <div class="grid2"><div class="card"><h3>Stabilité mondiale</h3><ul class="tight"><li><b>5</b> Stable</li><li><b>4</b> Tensions contenues</li><li><b>3</b> Instabilité marquée</li><li><b>2</b> Crise systémique</li><li><b>1</b> Effondrement</li></ul></div>
  <div class="card"><h3>Risque de guerre mondiale</h3><ul class="tight"><li><b>5</b> Risque minimal</li><li><b>4</b> Vigilance</li><li><b>3</b> Risque élevé — conflits régionaux impliquant des puissances nucléaires</li><li><b>2</b> Risque critique — confrontation directe entre puissances nucléaires</li><li><b>1</b> Guerre mondiale imminente ou en cours</li></ul></div></div>
  <h3>7. Limites</h3>
  <ul class="tight"><li>Biais de sélection : les indicateurs conjoncturels sont des points chauds ; le domaine « diplomatie & prévision » et les indices structurels (qui couvrent 163 pays) servent de contre-poids.</li>
  <li>Les sévérités sont des jugements d'analyste adossés aux faits cités, pas des mesures ; deux notes du corpus divergeant d'un point sont signalées dans la justification.</li>
  <li>Le modèle v3 est figé depuis le relevé initial (recalculé le 19 sept. 2026) pour garantir la comparabilité de la série hebdomadaire ; toute évolution ultérieure sera datée et appliquée rétroactivement à l'historique.</li></ul>`;
};

  <p class="lede">Indices et rapports annuels des sources de niveau A. Ils ne bougent qu'à leur parution et donnent la lecture de fond que les relevés hebdomadaires ne peuvent pas produire. Chaque entrée a un poids de pertinence distinct pour les deux indices (0 à 1), multiplié par le rang de sa source.</p>
  <div class="grid2" style="margin-bottom:16px"><div class="card"><h3>Score structurel — stabilité</h3><div class="gauge" style="border:0;box-shadow:none;padding:0;--c:${SEVC[Math.round(D.scores.stabilite.couche_structurelle)]}"><div class="big" style="font-size:2.6rem;color:${SEVC[Math.round(D.scores.stabilite.couche_structurelle)]}">${f2(D.scores.stabilite.couche_structurelle)}</div><div class="name" style="font-size:.95rem">sévérité /5 (conjoncturel : ${f2(D.scores.stabilite.couche_conjoncturelle)})</div></div></div>
  <div class="card"><h3>Score structurel — guerre mondiale</h3><div class="gauge" style="border:0;box-shadow:none;padding:0;--c:${SEVC[Math.round(D.scores.guerre.couche_structurelle)]}"><div class="big" style="font-size:2.6rem;color:${SEVC[Math.round(D.scores.guerre.couche_structurelle)]}">${f2(D.scores.guerre.couche_structurelle)}</div><div class="name" style="font-size:.95rem">sévérité /5 (conjoncturel : ${f2(D.scores.guerre.couche_conjoncturelle)})</div></div></div></div>
  ${legend}<div class="card">${xs.map(row).join('')}</div>`;

  <h3>Trois sous-niveaux</h3><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${compFR('exterieur')}${compFR('interieur')}${compFR('alertes')}</div>

  <div class="grid2"><div class="card"><h3>Ce qui pèse le plus</h3><ul class="tight">${F.indicateurs.filter(x=>x.severite>=4).sort((a,b)=>b.severite_ajustee*b.coef-a.severite_ajustee*a.coef).slice(0,8).map(x=>`<li>${esc(x.libelle)} <span class="chip">${x.severite}/5</span></li>`).join('')}</ul></div>
  <div class="card"><h3>Robustesse</h3><div class="tw"><table><tr><th>Variante</th><th>Niveau continu</th></tr><tr><td>Modèle retenu</td><td class="num">${f2(F.niveau_continu)}</td></tr><tr><td>Poids de composantes égaux</td><td class="num">${f2(se.poids_egaux)}</td></tr><tr><td>Sans ajustement de tendance</td><td class="num">${f2(se.sans_tendance)}</td></tr><tr><td>Sans coefficient systémique</td><td class="num">${f2(se.sans_coef_systemique)}</td></tr><tr><td>Conjoncturel seul</td><td class="num">${f2(se.sans_couche_structurelle)}</td></tr><tr><td>Socle structurel seul</td><td class="num">${f2(se.structurel_seul)}</td></tr><tr><td>Moyenne simple</td><td class="num">${f2(se.brut_moyenne_simple)}</td></tr></table></div></div></div>
  <div class="note">Lecture au 23 oct. 2026 : la tension intérieure franchit un cran (sous-niveau 1,74) : émeutes et pillages des 17-18 oct. (≈ 2 400 interpellations, 997 blessés parmi les forces de l'ordre et les pompiers), couvre-feux préfectoraux dans plusieurs grandes villes, PLF 2027 détricoté (−10 Md€) et vote des recettes reporté au 3 nov., spread OAT-Bund à 174,6 pb et OAT 10 ans au-dessus de 5 % (22 oct.) avant la revue Moody's du 23 oct. Les alertes officielles reculent à 2,39 (fusillade terroriste au collège d'Aubagne le 12 oct., 4 alertes CERT-FR ouvertes, tempête Austen) sans changement de posture réglementaire (Vigipirate « vigilance renforcée », ni état d'urgence ni ORSAN, INES ≤ 1, notes inchangées au relevé). Le risque extérieur passe au sous-niveau 2 (2,48) : missile intercepté au-dessus de Yanbu (16 oct.), drones au-dessus de Toulon, Brent en forte hausse. Le palier sous 3 n'est pas franchi. Variante sans tendance : 2,39 → 2,33.</div></div>`;};

PFR.alertes=()=>`<h3 style="margin-top:0">Postures d'alerte officielles en vigueur</h3><div class="ech">${D.france.echelles.map(e=>`<div class="card"><div class="eyebrow">${esc(e.autorite)}</div><b>${esc(e.nom)}</b><div class="lv">${(()=>{const a=(e.niveau_actuel||'').toLowerCase();let best=-1,bl=0;e.niveaux.forEach((l,i)=>{const k=l.toLowerCase().split(' – ')[0].split(' (')[0];if(k&&a.startsWith(k)&&k.length>bl){best=i;bl=k.length;}});return e.niveaux.map((l,i)=>`<span class="${i===best?'on':''}">${esc(l)}</span>`).join('');})()}</div><div style="font-size:.85rem"><b>Actuel :</b> ${esc(e.niveau_actuel)}${e.date_niveau_actuel?` <span class="chip">${esc(e.date_niveau_actuel)}</span>`:''}</div>${e.historique_2026?`<div style="font-size:.8rem;color:var(--ink-2);margin-top:4px">${esc(e.historique_2026)}</div>`:''}${e.url?`<div class="src" style="margin-top:6px;font-size:.78rem"><a target="_blank" rel="noopener" href="${esc(e.url)}">source</a></div>`:''}</div>`).join('')}</div>
  <h3>Indicateurs d'alerte et de sécurité civile</h3>${legend}<div class="card">${D.france.indicateurs.filter(x=>x.composante==='alertes').sort((a,b)=>b.severite_ajustee-a.severite_ajustee).map(indFR).join('')}</div>`;
PFR.structurel=()=>`<p class="lede">Rapports et indices annuels concernant la France (30 % de l'indice). Chaque entrée a un poids de pertinence (0-1) multiplié par le rang de sa source ; elle ne change qu'à la parution suivante.</p>${legend}<div class="card">${D.france.structurels.slice().sort((a,b)=>b.severite_ajustee-a.severite_ajustee).map(x=>`<article class="ind"><div class="sev" style="--sb:${SEVB[x.severite]};--sc:${SEVC[x.severite]}">${x.severite}</div><div><div class="t"><b>${esc(x.libelle)}</b>${x.tendance==='hausse'?'<span class="chip up">▲ aggravation</span>':x.tendance==='baisse'?'<span class="chip down">▼ apaisement</span>':'<span class="chip">→ stable</span>'}<span class="chip">poids ${x.poids.toFixed(1).replace('.',',')}</span><span class="chip">${x.rang_source} ×${x.coef_qualite.toFixed(1).replace('.',',')}</span><span class="chip">prochaine édition : ${esc(x.prochaine_edition)}</span></div>${x.valeur?`<div class="v">${esc(x.valeur)}</div>`:''}<div class="j">${esc(x.justification)}</div><div class="src">${x.sources.map(s=>`<a target="_blank" rel="noopener" href="${esc(s.url)}">${esc(s.titre)}${s.date?' ('+esc(s.date)+')':''}</a>`).join('')}</div></div></article>`).join('')}</div>`;
PFR.sources=()=>{const C=D.france.catalogue;const doms={securite:'Sécurité intérieure & alertes',defense:'Défense & extérieur',politique:'Politique & social',economie:'Économie & finances',presse:'Presse de référence & OSINT'};
  return `<p class="lede">${C.length} sources françaises, mêmes niveaux A/B/C/D et même journal de statut que le catalogue mondial : ${C.filter(r=>r.consultee).length} exploitées pour ce relevé.</p>
  <div class="filters"><select id="frs-niv"><option value="">Tous niveaux</option><option>A</option><option>B</option><option>C</option><option>D</option></select><select id="frs-dom"><option value="">Tous domaines</option>${Object.entries(doms).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="frs-st"><option value="">Tous statuts</option><option value="répondu">Répondu</option><option value="bloqué">Bloqué</option><option value="sans nouveauté">Sans nouveauté</option><option value="non sollicitée">Non sollicitée</option></select><input id="frs-q" type="search" placeholder="Filtrer…"></div>
  <div class="tw"><table id="frs-table"><thead><tr><th>Niv.</th><th>Source</th><th>Éditeur</th><th>Fréquence</th><th>Ce qu'elle mesure</th><th>Accès</th><th>Statut</th><th>Journal</th></tr></thead><tbody></tbody></table></div>`;};
PFR.methode=()=>`<p class="lede">Même architecture que l'indice mondial v3, appliquée au périmètre national.</p>
  <div class="formula">sévérité_ajustée = borne[1;5](sévérité + tendance)        tendance : aggravation +0,25 · stable 0 · apaisement −0,25
coef = rang_source × systémique                            systémique ×1,5 si l'indicateur peut à lui seul changer le niveau national
                                                           (Vigipirate, censure, notation/spread, attaque sur le territoire ou les forces, énergie)
score_composante = Σ(sévérité_ajustée × coef) / Σ(coef)    composantes : tension intérieure 0,40 · risque extérieur 0,30 · alertes 0,30
conjoncturel     = Σ poids × score_composante
structurel       = Σ(sévérité_ajustée × pertinence × rang) / Σ(pertinence × rang)     (GPI, GTI, CEVIPOF, Fractures, RSF, CPI, ANSSI, SSMSI, BdF, LPM)
sévérité_composite = 0,70 × conjoncturel + 0,30 × structurel
niveau = 6 − sévérité_composite → arrondi ; sous-niveaux = 6 − score_composante</div>
  <h3>Paliers qualitatifs</h3><ul class="tight"><li>Sous <b>3</b> uniquement si Vigipirate est en « alerte attentat », ou si un état d'urgence est déclaré (même local), ou si le gouvernement tombe sans successeur alors qu'une agence dégrade la note.</li><li>Sous <b>2</b> uniquement en cas d'état d'urgence national, d'attaque armée sur le territoire ou de mobilisation.</li></ul>
  <h3>Échelle nationale</h3><ul class="tight"><li><b>5</b> Serein</li><li><b>4</b> Vigilance</li><li><b>3</b> Tension marquée</li><li><b>2</b> Crise nationale</li><li><b>1</b> Urgence nationale</li></ul>
  <h3>Limites</h3><ul class="tight"><li>8 indicateurs et structurels sur 43 reposent sur des reprises de presse ou des sources secondaires (franceinfo, Le Monde, HCFP, diplomatie.gouv.fr bloqués au chargement) ; le rang de source le reflète.</li><li>Les postures officielles (Vigipirate, vigilance météo, ORSAN, INES) sont affichées telles quelles et ne sont pas réinterprétées ; elles entrent dans la composante « alertes » avec leur sévérité propre.</li><li>Modèle figé au relevé initial du 19 sept. 2026 (v3-france) pour la comparabilité de la série.</li></ul>`;
const FRTABS=[['synthese','Synthèse'],['exterieur','Risque extérieur'],['interieur','Tension intérieure'],['alertes','Alertes officielles'],['structurel','Socle structurel'],['sources','Sources'],['methode','Méthode']];
P.france=()=>`<h2>France — niveau de risque, de tension et d'alerte</h2><p class="lede">Zoom national à trois composantes (risque extérieur, tension intérieure, alertes officielles) et socle structurel, calculé avec la même logique que l'indice mondial. Situation au 28 sept. 2026.</p>
  <nav class="subnav" role="tablist" id="frnav">${FRTABS.map(([id,l],i)=>`<button role="tab" id="frtab-${id}" aria-selected="${i===0}">${l}</button>`).join('')}</nav>
  ${FRTABS.map(([id],i)=>`<section id="frpanel-${id}" ${i?'hidden':''}>${i===0?PFR.synthese():''}</section>`).join('')}`;
function initFrance(){
  FRTABS.forEach(([id])=>document.getElementById('frtab-'+id).addEventListener('click',()=>{FRTABS.forEach(([t])=>{const p=document.getElementById('frpanel-'+t),b=document.getElementById('frtab-'+t),on=t===id;b.setAttribute('aria-selected',on);if(on&&!p.dataset.done){p.innerHTML=PFR[t]();p.dataset.done='1';if(t==='sources')initFrSources();}p.hidden=!on;});}));
  document.getElementById('frpanel-synthese').dataset.done='1';
}
function initFrSources(){
  const tb=document.querySelector('#frs-table tbody'),dom=document.getElementById('frs-dom'),niv=document.getElementById('frs-niv'),st=document.getElementById('frs-st'),q=document.getElementById('frs-q');
  const STC={'répondu':'var(--s1)','bloqué':'var(--s5)','sans nouveauté':'var(--s3)','non sollicitée':'var(--muted)'};
  const render=()=>{const k=q.value.trim().toLowerCase();const rows=D.france.catalogue.filter(r=>(!dom.value||r.domaine===dom.value)&&(!niv.value||r.niveau===niv.value)&&(!st.value||r.statut===st.value)&&(!k||(r.nom+' '+r.editeur+' '+r.mesure).toLowerCase().includes(k)));
   tb.innerHTML=rows.map(r=>{const url=(r.url||'').split(/\s*;\s*/)[0].trim();const jl=(r.journal||[]).slice(-6).map(e=>`<span title="${esc(e.date)} : ${esc(e.statut)}" style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:2px;background:${STC[e.statut]||'var(--muted)'}"></span>`).join('');
   return `<tr><td class="num">${r.niveau}</td><td>${url.startsWith('http')?`<a target="_blank" rel="noopener" href="${esc(url)}">${esc(r.nom)}</a>`:esc(r.nom)}</td><td>${esc(r.editeur)}</td><td>${esc(r.frequence)}</td><td>${esc(r.mesure)}</td><td>${esc(r.acces)}</td><td><span style="color:${STC[r.statut]||'var(--muted)'};font-weight:600">${r.statut==='répondu'?'✓ ':''}${esc(r.statut)}</span>${r.dernier_doc?`<div style="font-size:.78rem;color:var(--muted)">${esc(r.dernier_doc)}</div>`:''}</td><td style="white-space:nowrap">${jl}</td></tr>`}).join('')||'<tr><td colspan="8">Aucune source.</td></tr>';};
  [dom,niv,st].forEach(e=>e.addEventListener('change',render));q.addEventListener('input',render);render();
}
P.historique=()=>{
  const H=D.historique; const W=Math.max(360,H.length*90+80), Hh=220, pad={l:36,r:16,t:16,b:30};
  const x=i=>pad.l+(H.length===1?(W-pad.l-pad.r)/2:i*(W-pad.l-pad.r)/(H.length-1));
  const y=v=>pad.t+(5-v)*(Hh-pad.t-pad.b)/4;
  const hasFR=H.some(h=>h.france_continu!=null);
  const line=(k,c)=>H.length>1?`<path d="${H.map((h,i)=>h[k]==null?'':(i?'L':'M')+x(i)+','+y(h[k])).join(' ').replace(/^ *L/,'M')}" fill="none" stroke="${c}" stroke-width="2"/>`:'';
  const dots=(k,c)=>H.filter(h=>h[k]!=null).map((h,i)=>`<circle cx="${x(i)}" cy="${y(h[k])}" r="5" fill="${c}" stroke="var(--surface)" stroke-width="2"><title>${h.date} : ${h[k].toFixed(2)}</title></circle>`).join('');
  const grid=[1,2,3,4,5].map(v=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('');
  const xl=H.map((h,i)=>`<text x="${x(i)}" y="${Hh-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${h.date.slice(5)}</text>`).join('');
  return `<h2>Historique des relevés</h2><p class="lede">Un relevé hebdomadaire est planifié (lundi matin) avec le même modèle. Valeurs continues (5 = calme, 1 = critique) ; le niveau affiché de l'indice guerre inclut le palier qualitatif.</p>
  <div class="card"><div class="legend"><span class="k"><i style="--c:var(--accent)"></i>Stabilité mondiale (continu)</span><span class="k"><i style="--c:var(--s4)"></i>Risque de guerre mondiale (continu)</span><span class="k"><i style="--c:var(--s3)"></i>France (continu)</span></div>
  <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" style="max-width:100%;font-family:var(--mono)" role="img" aria-label="Évolution des deux indices">${grid}${line('stabilite_continu','var(--accent)')}${line('guerre_continu','var(--s4)')}${hasFR?line('france_continu','var(--s3)'):''}${dots('stabilite_continu','var(--accent)')}${dots('guerre_continu','var(--s4)')}${hasFR?dots('france_continu','var(--s3)'):''}${xl}</svg></div></div>
  <h3>Relevés</h3><div class="tw"><table><tr><th>Date</th><th>Stabilité</th><th>Guerre mondiale</th><th>France</th><th>Indicateurs</th><th>Faits marquants</th></tr>${H.slice().reverse().map(h=>`<tr><td class="num">${h.date}</td><td class="num">niveau ${h.stabilite_niveau} (${f2(h.stabilite_continu)})</td><td class="num">niveau ${h.guerre_niveau} (${f2(h.guerre_continu)}, brut ${h.guerre_brut})</td><td class="num">${h.france_niveau!=null?`niveau ${h.france_niveau} (${f2(h.france_continu)}, brut ${h.france_brut})`:'—'}</td><td class="num">${h.n_indicateurs}</td><td>${esc(h.faits_marquants)}</td></tr>`).join('')}</table></div>`;
};
P.rapport=()=>`<h2>Rapport de synthèse</h2><p class="lede">Relevé du 6 oct. 2026 : ce qui a changé depuis le 28 sept. (≈ 2800 mots). Chaque chiffre renvoie à sa source.</p><div class="prose card">${REPORT}</div>`;
P.sources=()=>{
  const doms={instituts:'Instituts stratégiques & think tanks',gouvernemental:'Publications gouvernementales, ministérielles & organisations internationales',osint:'Plateformes OSINT & centres de surveillance',financier:'Sources économiques & financières'};
  const N=D.catalogue.length, c=D.catalogue.filter(r=>r.consultee).length;
  const byT=t=>D.catalogue.filter(r=>r.niveau===t);
  return `<h2>Catalogue des sources de référence</h2>
  <p class="lede">${N} sources, classées en quatre niveaux selon leur rythme et leur rôle dans la méthode. À chaque relevé, le statut de chaque source est consigné (répondu · bloqué · sans nouveauté · non sollicitée) : ${c} sur ${N} ont été exploitées pour le relevé courant.</p>
  <div class="grid2" style="margin-bottom:16px">
   <div class="card"><h3>A — Socle structurel <span class="chip">${byT('A').length}</span></h3><p style="font-size:.88rem;color:var(--ink-2);margin:0">Indices et rapports annuels à dates connues (IISS, SIPRI, GPI, MSC, ODNI, WEF, Horloge…). Consultés selon leur calendrier de parution ; alimentent la lecture de fond.</p></div>
   <div class="card"><h3>B — Flux de veille <span class="chip">${byT('B').length}</span></h3><p style="font-size:.88rem;color:var(--ink-2);margin:0">Sources primaires quotidiennes à mensuelles (ISW, CrisisWatch, EASA, UKMTO/JMIC, USNI, FRED, Metaculus…). Sollicitées à chaque relevé ; chaque indicateur a sa source primaire désignée ici.</p></div>
   <div class="card"><h3>C — Interprétation <span class="chip">${byT('C').length}</span></h3><p style="font-size:.88rem;color:var(--ink-2);margin:0">Instituts et think tanks à publication événementielle (IFRI, FRS, IRSEM, RUSI, Chatham House, CSIS, RAND…). Balayage hebdomadaire de leur page « publications », puis recherche ciblée sur les indicateurs qui ont bougé.</p></div>
   <div class="card"><h3>D — Outils et données brutes <span class="chip">${byT('D').length}</span></h3><p style="font-size:.88rem;color:var(--ink-2);margin:0">Plateformes interactives et API (Flightradar24, ADS-B Exchange, MarineTraffic, Sentinel, FIRMS, GDELT…). Exploitées via les analyses publiées qui s'en servent ; accès direct seulement avec clés API.</p></div>
  </div>
  <div class="filters"><select id="src-niv"><option value="">Tous les niveaux</option><option value="A">A — Socle structurel</option><option value="B">B — Flux de veille</option><option value="C">C — Interprétation</option><option value="D">D — Outils</option></select><select id="src-dom"><option value="">Tous les domaines</option>${Object.entries(doms).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="src-st"><option value="">Tous statuts</option><option value="répondu">Répondu</option><option value="bloqué">Bloqué</option><option value="sans nouveauté">Sans nouveauté</option><option value="non sollicitée">Non sollicitée</option></select><input id="src-q" type="search" placeholder="Filtrer (nom, éditeur, mesure)…"></div>
  <div class="tw"><table id="src-table"><thead><tr><th>Niv.</th><th>Source</th><th>Éditeur</th><th>Fréquence</th><th>Ce qu'elle mesure</th><th>Accès</th><th>Statut (dernier relevé)</th><th>Journal</th></tr></thead><tbody></tbody></table></div>`;
};
P.lacunes=()=>{
  const part=D.indicateurs.filter(x=>x.qualite!=='verifiee');
  const partF=D.france.indicateurs.filter(x=>x.qualite!=='verifiee');
  const row=x=>`<tr><td>${esc(x.libelle)}</td><td class="num">${x.severite}</td><td>${x.qualite}</td><td class="num">${esc(x.date_donnee)}</td></tr>`;
  return `<h2>Lacunes documentaires et signaux à surveiller</h2>
  <div class="note red"><b>Réserve d'ensemble (relevé du 23 oct. 2026).</b> Ce relevé couvre une fenêtre de dix-sept jours (6-23 oct.), le relevé du 13 oct. n'ayant pas eu lieu ; les tendances sont mesurées par rapport au 6 oct. Le quota de recherches web (200 requêtes, partagé entre sept agents) a de nouveau été épuisé en fin de relevé : désengagement américain, évaluations des services, cyber étatique et Inde–Pakistan sont restés sans donnée de la fenêtre. Aucune source de niveau A ou B n'est « non sollicitée » ; restent « non sollicitées » les 13 outils de niveau D (pas d'accès direct prévu) et une source C (Meta-Defense/Air&Cosmos). Décisions prises sans validation : (1) l'agent « intérieur » proposait de créer un indicateur « ordre public : émeutes, pillages et couvre-feux » : pour ne pas dupliquer un indicateur existant, ses données ont été fusionnées dans l'indicateur <i>ordre_public_violences_urbaines</i> (composante « alertes », inchangée), porté de 3 à 5 (pillages des 17-18 oct., ≈ 2 400 interpellations, 997 blessés parmi les forces de l'ordre et les pompiers, couvre-feux) — l'agent « alertes » le plaçait à 4 ; l'indicateur « mobilisations » reste aussi à 5, d'où un léger double comptage de l'épisode du 17 oct. ; (2) les couvre-feux préfectoraux ne sont pas assimilés à un état d'urgence local : le palier France sous 3 n'est pas franchi ; (3) les drones Geran abattus par des F-16 roumains au-dessus du territoire roumain (17 oct.) ne sont pas comptés comme « tirs directs et délibérés entre forces de puissances nucléaires » : le palier guerre reste fermé ; (4) la revue Moody's du 23 oct. n'était pas publiée : notations passées à 4 en hausse sur la seule anticipation d'une baisse à A1, à corriger au prochain relevé ; (5) comme aux relevés précédents, la rétrogradation des données de plus de 30 jours ne s'applique qu'aux indicateurs conjoncturels, pas au socle annuel ; (6) le Brent est cité sous deux mesures (Brent daté FRED : pic 126,55 $ le 14 oct. ; contrats à terme : ≈ 114 $ le 23 oct. ; 109,86 $ en clôture du 16 oct. selon une autre source) ; (7) villes sous couvre-feu divergentes selon les sources (Paris, Lyon, Marseille, Toulouse pour l'une ; Paris, Bordeaux, Nice pour une autre) ; (8) Metaculus 21548 (Russie–OTAN) : 4,2 % retenu, une autre lecture affichait 14 % (non confirmée).</div>

const tabsEl=document.getElementById('tabs'), main=document.getElementById('main');
TABS.forEach(([id,label])=>{const b=document.createElement('button');b.className='tab';b.role='tab';b.id='tab-'+id;b.textContent=label;b.setAttribute('aria-selected','false');b.addEventListener('click',()=>show(id));tabsEl.appendChild(b);
 const s=document.createElement('section');s.className='panel';s.id='panel-'+id;s.setAttribute('role','tabpanel');s.hidden=true;main.appendChild(s);});
function show(id){
  TABS.forEach(([t])=>{const p=document.getElementById('panel-'+t);const b=document.getElementById('tab-'+t);const on=t===id;b.setAttribute('aria-selected',on);if(on&&!p.dataset.done){p.innerHTML=P[t]();p.dataset.done='1';if(t==='sources')initSources();if(t==='france')initFrance();}p.hidden=!on;});
  try{localStorage.setItem('veille-tab',id)}catch(e){}
  document.getElementById('tab-'+id).scrollIntoView({block:'nearest',inline:'center'});
  window.scrollTo({top:0});
}
function initSources(){
  const tb=document.querySelector('#src-table tbody'), dom=document.getElementById('src-dom'), niv=document.getElementById('src-niv'), st=document.getElementById('src-st'), q=document.getElementById('src-q');
  const STC={'répondu':'var(--s1)','bloqué':'var(--s5)','sans nouveauté':'var(--s3)','non sollicitée':'var(--muted)'};
  const render=()=>{const k=q.value.trim().toLowerCase();const rows=D.catalogue.filter(r=>(!dom.value||r.domaine===dom.value)&&(!niv.value||r.niveau===niv.value)&&(!st.value||r.statut===st.value)&&(!k||(r.nom+' '+r.editeur+' '+r.mesure).toLowerCase().includes(k)));
   tb.innerHTML=rows.map(r=>{const url=(r.url||'').split(/\s*[;/]\s+|\s+\/\s+/)[0].trim();const jl=(r.journal||[]).slice(-6).map(e=>`<span title="${esc(e.date)} : ${esc(e.statut)}" style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:2px;background:${STC[e.statut]||'var(--muted)'}"></span>`).join('');
   return `<tr><td class="num">${r.niveau}</td><td>${url&&url.startsWith('http')?`<a target="_blank" rel="noopener" href="${esc(url)}">${esc(r.nom)}</a>`:esc(r.nom)}</td><td>${esc(r.editeur)}</td><td>${esc(r.frequence)}</td><td>${esc(r.mesure)}</td><td>${esc(r.acces)}</td><td><span style="color:${STC[r.statut]||'var(--muted)'};font-weight:600">${r.statut==='répondu'?'✓ ':''}${esc(r.statut)}</span>${r.dernier_doc?`<div style="font-size:.78rem;color:var(--muted)">${esc(r.dernier_doc)}</div>`:''}</td><td style="white-space:nowrap">${jl}</td></tr>`}).join('')||'<tr><td colspan="8">Aucune source ne correspond.</td></tr>';};
  [dom,niv,st].forEach(e=>e.addEventListener('change',render));q.addEventListener('input',render);render();
}
let start='synthese';try{const s=localStorage.getItem('veille-tab');if(s&&TABS.some(([t])=>t===s))start=s}catch(e){}
show(start);
