<style>
/* Mise en page : un bulletin de renseignement (la note domine, données en marge) servi comme un site
   à rubriques — en-tête, menu principal à sous-menus, menu latéral, fil d'Ariane, une page par vue. */
:root{
  --page:#eef0f3; --sheet:#ffffff; --ink:#14171c; --ink-2:#465061; --muted:#737c8a;
  --rule:#dde1e6; --rule-2:#c2c8d0; --navy:#1a2b4c; --navy-2:#2c4a80; --on-navy:#e3e9f3; --tint:#f3f5f8;
  --sev1:#2e7d5b; --sev2:#5f8f2c; --sev3:#ad8200; --sev4:#cf6420; --sev5:#bd2f29;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --serif:"Charis SIL","Bitstream Charter",Georgia,serif;
  --sans:"Lato","Carlito","Helvetica Neue",Arial,sans-serif;
  --mono:"Cousine","Liberation Mono",ui-monospace,monospace;
  --shadow:0 8px 28px rgba(20,23,28,.14); --map-dot:#bcc5d1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0f1217; --sheet:#171b21; --ink:#e9edf2; --ink-2:#b2bac6; --muted:#8a93a1;
  --rule:#2a3039; --rule-2:#3c4552; --navy:#0b1426; --navy-2:#93b6ea; --on-navy:#c9d5e8; --tint:#1e232b;
  --sev1:#4fae84; --sev2:#8fbb4f; --sev3:#dcae35; --sev4:#ee8a4a; --sev5:#ef6159;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --shadow:0 8px 28px rgba(0,0,0,.5); --map-dot:#3b4553; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#0f1217; --sheet:#171b21; --ink:#e9edf2; --ink-2:#b2bac6; --muted:#8a93a1;
  --rule:#2a3039; --rule-2:#3c4552; --navy:#0b1426; --navy-2:#93b6ea; --on-navy:#c9d5e8; --tint:#1e232b;
  --sev1:#4fae84; --sev2:#8fbb4f; --sev3:#dcae35; --sev4:#ee8a4a; --sev5:#ef6159;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --shadow:0 8px 28px rgba(0,0,0,.5); --map-dot:#3b4553; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--serif);font-size:16.5px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
a{color:var(--navy-2);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}

/* ---------- bandeau et en-tête ---------- */
.classif{background:var(--navy);color:var(--on-navy);font:700 11px var(--sans);letter-spacing:.13em;text-transform:uppercase}
.classif .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:6px}
.classif #stamp{letter-spacing:.06em;text-transform:none;font-weight:700;opacity:.92}
.hdr{background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hdr .wrap{display:flex;align-items:stretch;gap:24px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex:0 0 auto}
.brand .mk{width:36px;height:36px;border:2px solid var(--ink);display:grid;place-items:center;font:900 12px var(--sans);letter-spacing:.06em}
.brand b{font:700 17px/1.15 var(--serif);display:block}
.brand small{font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mainnav{display:flex;align-items:stretch;gap:0;margin-left:4px}
.mainnav>.it{position:relative;display:flex}
.mainnav .top{display:flex;align-items:center;gap:6px;padding:0 12px;font:700 14px var(--sans);color:var(--ink-2);text-decoration:none;border:0;background:none;cursor:pointer;border-bottom:3px solid transparent;border-top:3px solid transparent}
.mainnav .top:hover{color:var(--ink)}
.mainnav .top.on{color:var(--navy-2);border-bottom-color:var(--navy-2)}
.mainnav .car{font-size:9px;color:var(--muted);transition:transform .15s}
.mainnav .top[aria-expanded="true"] .car{transform:rotate(180deg)}
.dd{position:absolute;top:100%;left:0;min-width:270px;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);padding:6px 0;z-index:25}
.dd a{display:flex;justify-content:space-between;gap:16px;padding:9px 16px;font:600 14px var(--sans);color:var(--ink-2);text-decoration:none}
.dd a:hover,.dd a:focus-visible{background:var(--tint);color:var(--ink)}
.dd a .num{font-size:12px;color:var(--muted)}
.dd hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.relsel{display:flex;align-items:center;gap:8px;border:1px solid var(--rule-2);border-radius:4px;padding:0 4px 0 12px;font:700 13px var(--sans);background:var(--sheet)}
.relsel span{color:var(--muted);font-weight:400}
.relsel select{font:700 13px var(--sans);color:var(--ink);border:0;background:transparent;padding:8px 4px;cursor:pointer}
.burger{display:none;align-self:center;width:42px;height:42px;border:1px solid var(--rule-2);border-radius:4px;background:var(--sheet);color:var(--ink);font:700 18px var(--sans);cursor:pointer}
.drawer{position:fixed;inset:0;z-index:40;background:var(--sheet);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--rule)}
.drawer .dh button{width:42px;height:42px;border-radius:4px;border:0;background:var(--navy);color:var(--on-navy);font:700 18px var(--sans);cursor:pointer}
.drawer .relsel{margin:14px 0}
.drawer nav>a,.drawer nav>button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 18px;font:700 16px var(--sans);color:var(--ink);text-decoration:none;border:0;border-bottom:1px solid var(--rule);background:none;cursor:pointer;text-align:left}
.drawer nav>.on{color:var(--navy-2);box-shadow:inset 4px 0 0 var(--navy-2)}
.drawer .sub{background:var(--tint);border-bottom:1px solid var(--rule)}
.drawer .sub a{display:flex;justify-content:space-between;padding:11px 18px 11px 34px;font:600 15px var(--sans);color:var(--ink-2);text-decoration:none}
.drawer .sub a.on{color:var(--navy-2)}

/* ---------- gabarits de page ---------- */
main{padding-block:24px 0;min-height:60vh}
.crumbs{font:400 13px var(--sans);color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.l-side{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
.l-rail{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.l-side>*,.l-rail>*{min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--sheet);border:1px solid var(--rule)}
.side h4{margin:0;padding:14px 16px 8px}
.side a{display:grid;grid-template-columns:1fr auto;gap:3px 8px;padding:9px 16px;text-decoration:none;color:var(--ink-2);font:700 14px var(--sans);border-left:3px solid transparent}
.side a:hover{background:var(--tint)}
.side a .num{font-size:12.5px;font-weight:400;color:var(--ink-2)}
.side a i{grid-column:1/3;height:3px;background:var(--tint);position:relative}
.side a i b{position:absolute;inset:0 auto 0 0;background:var(--c)}
.side a.on{background:var(--tint);border-left-color:var(--navy-2);color:var(--navy-2)}
.side hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.sheet{background:var(--sheet);border:1px solid var(--rule)}
.doc{padding:34px 44px 40px}
.card{background:var(--sheet);border:1px solid var(--rule);padding:16px 18px;min-width:0}
.card h4,.side h4{font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card h4{margin:0 0 12px;display:flex;justify-content:space-between;gap:10px}
.stack{display:grid;gap:16px;align-content:start}
h1{font:700 30px/1.22 var(--serif);margin:4px 0 12px;letter-spacing:-.005em;text-wrap:balance}
.chapeau{font-size:18px;line-height:1.6;margin:0 0 24px;max-width:64ch}
h3.s{font:700 12.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin:30px 0 12px;border-top:1px solid var(--rule);padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
h3.s a{font-weight:700;letter-spacing:0;text-transform:none;font-size:13.5px}
.para{margin:0 0 12px;max-width:68ch}
.pk{border:1px solid var(--rule-2);background:var(--tint);padding:20px 24px}
.pk h2{font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;color:var(--navy-2)}
.pk ol{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:p}
.pk li{display:grid;grid-template-columns:34px 1fr;gap:8px;counter-increment:p}
.pk li::before{content:"§" counter(p);font:700 13px var(--mono);color:var(--navy-2);padding-top:3px}
.pagehead{padding:22px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
.pagehead h1{font-size:28px;margin-bottom:8px}
.pagehead p{margin:0;max-width:64ch}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--rule);padding:10px 12px}
.kpi .v{font:900 25px/1.1 var(--sans)}
.kpi .k{font:700 10.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.note{font-size:15px;color:var(--ink-2);border-left:3px solid var(--rule-2);padding:2px 0 2px 14px;margin:16px 0 0;max-width:80ch}
.small{font:400 13.5px/1.5 var(--sans);color:var(--ink-2)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}

/* ---------- niveaux ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--c);padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 14px;align-items:center;text-decoration:none;color:inherit}
a.tile:hover{box-shadow:var(--shadow)}
.tile .d{grid-column:1;grid-row:1/3;font:900 54px/1 var(--sans);color:var(--c)}
.tile .n{grid-column:2;grid-row:1;font:700 15px var(--sans)}
.tile .l{grid-column:2;grid-row:2;font:700 13px var(--sans);color:var(--c)}
.tile .v{grid-column:3;grid-row:1/3;text-align:right}
.tile .v .num{font-size:20px;display:block}
.tile .sc,.tile .spark,.tile .why,.tile .ax{grid-column:1/4}
.tile .spark{width:100%;height:36px;display:block}
.tile .why{font:400 12.5px/1.45 var(--sans);color:var(--muted)}
.delta{font:700 12px var(--mono);white-space:nowrap}
.delta.worse{color:var(--sev5)} .delta.better{color:var(--sev1)} .delta.flat{color:var(--muted)}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;position:relative;margin:8px 0 0}
.sc span{height:7px;background:color-mix(in srgb,var(--c) 22%,var(--tint))}
.sc span.on{background:var(--c)}
.sc .mk{position:absolute;top:-4px;width:2px;height:15px;background:var(--ink);transform:translateX(-1px)}
.ax{display:flex;justify-content:space-between;font:700 9.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- graphiques ---------- */
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.chart .lab{font-family:var(--sans);font-size:12px;font-weight:700;fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font:700 12px var(--sans);color:var(--ink-2);margin:0 0 6px}
.legend i{display:inline-block;width:14px;height:3px;background:var(--c);vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--sheet);border:1px solid var(--rule-2);box-shadow:var(--shadow);padding:8px 10px;font:400 12.5px var(--sans);color:var(--ink);min-width:160px;z-index:3}
.tip .d{font:700 11px var(--mono);color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.tip .r i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.dbars{display:grid;grid-template-columns:minmax(0,11em) 1fr auto;gap:12px 14px;align-items:start}
.dbars a{font:700 14px/20px var(--sans);color:var(--ink);text-decoration:none}
.dbars a:hover{text-decoration:underline}
.dbars small{display:block;font:400 11px/16px var(--mono);color:var(--muted)}
.dbars .tk{height:12px;margin-top:4px;background:var(--tint);position:relative}
.dbars .tk b{position:absolute;inset:0 auto 0 0;background:var(--c)}
.dbars .tk em{position:absolute;top:-3px;width:2px;height:18px;background:var(--ink)}
.dbars .dv{font:400 13px/20px var(--mono);text-align:right;white-space:nowrap}
.dbars .dv small{display:inline;color:var(--muted)}
.ax5{grid-column:2;width:100%;display:flex;justify-content:space-between;font:400 10.5px var(--mono);color:var(--muted)}
.heat{display:grid;gap:7px}
.heat .r{display:grid;grid-template-columns:minmax(0,10em) 1fr;gap:12px;align-items:center}
.heat .r>a{font:700 13px var(--sans);color:var(--ink-2);text-decoration:none}
.heat .cells{display:flex;flex-wrap:wrap;gap:3px}
.cell{width:24px;height:24px;display:grid;place-items:center;font:900 11.5px var(--sans);color:var(--ink);background:color-mix(in srgb,var(--c) 28%,var(--sheet));border:1px solid var(--c);text-decoration:none;position:relative}
.cell:hover{background:color-mix(in srgb,var(--c) 50%,var(--sheet))}
.cell sup{position:absolute;top:-3px;right:1px;font-size:9px}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font:400 12px var(--sans);color:var(--ink-2);margin-top:12px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:11px;height:11px;background:color-mix(in srgb,var(--c) 28%,var(--sheet));border:1px solid var(--c)}

/* ---------- fiches ---------- */
.fiches{display:grid;gap:14px;margin-top:18px}
.fiche{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--c);display:grid;grid-template-columns:minmax(0,1fr) 230px;scroll-margin-top:100px}
.fiche .main{padding:16px 20px;min-width:0}
.fiche .t{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fiche h2{font:700 18px/1.3 var(--serif);margin:0}
.fiche .v{font:400 13px/1.55 var(--mono);color:var(--ink-2);margin:8px 0}
.fiche p{margin:0;font-size:15.5px;max-width:70ch}
.fiche .meta{background:var(--tint);border-left:1px solid var(--rule);padding:14px 16px;font:400 13px var(--sans);display:grid;gap:9px;align-content:start;margin:0}
.fiche .meta dt{font:700 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fiche .meta dd{margin:0}
.fiche details{margin-top:10px}
.fiche summary{cursor:pointer;font:700 13.5px var(--sans);color:var(--navy-2)}
.fiche ul.srcs{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px;font:400 13.5px var(--sans)}
.fiche ul.srcs li{display:grid;grid-template-columns:6.5em 1fr;gap:8px}
.fiche ul.srcs .d{font:400 11.5px var(--mono);color:var(--muted)}
.fiche.flash{box-shadow:0 0 0 3px var(--navy-2)}
.sevb{display:inline-grid;place-items:center;width:30px;height:30px;font:900 15px var(--sans);color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--sheet));border:1.5px solid var(--c);flex:0 0 auto}
.chip{font:700 11px var(--sans);letter-spacing:.03em;border:1px solid var(--rule-2);color:var(--ink-2);padding:1px 8px;border-radius:999px;white-space:nowrap}
.chip.up{color:var(--sev5);border-color:var(--sev5)} .chip.down{color:var(--sev1);border-color:var(--sev1)}
.chip.nuc{color:var(--navy-2);border-color:var(--navy-2);display:inline-flex;align-items:center;gap:5px}
.chip .ico{width:12px;height:12px;fill:currentColor;flex:0 0 auto}
.sortbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;font:400 13px var(--sans);color:var(--muted)}
.sortbar button{font:700 12.5px var(--sans);color:var(--ink-2);background:var(--sheet);border:1px solid var(--rule-2);padding:5px 12px;border-radius:999px;cursor:pointer}
.sortbar button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* ---------- postures, échéances ---------- */
.post{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font:400 14px var(--sans);padding:8px 0;border-top:1px solid var(--rule)}
.post:first-of-type{border-top:0;padding-top:0}
.pill{font:700 11.5px var(--sans);padding:3px 9px;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--sheet));white-space:nowrap}
.watch{margin:0;padding:0;list-style:none;display:grid;gap:10px;font:400 14px/1.45 var(--sans)}
.watch li{display:grid;grid-template-columns:60px 1fr;gap:10px}
.watch .dt{font:700 12px var(--mono);color:var(--navy-2);padding-top:1px}
.ech{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}
.ech .card{display:grid;gap:7px;align-content:start}
.ech b.n{font:700 16px/1.3 var(--serif)}
.ech .steps{display:flex;flex-wrap:wrap;gap:3px}
.ech .steps span{font:400 11px var(--mono);padding:2px 6px;border:1px solid var(--rule-2);color:var(--muted)}
.ech .steps span.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.ech .now{font:400 14px/1.5 var(--sans)}
.ech details{font:400 13px/1.5 var(--sans);color:var(--ink-2)}
.ech summary{cursor:pointer;font-weight:700;color:var(--navy-2)}

/* ---------- signaux ---------- */
.sig h4 .ic{font:700 11px var(--mono);padding:1px 7px;color:var(--sheet);background:var(--c);letter-spacing:0}
.sig ul{margin:0;padding-left:18px;display:grid;gap:8px;font:400 14.5px/1.5 var(--sans)}
.reserve{font:400 14.5px/1.6 var(--sans);border-left:4px solid var(--sev4)}
.lst{margin:0;padding-left:18px;display:grid;gap:7px;font:400 14.5px/1.5 var(--sans)}

/* ---------- note complète ---------- */
.prose{max-width:70ch;font-size:16.5px}
.prose h2{font:700 22px/1.3 var(--serif);margin:34px 0 10px;padding-top:12px;border-top:2px solid var(--ink);scroll-margin-top:100px}
.prose h2:first-child{margin-top:0}
.prose h3{font:700 13px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin:24px 0 8px;scroll-margin-top:100px}
.prose p,.prose li{margin:0 0 12px}
.prose ul,.prose ol{padding-left:20px}
.prose table{font:400 14px var(--sans);margin:6px 0 18px;border-collapse:collapse;display:block;overflow-x:auto}
.prose th,.prose td{border-bottom:1px solid var(--rule);padding:6px 10px;text-align:left}
.toc a{display:block;padding:6px 16px;font:400 13.5px/1.4 var(--sans);color:var(--ink-2);text-decoration:none;border-left:3px solid transparent}
.toc a.h3{padding-left:28px;font-size:12.5px}
.toc a:hover{background:var(--tint)}

/* ---------- tableaux ---------- */
.tw{overflow-x:auto;border:1px solid var(--rule);background:var(--sheet)}
table.t{border-collapse:collapse;width:100%;font:400 14px var(--sans)}
table.t th{font:700 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--ink);padding:8px 10px;background:var(--sheet);position:sticky;top:0}
table.t td{border-bottom:1px solid var(--rule);padding:9px 10px;vertical-align:top}
table.t td.num{white-space:nowrap}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ctl select,.ctl input{font:400 14px var(--sans);color:var(--ink);background:var(--sheet);border:1px solid var(--rule-2);border-radius:4px;padding:8px 10px}
.ctl input{flex:1;min-width:min(100%,220px)}
.formula{font:400 12.5px/1.65 var(--mono);background:var(--tint);padding:14px 16px;overflow-x:auto;white-space:pre;margin:0}
.dots i{display:inline-block;width:9px;height:9px;margin-right:2px;background:var(--c)}
footer.ft{border-top:1px solid var(--rule);background:var(--sheet);margin-top:48px}
footer.ft .wrap{padding-block:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 20px;font:400 12.5px var(--sans);color:var(--muted)}
footer.ft a{color:var(--ink-2);text-decoration:none;margin-left:14px}

@media (max-width:1100px){.l-rail{grid-template-columns:minmax(0,1fr) 320px}.mainnav .top{padding:0 9px}}
@media (max-width:960px){
  .mainnav,.hdr .tools .relsel{display:none}

  .classif #stamp{display:none}
  .l-rail,.l-side{grid-template-columns:1fr}
  .side{position:static}
  .side .links{display:flex;overflow-x:auto;scrollbar-width:none}
  .side .links a{flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;grid-template-columns:auto auto}

}
@media (max-width:640px){
  body{font-size:16px}
  .hdr .wrap{min-height:56px;gap:12px}
  .brand b{font-size:15px}
  .brand small{display:none}
  .doc{padding:22px 18px 26px}
  h1{font-size:24px}
  .chapeau{font-size:16.5px}
  .pk{padding:16px}
  .pagehead{grid-template-columns:1fr;padding:18px}
  .fiche{grid-template-columns:1fr}
  .fiche .meta{border-left:0;border-top:1px solid var(--rule)}
  .dbars{grid-template-columns:1fr auto}
  .dbars .tk,.ax5{grid-column:1/3}
  .dbars .tk{margin-top:-4px}
  .dbars{row-gap:8px;grid-auto-flow:row dense}

  .heat .r{grid-template-columns:1fr}

}

/* ---------- note : modèle « Dossier » ---------- */
.dossier .kick{display:flex;justify-content:space-between;gap:12px;font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink);padding-bottom:8px}
.dossier h1{font-size:34px;line-height:1.16;margin:18px 0 14px;letter-spacing:-.012em}
.dossier .chapeau{font-size:19px}
.dropcap::first-letter{float:left;font:700 3.35em/.8 var(--serif);margin:.08em .12em 0 0;color:var(--navy-2)}
.lv3{display:none;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 0 24px}
.lv3 a{padding:10px 4px;text-align:center;border-left:1px solid var(--rule);text-decoration:none;color:inherit}
.lv3 a:first-child{border-left:0}
.lv3 b{display:block;font:900 32px/1 var(--sans);color:var(--c)}
.lv3 span{font:700 9.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lv3 .delta{display:block;margin-top:3px;font-size:11px}
.sh{font:700 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--navy-2);display:flex;align-items:center;gap:12px;margin:30px 0 8px}
.sh::after{content:"";flex:1;height:1px;background:var(--rule-2);order:1}
.sh a{order:2;font-weight:700;letter-spacing:0;text-transform:none;font-size:13px;white-space:nowrap}
.pts{display:grid}
.pt{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--rule)}
.pt:first-child{border-top:0;padding-top:6px}
.pt .n{font:700 13px var(--mono);color:var(--navy-2);padding-top:2px}
.pt .fig{display:inline-block;font:900 13.5px var(--sans);color:var(--c);border-bottom:2px solid var(--c);margin-bottom:6px;padding-bottom:1px}
.pt h3{font:700 17px/1.3 var(--serif);margin:0 0 4px}
.pt p{margin:0;max-width:66ch}
.pull,.prose blockquote{margin:26px 0;padding:6px 0 6px 18px;border-left:3px solid var(--navy-2);font:italic 400 21px/1.42 var(--serif);color:var(--ink);max-width:40ch}
.pull small,.prose blockquote small{display:block;font:700 10.5px var(--sans);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.prose blockquote p{margin:0}
.prose .rt{font:400 11.5px var(--mono);color:var(--muted);margin:-4px 0 14px}
.prose h3{color:var(--navy-2)}
.notebar{display:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;background:var(--sheet);border-bottom:1px solid var(--rule);margin:0 -16px}
.notebar button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border:0;background:none;font:700 13.5px var(--sans);color:var(--ink);cursor:pointer;text-align:left}
.notebar button span{font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.notebar .bar{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--navy-2)}
.notebar .list{max-height:60vh;overflow-y:auto;border-top:1px solid var(--rule);padding:6px 0;box-shadow:var(--shadow)}
.notebar .list a{display:block;padding:8px 16px;font:400 14px/1.4 var(--sans);color:var(--ink-2);text-decoration:none}
.notebar .list a.h3{padding-left:30px;font-size:13px}
.notebar .list a.on,.toc a.on{color:var(--navy-2);font-weight:700}
.toc a.on{border-left-color:var(--navy-2)}
@media (max-width:960px){.notebar{display:block}.l-side>.toc{display:none}}
@media (max-width:640px){
  .tiles.hide-m{display:none}
  .lv3{display:grid}
  .dossier{padding:20px 18px 28px}
  .dossier h1{font-size:27px;margin-top:14px}
  .dossier .chapeau{font-size:17px}
  .pull,.prose blockquote{font-size:18px}
  .prose{font-size:16px}
  .prose h2{font-size:22px}
  .crumbs{margin-bottom:10px}
}

/* ---------- carte de situation ---------- */
.map{position:relative;min-width:0}
.map svg{display:block;width:100%;height:auto}
.map .land{stroke:var(--map-dot);stroke-width:2.5;stroke-linecap:round;fill:none}
.map .spot{cursor:pointer;outline:none}
.map .spot .core{stroke:var(--sheet);stroke-width:1.5}
.map .spot:hover .core,.map .spot:focus-visible .core{stroke:var(--ink);stroke-width:2}
.map .sel{fill:none;stroke:var(--ink);stroke-width:2}
.map .halo{fill:none;stroke-width:1.2;opacity:.6}
.map .tag{font:700 12.5px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round}
.map .frm rect{fill:var(--navy-2)} .map .frm text{font:900 8px var(--sans);fill:var(--sheet)}
.map .dim{opacity:.22}
.mapcard{display:grid;grid-template-columns:minmax(0,1fr) 330px;margin-bottom:24px}
.mapcard>.m{padding:16px 18px 14px;border-right:1px solid var(--rule);min-width:0}
.maphead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.maphead h2{font:700 20px var(--serif);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:700 12px var(--sans);color:var(--ink-2);background:var(--sheet);border:1px solid var(--rule-2);padding:4px 11px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:4px;overflow:hidden}
.seg button{font:700 12px var(--sans);color:var(--ink-2);background:var(--sheet);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy-2);color:var(--sheet)}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font:400 12px var(--sans);color:var(--ink-2);margin-top:8px}
.mlegend i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);vertical-align:-1px;margin-right:5px}
.mlegend i.ring{background:none;border:1.5px solid var(--c)} .mlegend i.sq{border-radius:0;background:var(--navy-2)}
.mlegend .hint{margin-left:auto;color:var(--muted)}
.mdet{padding:18px;display:grid;gap:8px;align-content:start;min-width:0}
.mdet>*{min-width:0}
.mdet .nav button{min-width:0;flex:0 1 auto}
.mdet h3{font:700 20px/1.25 var(--serif);margin:0}
.mdet .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mdet .v{font:400 12.5px/1.55 var(--mono);color:var(--ink-2)}
.mdet p{margin:0;font-size:15px;line-height:1.55}
.mdet .go{font:700 13.5px var(--sans)}
.mdet .nav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--rule);padding-top:10px;margin-top:4px}
.mdet .nav button{font:700 12.5px var(--sans);color:var(--navy-2);background:none;border:0;cursor:pointer;padding:4px 0;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.mstats .card b{display:block;font:900 26px/1.1 var(--sans);margin-bottom:4px}
.mstats .card{font:400 13.5px/1.5 var(--sans);color:var(--ink-2)}
.mlist{max-height:680px;overflow-y:auto;overscroll-behavior:contain}
.mlist .it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px;padding:9px 16px;border-top:1px solid var(--rule);align-items:center;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;font:inherit;color:inherit}
.mlist .it:hover{background:var(--tint)}
.mlist .it.on{background:var(--tint);box-shadow:inset 3px 0 0 var(--navy-2)}
.mlist .it b{font:700 14px var(--sans)} .mlist .it small{grid-column:2/4;font:400 12.5px/1.45 var(--sans);color:var(--ink-2)}
.mlist .tr{font:700 12px var(--sans)}
.loc{border:1px solid var(--rule);background:var(--sheet);margin-bottom:2px}
.loc .land{stroke-width:2}
.picto{display:inline-grid;place-items:center;color:var(--navy-2)}
.picto svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side a.ic{grid-template-columns:20px 1fr auto}
.side a.ic .picto{width:18px;height:18px}
.side a.ic i{grid-column:1/4}
.pagehead .phi{display:flex;gap:16px;align-items:flex-start}
.pagehead .phi>.picto{width:52px;height:52px;border:1.5px solid var(--navy-2);flex:0 0 auto;padding:10px;margin-top:4px}
@media (max-width:1100px){.mapcard{grid-template-columns:minmax(0,1fr) 280px}}
@media (max-width:960px){.mlist{max-height:none}.mapcard{grid-template-columns:1fr}.mapcard>.m{border-right:0;border-bottom:1px solid var(--rule)}.mstats{grid-template-columns:1fr}.side .links a.ic{grid-template-columns:auto auto auto}}
@media (max-width:640px){.mapcard>.m{padding:12px 10px}.mlegend .hint{display:none}.map .land{stroke-width:3}.pagehead .phi>.picto{width:42px;height:42px;padding:8px}}
/* ---------- ouverture animée ---------- */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.intro .i-map{position:absolute;inset:0}
.intro .i-map svg{width:100%;height:100%}
.intro .i-land{fill:none;stroke-linecap:round;stroke-width:2.6}
.intro .i-scan{stroke-width:1.5}
.intro .i-dot{fill:var(--c)}
.intro .i-ring{fill:none;stroke:var(--c);stroke-width:1.3}
.intro .i-spot,.intro .i-fr,.intro .i-card,.intro .i-lv>div,.intro .i-foc{opacity:0}

.intro .i-card{position:relative;text-align:center;max-width:560px;padding:28px 28px 24px}

.intro h2{font:700 clamp(28px,6vw,44px)/1.1 var(--serif);margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}
.intro .i-sub{font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;margin:0 0 22px}

.intro .i-lv div{padding:12px 6px}

.intro .i-lv b{display:block;font:900 40px/1 var(--sans);color:var(--c)}
.intro .i-lv span{display:block;font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}

/* variante 1 : bleu nuit */
.intro.v1{background:#0e1a30;color:#e3e9f3}

/* rubrique Carburant */
.cblink{display:block;text-decoration:none;color:var(--ink);font:600 14px var(--sans)}.cblink:hover{border-color:var(--rule-2)}.cblink span:last-child{color:var(--navy-2)}

ine-Maritime, Landes (bulletin du 19/11 6 h 02, maintenu le 20/11), orange crues Canche, ORSEC inondation dans le Pas-de-Calais (19/11, 112 communes). Aucune vigilance rouge. Carte du 21-22/11 non lue (vigilance.meteofrance.fr injoignable).", "url": "https://vigilance.meteofrance.fr/fr/vigilance-accessible"}, {"nom": "ORSAN (organisation de la réponse du système de santé)", "autorite": "Ministère de la Santé / ARS (volets AMAVI, CLIM, EPI-VAC, BIO, NRC)", "niveaux": ["niveau 1 – surveillance", "niveau 2 – coordination renforcée", "niveau 3 – mobilisation maximale (déprogrammations ciblées)", "niveau 4 – dépassement des capacités nationales"], "niveau_actuel": "aucune activation nationale trouvée au 22/11", "date_niveau_actuel": "2026-11-22", "historique_2026": "Niveau 2 activé le 23 juin 2026 puis niveau 3 activé nationalement le 25 juin 2026 (72 départements, 51,1 M d'habitants, réserve sanitaire mobilisée) — première activation nationale simultanée du niveau 3 ; date de désactivation non retrouvée ; aucune activation signalée en septembre. Aucune activation signalée du 18 au 21 septembre 2026. Aucune activation signalée du 22 au 28 septembre 2026 (ministère de la Santé non consulté ; aucune vigilance canicule). Aucune activation signalée du 28 septembre au 6 octobre 2026 (recherche presse ; ministère de la Santé non consulté) ; lors de l'épisode cévenol du 30/09, seul un aménagement d'activité du CHU de Nîmes (report des rendez-vous non urgents) est rapporté. — Relevé du 23/10/2026 : Aucune activation ORSAN signalée du 06 au 23/10/2026 (recherche presse limitée ; ministère de la Santé non consulté), y compris après les violences du 17/10 (997 membres des forces de l'ordre blessés) et pendant la tempête Austen. — Relevé du 25/10/2026 : aucune activation ORSAN repérée du 23 au 25/10/2026 (recherche limitée). — Relevé du 01/11/2026 : aucune activation trouvée ; source ministère/ARS non joignable. — Relevé du 22/11/2026 : aucune activation ORSAN trouvée du 15 au 22/11 ; seul le plan ORSEC inondation (et non ORSAN) a été déclenché dans le Pas-de-Calais le 19/11. Source ministère/ARS non consultée.", "url": "https://www.journaldeleconomie.fr/orsan-niveau-3-comment-sante-canicule/"}, {"nom": "Vigilance canicule / plan de gestion des vagues de chaleur", "autorite": "Météo-France (vigilance) / ministère de la Santé, Santé publique France", "niveaux": ["vert – pas de vigilance", "jaune – pic de chaleur", "orange – canicule", "rouge – canicule extrême"], "niveau_actuel": "vert – hors saison ; bilan provisoire ≈ 7 824 décès en excès (SPF, 16/09), bilan consolidé non paru", "date_niveau_actuel": "2026-11-22", "historique_2026": "Quatre épisodes : 24-28 mai (≥ 300 décès en excès), 17 juin-2 juillet (5 764 décès en excès, 72 départements rouges le 25 juin, température moyenne nationale record de 30 °C les 24-25 juin), 3-20 juillet (≥ 1 243), 27 juillet-20 août (≥ 817, 79 départements, durée record égalant juillet 1983) ; ≥ 7 800 décès en excès cumulés, été le plus meurtrier depuis 2003 ; bilan consolidé SPF à venir. Aucun nouveau bilan SPF depuis le 16/09/2026 ; aucune vigilance au 20-21/09. Aucune vigilance canicule du 22 au 28/09/2026 malgré un pic de chaleur tardif annoncé (> 30 °C le 29/09) ; aucun nouveau bilan SPF depuis le 16/09 (≥ 7 800 décès en excès). Aucune vigilance canicule du 29/09 au 06/10/2026 (bulletin Météo-France du 06/10 : pluie-inondation et orages seulement) ; toujours pas de bilan consolidé SPF (dernier : 16/09, ≥ 7 800 décès en excès ; ≈ 7 919 selon l'addition de presse du 17/09). — Relevé du 23/10/2026 : Aucune vigilance canicule du 06 au 23/10/2026 (bulletin du 22/10 : vent, pluie-inondation, orages, vagues-submersion) ; aucun nouveau bilan SPF repéré depuis celui du 16/09 (≥ 7 800 décès en excès). — Relevé du 25/10/2026 : toujours pas de bilan consolidé SPF ; SPF indique un bilan définitif attendu début 2027 (périmètre de surveillance 01/06-15/09) ; provisoire cumulé 7 919 décès en excès (presse du 17/09). Aucune ais : indisponibilité de la source électrique externe auxiliaire au-delà du délai autorisé), déclarés au niveau 1 par EDF ; aucun avis daté d'octobre au 06/10, aucun événement ≥ 2. — Relevé du 23/10/2026 : ASNR : le 09/10/2026, avis sur Cattenom 3 (réglage erroné des soupapes du circuit de réfrigération à l'arrêt) et Saint-Laurent-des-Eaux 1 (soupape bloquée sur l'injection aux joints des pompes primaires) ; le 14/10, détection tardive d'un dépassement de débit de fuite du circuit primaire (réacteur 2, site non précisé) ; le 22/10, non-respect des RGE après indisponibilité d'une soupape. Niveaux INES non indiqués ; aucun événement de niveau 2 ou plus. — Complément du 23/10/2026 (soir) : Niveaux INES des avis d'octobre confirmés sur les pages ASNR : Cattenom 3 (niveau 1, déclaré le 05/10, publié le 09/10) ; Saint-Laurent-des-Eaux 1 (niveau 1 après reclassement le 30/09, publié le 09/10) ; Cruas-Meysse 2 (fuite du circuit primaire du 25/09, niveau 1, publié le 14/10) ; EPR de Flamanville (non-respect des RGE le 01/10, niveau 1, publié le 22/10). Aucun événement de niveau 2 ou plus. — Relevé du 25/10/2026 : aucun nouvel avis ASNR repéré après celui du 22/10 (Flamanville EPR) ; aucun événement de niveau 2 ou plus (liste ASNR non consultable directement). — Relevé du 01/11/2026 : pas de nouvel avis ASNR trouvé ; page ASNR non joignable. 13/11 : avis ASNR de niveau 1 (sas d'accès à l'espace entre-enceinte). — Relevé du 22/11/2026 : EDF déclare trois événements de niveau 1 : Cattenom 2 (reclassé du niveau 0 au niveau 1 le 4/11), Cruas-Meysse 1 (équipement indisponible, 12/11 ; manutention de combustible, 13/11). Aucun avis ASNR nouveau trouvé du 16 au 22/11 ; aucun événement de niveau 2 ou plus.", "url": "https://reglementation-controle.asnr.fr/controle/ines-et-asn-sfro"}, {"nom": "CERT-FR – alertes de sécurité (CERTFR-AAAA-ALE-nnn)", "autorite": "ANSSI / CERT-FR", "niveaux": ["pas d'échelle de niveau : alerte ouverte / alerte clôturée (indicateur = nombre d'alertes ouvert l'Alliance et les marchés", "chapeau": "Stabilité mondiale 1,96 (niveau 2), risque de guerre 1,99 affiché au niveau 3 par le plancher, France 2,29 (niveau 3). Aucun palier franchi. Le financier, l'aérien et l'hybride se dégradent (VIX à 35,9, missiles en Pologne, Moldavie fermée), tandis que Shenzhen, Berlin et le reflux des ruptures de carburant apportent une détente relative.", "points_cles": [{"titre": "Missiles en Pologne", "texte": "Deux Kh-101 et un drone russes tombés dans le sud-est de la Pologne le 20/11, sans victime ; réunion du Conseil de l'Atlantique Nord le 23/11, article 4 non confirmé.", "chiffre": "3 objets", "sev": 5}, {"titre": "Krach des valeurs IA", "texte": "S&P −3,7 % et Nasdaq −5,3 % le 20/11 ; VIX 35,89 (pic 40), or −9 % sur la semaine par appels de marge ; 10 ans US à 4,92 %.", "chiffre": "VIX 35,89", "sev": 4}, {"titre": "Golfe : tirs croisés", "texte": "Frappe américaine sur Qeshm, ripostes iraniennes au Koweït et à Bahreïn (18 et ≈ 21/11) ; pétrolier touché à Ormuz (UKMTO, 16/11) ; trois porte-avions US.", "chiffre": "3 porte-avions", "sev": 5}, {"titre": "Ukraine : salve massive", "texte": "84 missiles de croisière, des balistiques et 404 drones dans la nuit du 19 au 20/11 ; au moins 8 morts, Lviv touchée.", "chiffre": "404 drones", "sev": 5}, {"titre": "Shenzhen et Berlin", "texte": "Trilatérale Xi–Trump–Poutine (19/11) sans engagement chiffré ; à Berlin, Moscou accepterait un format de négociation avec l'Europe (Kushner).", "chiffre": "déclaration en 4 points", "sev": 3}, {"titre": "France : budget sous tension", "texte": "PLFSS adopté au Sénat (201-124) avec la réforme des retraites ; rapport général : récession « pas à exclure » ; spread à 156 pb avant la revue S&P du 27/11.", "chiffre": "156 pb", "sev": 4}], "exergue": {"texte": "« Une récession n'est pas à exclure » et le risque d'une crise de financement « ne peut plus être écarté ».", "source": "Rapport général du Sénat sur le PLF 2027, 19 novembre 2026"}, "appreciation": ["Le système international reste en crise systémique sans guerre mondiale. L'indice de guerre, calculé à 1,99, est affiché à 3 par le plancher : les missiles tombés en Pologne ne constituent pas, en l'état, un tir direct et délibéré contre un allié, et l'article 5 n'est pas invoqué.", "La semaine marque un double débordement. Militaire d'abord : la campagne russe atteint le territoire de l'OTAN et ferme l'espace aérien moldave. Financier ensuite : le dénouement du pari sur l'IA fait bondir la volatilité et provoque des ventes forcées d'or, alors que la Fed reste restrictive. Dans le Golfe, la guerre d'usure maritime devient un échange de frappes directes entre les États-Unis et l'Iran.", "En France, la rue reflue (146 000 manifestants le 17/11) et la pénurie de carburant s'efface (1,7 % des stations sans gazole), mais le budget se tend : CMP du PLFSS le 26/11, revue S&P le 27/11 et Sénat alarmiste sur la croissance. Fractures françaises 2026 confirme une colère majoritaire.", "Réserve : le quota de recherche a été épuisé à mi-balayage. Une vingtaine d'indicateurs sont reportés sans fait nouveau, et les spreads de crédit après le krach comme l'issue de l'AIEA et du CAN du 23/11 restent inconnus."], "echeances": [{"date": "2026-11-23", "texte": "Conseil de l'Atlantique Nord sur les missiles tombés en Pologne"}, {"date": "2026-11-26", "texte": "CMP du PLFSS 2027 ; journée de mobilisation intersyndicale"}, {"date": "2026-11-27", "texte": "Revue S&P de la note de la France ; IPC provisoire de novembre et PIB T3 détaillé (INSEE)"}, {"date": "2026-11-29", "texte": "Prochain relevé"}, {"date": "2026-11-30", "texte": "Fin de l'injonction de déstockage SAGESS de novembre"}, {"date": "2026-12-01", "texte": "Recommandations Hegseth sur les forces US en Europe ; OCDE Economic Outlook et SIPRI Top 100 (début décembre, dates à confirmer)"}, {"date": "2026-12-09", "texte": "Décision de la Fed (8-9/12) ; vote du PLF 2027 au Sénat"}, {"date": "2026-12-15", "texte": "Fenêtre des parutions de décembre : ACLED Conflict Index, IISS Armed Conflict Survey, ERS de la Banque de France"}], "postures": [{"nom": "Vigipirate", "etat": "Vigilance renforcée (posture été-automne, pas de posture hiver au 22/11)", "sev": 3}, {"nom": "Vigilance météo", "etat": "Orange pluie-inondation Somme, Pas-de-Calais, Seine-Maritime, Landes (17-20/11) ; carte du 22/11 non lue", "sev": 3}, {"nom": "État d'urgence", "etat": "Non déclaré", "sev": 1}, {"nom": "CERT-FR", "etat": "≈ 7 alertes ouvertes (ALE-016 et ALE-017 du 18/11)", "sev": 4}, {"nom": "Notations", "etat": "Aucune action ; S&P le 27/11", "sev": 3}, {"nom": "Carburant", "etat": "Indice niveau 3 · 1,7 % gazole en rupture", "sev": 3}], "lecture_monde": "L'aérien (4,52) et le maritime (4,51) restent les domaines les plus sévères ; le financier se dégrade le plus (3,61 → 3,81) avec le krach de l'IA, alors que la diplomatie s'ouvre un peu (3,18 → 3,09) avec Shenzhen et Berlin.", "lecture_france": "Tension intérieure 2,00 (budget, conjoncture), risque extérieur 2,45 (Golfe), alertes officielles 2,51 : aucune posture officielle n'a changé de niveau ; la pénurie de carburant reflue et l'indice remonte au niveau 3.", "palier_guerre": "Au 22 nov. 2026 : aucune des deux conditions n'est remplie. Les missiles russes tombés en Pologne (20/11) ne sont pas établis comme un tir délibéré contre les forces d'un allié ; l'article 4 n'est pas confirmé et l'article 5 n'est pas invoqué ; les échanges entre les États-Unis et l'Iran n'opposent pas deux puissances nucléaires. Le niveau calculé (1,99, arrondi 2) est relevé à 3 ; la valeur continue est conservée.", "palier_france": "Au 22 nov. 2026 : Vigipirate en « vigilance renforcée », aucun état d'urgence, gouvernement en place, aucune motion de censure ni dégradation de note. Le niveau calculé (2,29, arrondi 2) est relevé à 3."}, "carburant": {"date": "2026-11-22", "titre": "Carburant : la pénurie s'efface, 1,7 % de stations sans gazole et l'indice remonte au niveau 3, mais l'Est reste fragile et Ormuz menacé", "chapeau": "Au relevé du 22 novembre, le gazole s'affiche à 2,124 €/L (−2,5 c en 7 jours) avec 1,7 % de stations en rupture (163), contre 2,9 % le 15 novembre, et le SP95-E10 à 1,958 €/L avec 3,0 % (234) ; l'indice de tension est remonté au niveau 3 (« Tension marquée », 2,7) le 20/11, avec des foyers dans le Doubs et le Territoire de Belfort (jusqu'à 20 % sans gazole). En amont, le Brent recule vers 92 $ (20/11, troisième baisse hebdomadaire), mais un pétrolier a encore été touché à Ormuz le 16/11 et l'injonction de déstockage stratégique prend fin le 30/11.", "amont": {"sev": 4, "texte": "Approvisionnement amont toujours tendu sans rupture nationale : brut en baisse vers 92 $, mais Ormuz sous attaques, marge diesel et stocks stratégiques non vérifiés cette semaine, fin de l'injonction SAGESS le 30/11.", "facteurs": [{"nom": "Brent", "valeur": "≈ 92 $ (20/11) ; 91,95 $ (18/11)", "tendance": "baisse", "texte": "Troisième baisse hebdomadaire (95,84 $ le 13/11), sur fond de risk-off et de stocks américains en hausse (+3,4 Mb)."}, {"nom": "Détroit d'Ormuz", "valeur": "pétrolier touché le 16/11 (UKMTO 207-26)", "tendance": "stable", "texte": "Au moins 4 pétroliers touchés depuis le 15/11 ; tirs croisés États-Unis–Iran autour de Qeshm et de Bahreïn."}, {"nom": "Mer Rouge / Arabie", "valeur": "tirs houthis sur Riyad (15-20/11)", "tendance": "stable", "texte": "La route de contournement saoudienne (oléoduc Est-Ouest, Yanbu) reste exposée."}, {"nom": "Stocks stratégiques", "valeur": "injonction SAGESS jusqu’au 30/11", "tendance": "stable", "texte": "Aucune annonce trouvée sur une prolongation en décembre ; stocks en jours non publiés."}, {"nom": "Marge diesel Europe", "valeur": "non trouvée (16-22/11)", "tendance": "stable", "texte": "Dernière valeur connue ≈ 70-88 $/b début novembre ; à vérifier."}, {"nom": "Ruptures aval", "valeur": "gazole 1,7 % · E10 3,0 % · SP98 5,2 %", "tendance": "baisse", "texte": "Reflux net depuis le 15/11 (2,9 % et 6,5 %) ; fo const REPORT = "<p>Relevé du <strong>dimanche 22 novembre 2026<\/strong>, comparé à celui du 15 novembre. Modèle v3 inchangé. Le balayage a été <strong>sévèrement limité<\/strong> : le quota de recherche web de la session (200 requêtes, partagé entre les six agents de collecte) a été épuisé à mi-parcours, et WebFetch a de nouveau été refusé sur la plupart des domaines (FRED, EASA, Critical Threats, Météo-France, Institut Montaigne…). Les faits proviennent donc d'extraits de recherche : presse, relais d'avis officiels (UKMTO, EASA, INSEE, Sénat, CERT-FR, SPF, Fed, BCE) et quelques sources secondaires. Une vingtaine d'indicateurs (monde et France) sont reportés sans fait nouveau, avec la tendance « stable ».<\/p>\n<p>En une phrase : <strong>la guerre russe déborde à nouveau sur le territoire de l'OTAN et les marchés décrochent<\/strong>. Deux missiles et un drone russes sont tombés en Pologne le 20 novembre, le krach des valeurs IA a porté le VIX à son plus haut de l'année, et le Golfe reste un théâtre de tirs croisés entre les États-Unis et l'Iran. À l'inverse, le sommet de Shenzhen et la réunion de Berlin rouvrent des canaux diplomatiques, et la pénurie de carburant reflue en France.<\/p>\n<blockquote><p>Deux missiles de croisière Kh-101 et un drone russes tombés dans le sud-est de la Pologne : une « violation grave » de l'espace aérien allié.<\/p><p><small><a href=\"https://www.pbs.org/newshour/world/nato-calls-russian-missiles-landing-in-poland-a-grave-violation-of-airspace\" target=\"_blank\" rel=\"noopener\">PBS NewsHour<\/a> · 20 novembre 2026<\/small><\/p><\/blockquote>\n\n<h2>Monde : ce qui a changé<\/h2>\n<p>Indices : stabilité <strong>1,96<\/strong> (−0,03 ; niveau 2 « Crise systémique »), risque de guerre <strong>1,99<\/strong> (−0,01 ; calculé 2, affiché <strong>3<\/strong> « Risque élevé » par le plancher). Couche conjoncturelle 3,96 (stabilité) et 3,94 (guerre), contre 3,91 et 3,92 ; couche structurelle inchangée (4,23 et 4,19). La légère dégradation tient au financier (3,61 → 3,81), à l'aérien (4,37 → 4,52) et à l'hybride (4,31 → 4,40) ; la diplomatie (3,18 → 3,09) et le maritime (4,56 → 4,51) compensent en partie. Dix indicateurs sur 44 sont en hausse et quatre en baisse.<\/p>\n\n<h3>Géopolitique<\/h3>\n<p><strong>Ukraine (5, hausse).<\/strong> La nuit du 19 au 20 novembre a été l'une des plus lourdes de l'automne : 84 missiles de croisière, des missiles balistiques et 404 drones, dont 79 missiles et 380 drones abattus selon Kyiv. On compte au moins 8 morts, la gare de Lviv a été touchée et l'électricité coupée dans l'ouest du pays (<a href=\"https://thedefensepost.com/2026/11/20/russia-fires-missiles-drones-ukraine/\" target=\"_blank\" rel=\"noopener\">The Defense Post<\/a>, <a href=\"https://www.upi.com/Top_News/World-News/2026/11/20/Ukraine-Russia-mounts-deadly-missile-drone-assault/8421795165920\" target=\"_blank\" rel=\"noopener\">UPI<\/a>, 20/11). C'est cette salve qui a débordé en Pologne.<\/p>\n<p><strong>Guerre États-Unis/Israël–Iran (4, hausse).<\/strong> Les tirs directs reprennent. Les Gardiens ont envoyé six drones vers Bahreïn le 15/11 ; les États-Unis ont frappé un site de missiles à Qeshm vers le 17/11 (date non confirmée par le CENTCOM) ; l'Iran a riposté contre des installations américaines au Koweït (Ali Al Salem) et à Bahreïn le 18/11, puis de nouveau vers le 21/11 (<a href=\"https://www.iranintl.com/en/liveblog/202611214578\" target=\"_blank\" rel=\"noopener\">Iran International<\/a>, <a href=\"https://almouwatin.com/2026/11/22/bahrein-met-fin-a-lalerte-apres-des-attaques-iraniennes-visant-des-systemes-americains/\" target=\"_blank\" rel=\"noopener\">Al Mouwatin<\/a>). Ces échanges n'opposent pas deux puissances nucléaires et n'ouvrent donc pas le palier.<\/p>\n<p><strong>Yémen/Arabie (5, stable).<\/strong> Les tirs houthis restent quasi quotidiens : deux missiles et deux drones ont été interceptés au-dessus de Riyad le 15/11, deux missiles balistiques ont été revendiqués sur l'aéroport King Khalid le 16/11 et d'autres interceptions ont eu lieu le 19/11 (<a href=\"https://www.aljazeera.com/news/2026/11/19/saudi-led-coalition-intercepts-houthi-missiles-targeting-riyadh-and-south\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>). <strong>Soudan (5).<\/strong> L'armée a levé le siège d'El-Obeid et se trouve à environ 60 km d'Al-Nuhud ; l'ACLED compte plus de 30 localités reprises depuis le 1er novembre (<a href=\"https://www.thenationalnews.com/news/mena/2026/11/18/al-burhans-forces-push-towards-rsf-stronghold-as-un-warns-of-sudan-drone-toll/\" target=\"_blank\" rel=\"noopener\">The National<\/a>, 18/11). <strong>RDC (4, stable après la hausse).<\/strong> Nouveaux combats FARDC–FRN à Rurambo le 17/11 et dans le Kalehe le 20/11 ; aucun nouveau bilan de déplacés de l'OCHA.<\/p>\n<p><strong>Indo-Pacifique.<\/strong> Taïwan (3) : le MND recense 230 aéronefs et 187 navires chinois en novembre au 21/11, avec un pic de 30 aéronefs le 13/11 ; deux avions militaires russes sont entrés dans l'ADIZ le 19/11 (<a href=\"https://www.taiwannews.com.tw/news/6479444\" target=\"_blank\" rel=\"noopener\">Taiwan News<\/a>). Corée (3) : aucun tir repéré depuis le 3-4/11. Inde–Pakistan (3) : Islamabad prolonge jusqu'au 23-24/12 la fermeture de son espace aérien aux avions indiens. Sahel (4) et Liban (3) : aucun fait vérifié daté de la semaine.<\/p>\n\n<h3>Diplomatie<\/h3>\n<p><strong>Shenzhen (canal États-Unis–Chine 2, baisse).<\/strong> Après le bilatéral Xi–Trump du 19/11, la première trilatérale Xi–Trump–Poutine a produit une « Déclaration vers la paix » en quatre points. Le texte réaffirme qu'une guerre nucléaire ne doit jamais être menée, mais ne contient aucun engagement chiffré et ne mentionne ni l'Ukraine ni l'Iran (<a href=\"https://www.axios.com/2026/11/19/trump-xi-putin-summit-no-major-deal\" target=\"_blank\" rel=\"noopener\">Axios<\/a>, <a href=\"https://www.mfa.gov.cn/eng./xw/zyxw/202611/t20261119_12063139.html\" target=\"_blank\" rel=\"noopener\">MAE chinois<\/a>). Côté commerce, aucune avancée publique : la trêve court jusqu'au 10/01/2027 et les livraisons de terres rares restent sous leur niveau d'avant-crise.<\/p>\n<p><strong>Ukraine (4, baisse).<\/strong> À Berlin, le 19/11, la Coalition des volontaires a reçu Witkoff et Kushner. Selon Kushner, Moscou accepterait un format multilatéral incluant l'Europe et des garanties de sécurité « de type OTAN » (<a href=\"https://www.kyivpost.com/post/90635\" target=\"_blank\" rel=\"noopener\">Kyiv Post<\/a>). Ce n'est qu'une déclaration, démentie dans les faits par la salve du 20/11. <strong>Iran (4, stable)<\/strong> : aucune avancée, Araghchi refuse tout transfert de l'uranium à 60 %. <strong>Seuil OTAN (4, hausse)<\/strong> : le Conseil de l'Atlantique Nord se réunit le 23/11 ; une demande formelle au titre de l'article 4 n'est pas confirmée par une source officielle. Prévisions (2) : aucune valeur Metaculus ou Polymarket de novembre n'a pu être lue.<\/p>\n\n<h3>Maritime et aérien<\/h3>\n<p><strong>Ormuz (5, stable).<\/strong> L'UKMTO (avis 207-26) signale un pétrolier touché par un projectile à 20 milles au nord-est de Khasab le 16/11, au lendemain d'une attaque dans le Golfe. L'Iran revendique trois pétroliers « minés », dont un démenti par le CENTCOM (<a href=\"https://gcaptain.com/ukmto-reports-two-tanker-attacks-in-strait-of-hormuz/\" target=\"_blank\" rel=\"noopener\">gCaptain<\/a>). Aucun avis JMIC postérieur au 12/11 ni aucun chiffre PortWatch n'a été trouvé. <strong>Porte-avions (5, hausse)<\/strong> : l'USS Theodore Roosevelt est arrivé le 16/11, ce qui fait trois groupes aéronavals au CENTCOM, une première depuis avril (<a href=\"https://www.stripes.com/branches/navy/2026-11-16/roosevelt-middle-east-iran-attacks-bahrain-23481485.html\" target=\"_blank\" rel=\"noopener\">Stars and Stripes<\/a>). <strong>Mer Noire (5)<\/strong> : des drones russes ont endommagé des équipements portuaires et plusieurs navires civils près d'Odessa le 17/11.<\/p>\n<p><strong>Aérien.<\/strong> L'EASA a prolongé le 16/11 la CZIB sur la FIR de Djeddah jusqu'au 31/01/2027 et révisé celle sur le Golfe (R4, échéance non lue). Hors Moyen-Orient (4, hausse), deux avions présumés russes sont entrés dans l'espace aérien japonais près d'Okinoshima le 17/11, la première violation russe depuis septembre 2024 (<a href=\"https://news.usni.org/?p=126676\" target=\"_blank\" rel=\"noopener\">USNI News<\/a>). Sur le flanc est (4, hausse), la Pologne a été touchée le 20/11 et la Moldavie a fermé tout son espace aérien le 17/11 après le survol de Chișinău par un Shahed, avec de nouvelles incursions les 20 et 21/11.<\/p>\n\n<h3>Nucléaire, alliances, hybride<\/h3>\n<p>Au Conseil des gouverneurs de l'AIEA, le 19/11, Washington et l'E3 ont accusé l'Iran d'« obstruction » : la seule inspection du trimestre a eu lieu à Bushehr (<a href=\"https://www.al-monitor.com/originals/2026/11/west-presses-iran-iaea-let-inspections-resume-bombed-nuclear-sites\" target=\"_blank\" rel=\"noopener\">Al-Monitor<\/a>). L'issue de la session (résolution ou non) n'est pas connue. En maîtrise des armements (5), Pékin refuse toujours un format trilatéral (16/11) et Moscou exige d'y inclure Paris et Londres. Côté cyber étatique (4, hausse), le relevé intègre un fait omis la semaine dernière : le 9/11, la France a attribué aux Gardiens de la révolution le sabotage des automates frigorifiques d'environ 700 supermarchés. Alliances (réarmement, désengagement américain, évaluations des services) : rien de nouveau trouvé ; les recommandations Hegseth sont attendues début décembre.<\/p>\n\n<h3>Financier<\/h3>\n<p>C'est le domaine qui bouge le plus (3,61 → 3,81). Le 20/11, <strong>le krach des valeurs IA<\/strong> a fait perdre 3,70 % au S&P 500 et 5,28 % au Nasdaq ; le Dow a perdu environ 8 % sur la semaine. Le <strong>VIX<\/strong> a clôturé à 35,89, avec un pic à 40, son plus haut de 2026 (sévérité 3 → 4). La fuite vers la qualité a fait refluer le <strong>10 ans américain<\/strong> à 4,92 % (−12 pb, sévérité 5 → 4). L'<strong>or<\/strong>, vendu pour couvrir des appels de marge, a chuté d'environ 9 % sur la semaine, vers 3 525 $ (2 → 3). Les minutes du FOMC (18/11) restent restrictives ; la probabilité d'une hausse en décembre est passée de 95 % (16/11) à environ 70 % après le krach (chiffre de fin de semaine imprécis). La BCE (revue de stabilité financière du 18/11) juge les risques « élevés ». Le Brent recule pour la troisième semaine, vers 92 $, et le TTF à 82 €/MWh, mais les stocks de gaz européens passent sous 70 % (contre 89 % en moyenne sur cinq ans). Le spread OAT-Bund se retend à 156 pb le 17/11. Les spreads de crédit (HY et IG OAS) après le krach n'ont pas pu être relevés (FRED inaccessible) : c'est la principale inconnue du domaine.<\/p>\n<blockquote><p>VIX à 35,89 le 20 novembre, plus haut de 2026, contre 19,30 une semaine plus tôt.<\/p><p><small>CBOE via presse · 20 novembre 2026<\/small><\/p><\/blockquote>\n\n<h2>France : ce qui a changé<\/h2>\n<p>Niveau national <strong>2,29<\/strong> (+0,02 ; calculé 2, affiché <strong>3<\/strong> « Tension marquée » par le plancher). Sous-niveaux : tension intérieure <strong>2,00<\/strong> (+0,02, « Crise »), risque extérieur <strong>2,45<\/strong> (+0,06, « Risque critique »), alertes officielles <strong>2,51<\/strong> (+0,01, « Alerte modérée »). La couche structurelle monte légèrement (3,71 → 3,72) avec la parution de Fractures françaises 2026.<\/p>\n\n<h3>Tension intérieure<\/h3>\n<p><strong>Budget (5, hausse).<\/strong> Le Sénat a adopté le PLFSS 2027 le 18/11 par 201 voix contre 124 et y a rétabli la réforme des retraites de 2023 ; la commission mixte paritaire est prévue le 26/11 (<a href=\"https://www.publicsenat.fr/actualites/sante/budget-de-la-securite-sociale-le-projet-de-loi-largement-adopte-au-senat-apres-des-modifications-importantes\" target=\"_blank\" rel=\"noopener\">Public Sénat<\/a>). L'examen du PLF a commencé le 20/11, pour un vote d'ensemble le 9/12. Le rapport général du Sénat (19/11) juge la prévision de croissance de 0,5 % « très optimiste », écrit qu'« une récession n'est pas à exclure » et que le risque d'une crise de financement « ne peut plus être écarté » (<a href=\"https://www.senat.fr/rap/l26-156-1/l26-156-11.pdf\" target=\"_blank\" rel=\"noopener\">Sénat<\/a>). Une loi spéciale reste possible mi-décembre. <strong>Gouvernement (4, stable)<\/strong> : aucune motion de censure ni 49.3 ; le rétablissement de la réforme des retraites promet une CMP difficile.<\/p>\n<p><strong>Conjoncture (4, hausse).<\/strong> Le climat des affaires de l'INSEE perd deux points en novembre, à 95, dans tous les secteurs ; le commerce de détail tombe à 89 (<a href=\"https://www.insee.fr/fr/statistiques/9147327\" target=\"_blank\" rel=\"noopener\">INSEE<\/a>, 20/11). L'inflation d'octobre est confirmée à 3,4 % (IPCH révisé à 3,7 %). <strong>Spread OAT-Bund (4, hausse)<\/strong> : 156,3 pb le 17/11, puis environ 150 pb le 19/11, contre 142 pb le 10/11, à cinq jours de la revue S&P du 27/11. <strong>Mobilisations (5 → 4, baisse)<\/strong> : la grève de la fonction publique du 17/11 a réuni 146 000 manifestants selon l'Intérieur (500 000 selon la CGT), avec seulement 2,59 % de grévistes dans la fonction publique d'État. Une nouvelle journée est annoncée le 26/11 ; le bilan du 21/11 (anniversaire des gilets jaunes) n'a pas été trouvé. <strong>Présidentielle (4)<\/strong> : YouGov (12-17/11) donne Le Pen à 32-34 % au premier tour ; Dominique de Villepin a tenu le 20/11 une conférence de presse présentée comme un lancement de campagne, mais sa candidature n'est confirmée que par une seule source.<\/p>\n\n<h3>Risque extérieur<\/h3>\n<p><strong>Golfe (4, hausse).<\/strong> Les échanges de tirs entre Américains et Iraniens touchent les pays hôtes des forces occidentales (Koweït, Bahreïn) ; au moins quatre pétroliers ont été touchés à Ormuz depuis le 15/11. Aucun incident ne concerne les forces françaises, dont plus de 900 militaires sont stationnés aux EAU. <strong>Énergie (5, baisse)<\/strong> : le flux officiel des carburants s'améliore nettement (voir ci-dessous), mais la menace sur Ormuz est intacte. <strong>Budget de défense (3)<\/strong> : la mission Défense (63,4 Md€ hors pensions) sera votée avec le PLF ; une loi spéciale gèlerait les engagements nouveaux. Flanc est, FINUL, menace hybride en France, rhétorique russe, Algérie (Christophe Gleizes) et ressortissants : aucune recherche ciblée n'a pu être menée cette semaine, faute de quota ; les valeurs du 15/11 sont reportées. Les missiles tombés en Pologne concernent directement l'Alliance dont la France est membre, mais pas les missions Aigle ou Lynx.<\/p>\n\n<h3>Alertes officielles et postures<\/h3>\n<p><strong>Aucune posture officielle n'a changé de niveau.<\/strong> Vigipirate reste en « vigilance renforcée » sous la posture été-automne 2026 ; aucune posture hiver n'a été repérée à cinq jours de l'ouverture des marchés de Noël. <strong>Météo (3, hausse)<\/strong> : vigilance orange pluie-inondation du 17 au 20/11 sur la Somme, le Pas-de-Calais, la Seine-Maritime et les Landes, et orange crues sur la Canche ; le plan ORSEC inondation a été déclenché pour 112 communes du Pas-de-Calais le 19/11. Aucune vigilance rouge ; la carte du 22/11 n'a pas pu être lue. <strong>CERT-FR (4, hausse)<\/strong> : deux nouvelles alertes le 18/11, ALE-016 (Oracle Java SE, « java4shell ») et ALE-017 (F5 NGINX, preuve de concept publique), soit 17 alertes en 2026 et environ 7 ouvertes (nombre non vérifié). <strong>Fuites de données (4)<\/strong> : 1,55 million de dossiers attribués à France Travail mis en vente le 18/11, origine non établie. <strong>Santé (3)<\/strong> : grippe et bronchiolite en hausse mais au niveau de base (SPF, 18/11) ; West Nile à 222 cas autochtones. <strong>INES (1)<\/strong> : EDF a déclaré deux événements de niveau 1 à Cruas-Meysse 1 (12 et 13/11). ORSAN, FR-Alert et état d'urgence : rien à signaler. Notations : S&P rend sa revue le 27/11.<\/p>\n\n<h3>Carburant<\/h3>\n<p>Le flux officiel (prix-carburants.gouv.fr, 22/11 à 0 h, 9 825 stations) confirme le reflux : <strong>1,7 % des stations sans gazole<\/strong> (163) et 3,0 % sans SP95-E10, contre 2,9 % et 6,5 % le 15/11. Le gazole est à <strong>2,124 €/L<\/strong> (−2,5 centimes en sept jours) et le SP95-E10 à 1,958 €/L. L'indice de tension est remonté du niveau 2 (pénurie régionale) au <strong>niveau 3, « Tension marquée »<\/strong>, le 20/11 (valeur continue 2,7). Les foyers persistent dans l'Est : Doubs (10,9 % sans gazole le 19/11), Territoire de Belfort (13,3 % le 18/11, 20 % au relevé) et Haute-Saône. En amont, le Brent recule vers 92 $, mais Ormuz reste sous attaques. Ni la marge diesel, ni l'état des raffineries, ni le niveau du Rhin, ni la suite de l'injonction de déstockage (qui prend fin le 30/11) n'ont pu être vérifiés : l'appréciation amont (4/5) est reconduite.<\/p>\n\n<h2>Socle structurel<\/h2>\n<p><strong>Une seule édition nouvelle cette semaine : Fractures françaises 2026<\/strong> (14e édition, Ipsos BVA-CESI pour Le Monde, la Fondation Jean-Jaurès, le CEVIPOF et l'Institut Montaigne ; terrain du 30/10 au 3/11, 3 000 personnes). Pour la première fois, 49 % des Français se rangent dans une « France en colère et contestataire » (43 % en 2025, 31 % en 2021). 89 % jugent le pays en déclin et 63 % se disent fortement préoccupés par la situation politique. La colère progresse surtout chez les sympathisants PS (46 %, contre 24 %) (<a href=\"https://www.ipsos.com/sites/default/files/ct/news/documents/2026-11/fractures-francaises-2026-rapport-complet.pdf\" target=\"_blank\" rel=\"noopener\">Ipsos BVA<\/a>, <a href=\"https://www.jean-jaures.org/publication/une-france-en-colere-mais-pas-resignee-les-grands-enseignements-de-fractures-francaises-2026/\" target=\"_blank\" rel=\"noopener\">Fondation Jean-Jaurès<\/a>). L'entrée passe en rang « institut », sévérité 4 en hausse. Le jour exact de parution et le chiffre de 89 % restent à vérifier dans le rapport.<\/p>\n<p>Attendues d'ici fin décembre : l'Armed Conflict Survey 2026 de l'IISS, l'ACLED Conflict Index, le classement SIPRI Top 100 des producteurs d'armes (habituellement début décembre) et l'évaluation des risques du système financier de la Banque de France. Aucune n'était parue au 22/11. L'Ecological Threat Report 2026 de l'IEP n'est toujours pas confirmé sur le site de l'IEP. Faute de quota, MSC, ODNI, WEF, NTI, UCDP, Metaculus long terme, ANSSI et SSMSI n'ont pas été revérifiés (statut « bloqué ») ; leurs entrées conservent leurs valeurs et leurs tendances de série.<\/p>\n\n<h2>Publications de la semaine (niveaux A et C)<\/h2>\n<ul>\n<li><strong>Ipsos BVA / Fondation Jean-Jaurès / Institut Montaigne / CEVIPOF<\/strong> : <a href=\"https://www.ipsos.com/sites/default/files/ct/news/documents/2026-11/fractures-francaises-2026-rapport-complet.pdf\" target=\"_blank\" rel=\"noopener\">Fractures françaises 2026<\/a> (novembre) et l'analyse <a href=\"https://www.jean-jaures.org/publication/une-france-en-colere-mais-pas-resignee-les-grands-enseignements-de-fractures-francaises-2026/\" target=\"_blank\" rel=\"noopener\">« Une France en colère, mais pas résignée »<\/a>.<\/li>\n<li><strong>Chatham House<\/strong> (18/11) : une note sur un service national à finalité européenne pour la défense et la préparation civile.<\/li>\n<li><strong>RUSI<\/strong> : « Ukraine Straddles Diverging Fronts », de J. Watling (18/11), et une étude sur l'intégration des drones tactiques dans le bataillon d'infanterie (19/11).<\/li>\n<li><strong>CSIS<\/strong> (19/11) : une note sur les puissances moyennes du Golfe et d'Afrique face à la guerre avec l'Iran, et un podcast sur le sommet Trump–Xi–Poutine de Shenzhen.<\/li>\n<li><strong>Atlantic Council<\/strong> (19/11) : « Why and how the United States and its allies should prepare for a limited nuclear attack » et un « foresight brief » sur les points d'étranglement.<\/li>\n<li><strong>Arms Control Association<\/strong> : <a href=\"https://www.armscontrol.org/blog/2026-11-20/opportunity-course-correction\" target=\"_blank\" rel=\"noopener\">« Opportunity for a Course Correction? »<\/a> (20/11), sur New START et l'évocation d'une reprise des essais, et un article d'Arms Control Today sur l'IA et le commandement nucléaire.<\/li>\n<li><strong>Carnegie<\/strong> (novembre) : <a href=\"https://carnegieendowment.org/research/2026/11/europe-struggles-to-sustain-support-for-ukraine\" target=\"_blank\" rel=\"noopener\">« Europe Struggles to Sustain Support for Ukraine »<\/a>.<\/li>\n<li><strong>IRSEM<\/strong> (novembre) : l'étude n° 140 sur les ingérences russes dans le sud de la Moldavie.<\/li>\n<li><strong>IFRI<\/strong> : un suivi du sommet de Shenzhen et de la conférence d'examen de la CCAC (Genève, 16-20/11), à dates non confirmées.<\/li>\n<li><strong>Sénat<\/strong> (19/11) : le <a href=\"https://www.senat.fr/rap/l26-156-1/l26-156-11.pdf\" target=\"_blank\" rel=\"noopener\">rapport général sur le PLF 2027<\/a>. <strong>Rexecode<\/strong> (18/11) : des publications de conjoncture. <strong>BCE<\/strong> (18/11) : la revue de stabilité financière.<\/li>\n<li>Sans publication trouvée sur la période : FRS, EUISS, ECFR, SWP, Brookings, RAND, Belfer, ASPI, RSIS, ORF, JIIA, IHEDN, Terra Nova, France Stratégie, OFCE et CAE. La Cour des comptes et le HCFP n'ont rien publié depuis leurs avis des 9 et 4 novembre.<\/li>\n<\/ul>\n";
</script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fr=(x,n=2)=>x==null||isNaN(x)?'—':Number(x).toFixed(n).replace('.',',');
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOISL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fdate=(iso,y=true,long=false)=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');if(!m)return esc(iso||'—');return `${+m[3]===1?'1er':+m[3]} ${(long?MOISL:MOIS)[+m[2]-1]}${y?' '+m[1]:''}`;};
const sevVar=s=>`var(--sev${Math.max(1,Math.min(5,Math.round(s)))})`;
const lvlVar=n=>sevVar(6-n);
const TEND={hausse:{t:'↑ aggravation',c:'up'},baisse:{t:'↓ apaisement',c:'down'},stable:{t:'= stable',c:''}};
const DOM={geopolitique:'Géopolitique',maritime:'Maritime',aerien:'Aérien',hybride:'Hybride & cyber',nucleaire:'Nucléaire',financier:'Économie & finance',alliances:'Alliances',diplomatie:'Diplomatie & prévision'};
const DOM_TXT={geopolitique:'Théâtres de conflit actifs et tensions interétatiques.',financier:'Stress de marché, taux, énergie et fret. Le domaine pèse lourd pour la stabilité, peu pour la guerre.',maritime:'Détroits, sécurité de la navigation et déploiements navals.',nucleaire:'Traités, postures, arsenaux et prolifération. Premier poste de l’indice guerre.',hybride:'Sabotage, cyberattaques, brouillage GNSS et câbles sous-marins.',aerien:"Fermetures d'espace aérien, violations et incursions.",alliances:'Réarmement, désengagement américain et évaluations des services de renseignement.',diplomatie:'Canaux de désescalade, marchés de prévision et seuil de l’OTAN : les contrepoids du modèle.'};
const COMP={interieur:'Tension intérieure',exterieur:'Risque extérieur',alertes:'Alertes officielles'};
const COMP_TXT={interieur:'Gouvernement et budget, finances publiques, marchés, conjoncture, mobilisations sociales, opinion, outre-mer.',exterieur:'Exposition des forces françaises, flanc est, menaces hybrides, énergie, ressortissants et relations extérieures.',alertes:'Postures et alertes des autorités : Vigipirate, terrorisme, cyber, météo, santé, nucléaire, ordre public.'};
const RANG={officiel:'officiel ×1,0',institut:'institut ×0,9',presse:'presse ×0,8',secondaire:'secondaire ×0,6',lacune:'lacune ×0,5'};

const LS={5:'Stable',4:'Tensions contenues',3:'Instabilité marquée',2:'Crise systémique',1:'Effondrement'};
const LG={5:'Risque minimal',4:'Vigilance',3:'Risque élevé',2:'Risque critique',1:'Guerre mondiale imminente'};
const LF={5:'Serein',4:'Vigilance',3:'Tension marquée',2:'Crise nationale',1:'Urgence nationale'};
const H=D.historique||[], last=H[H.length-1]||{}, prev=H.length>1?H[H.length-2]:null;

const nRel=H.length;
$('#brand-sub').textContent=`Bulletin n° ${nRel} · ${fdate(dateRel).replace(/<[^>]+>/g,'')}`;

/* ---------- arborescence du site ---------- */
const domOrder=Object.keys(DOM).sort((a,b)=>S.stabilite.domaines[b]-S.stabilite.domaines[a]);
const SITE=[
 {id:'synthese',t:'Synthèse'},
 {id:'carte',t:'Carte'},
 {id:'monde',t:'Monde',kids:[{id:'monde',t:'Vue d’ensemble'},...domOrder.map(k=>({id:'monde-'+k,t:DOM[k],v:S.stabilite.domaines[k]})),{id:'monde-socle',t:'Socle structurel',sep:true}]},
 {id:'france',t:'France',kids:[{id:'france',t:'Vue d’ensemble'},...['interieur','exterieur','alertes'].map(k=>({id:'france-'+k,t:COMP[k],v:F.composantes[k].severite})),{id:'france-carburant',t:'Carburant',sep:true,v:D.carburant&&D.carburant.donnees&&D.carburant.donnees.indice?D.carburant.donnees.indice.severite:null},{id:'france-postures',t:'Postures officielles'},{id:'france-socle',t:'Socle structurel'}]},
 {id:'signaux',t:'Signaux',kids:[{id:'signaux',t:'Signaux à surveiller'},{id:'lacunes',t:'Lacunes et réserves'}]},
 {id:'note',t:'Note complète'},
 {id:'sources',t:'Sources & méthode',kids:[{id:'sources',t:'Catalogue des sources'},{id:'methode',t:'Méthode du modèle'},{id:'archives',t:'Archives des relevés'}]},
];
const sectionOf=id=>SITE.find(s=>s.id===id||(s.kids||[]).some(k=>k.id===id))||SITE[0];
const titleOf=id=>{for(const s of SITE){if(s.id===id&&!s.kids)return s.t;for(const k of s.kids||[])if(k.id===id)return k.t==='Vue d’ensemble'?s.t:k.t;}return '';};

function buildNav(){
  $('#mainnav').innerHTML=SITE.map((s,i)=>s.kids?`<div class="it"><button class="top" type="button" aria-expanded="false" aria-controls="dd${i}" data-sec="${s.id}">${esc(s.t)}<span class="car" aria-hidden="true">▼</span></button><div class="dd" id="dd${i}" hidden>${s.kids.map(k=>`${k.sep?'<hr>':''}<a href="#${k.id}">${esc(k.t)}${k.v!=null?`<span class="num">${fr(k.v)}</span>`:''}</a>`).join('')}</div></div>`:`<div class="it"><a class="top" href="#${s.id}" data-sec="${s.id}">${esc(s.t)}</a></div>`).join('');
  const sel=$('#rel');
  sel.innerHTML=[...H].reverse().map((h,i)=>`<option value="${i===0?'synthese':'archive-'+h.date}">${fdate(h.date)}${i===0?' (actuel)':''}</option>`).join('');
  sel.addEventListener('change',()=>{location.hash=sel.value;});
}
function closeMenus(except){document.querySelectorAll('.mainnav .top[aria-expanded="true"]').forEach(b=>{if(b!==except){b.setAttribute('aria-expanded','false');document.getElementById(b.getAttribute('aria-controls')).hidden=true;}});}
document.addEventListener('click',e=>{

   <label class="relsel"><span>Relevé</span><select id="rel2" aria-label="Choisir un relevé">${$('#rel').innerHTML}</select></label></div>
   <nav aria-label="Menu">${SITE.map(s=>s.kids?`<button type="button" class="${s===sec?'on':''}" data-x="${s.id}" aria-expanded="${s===sec}">${esc(s.t)}<span aria-hidden="true">${s===sec?'▾':'›'}</span></button><div class="sub" data-xs="${s.id}" ${s===sec?'':'hidden'}>${s.kids.map(k=>`<a href="#${k.id}" class="${k.id===cur?'on':''}">${esc(k.t)}${k.v!=null?`<span class="num">${fr(k.v)}</span>`:''}</a>`).join('')}</div>`:`<a href="#${s.id}" class="${s===sec?'on':''}">${esc(s.t)}<span aria-hidden="true">›</span></a>`).join('')}</nav>`;
  $('#rel2').value=$('#rel').value;

}

/* ---------- composants ---------- */
function deltaTxt(cur,old){if(old==null)return '';const d=Math.round((cur-old)*100)/100;const c=d<0?'worse':d>0?'better':'flat';return `<span class="delta ${c}" title="Depuis le relevé du ${fdate(prev&&prev.date)}">${d<0?'▼':d>0?'▲':'='} ${d<0?'−':d>0?'+':''}${fr(Math.abs(d))}</span>`;}
function scale(cont,n){const pos=Math.max(0,Math.min(100,(cont-0.5)/5*100));return `<div class="sc" role="img" aria-label="Niveau ${n} sur 5, valeur ${fr(cont)}">${[1,2,3,4,5].map(k=>`<span class="${k===n?'on':''}"></span>`).join('')}<b class="mk" style="left:${pos}%"></b></div>`;}
function spark(key){const pts=H.filter(h=>h[key]!=null);if(pts.length<2)return '';const v=pts.map(h=>h[key]),mn=Math.min(...v)-0.15,mx=Math.max(...v)+0.15,X=i=>3+294*i/(v.length-1),Y=x=>33-28*(x-mn)/(mx-mn);const d=v.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(x).toFixed(1)).join('');return `<svg class="spark" viewBox="0 0 300 36" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L297,36 L3,36Z" fill="var(--c)" opacity=".1"/><path d="${d}" fill="none" stroke="var(--c)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;}
function tile(o){return `<a class="tile" href="#${o.href}" style="--c:${lvlVar(o.n)}"><span class="d" aria-hidden="true">${o.n}</span><span class="n">${esc(o.name)}</span><span class="l">Niveau ${o.n} · ${esc(o.lib)}</span><span class="v"><span class="num">${fr(o.cont)}</span>${deltaTxt(o.cont,o.prev)}</span>${scale(o.cont,o.n)}<span class="ax"><span>1 critique</span><span>5 calme</span></span>${o.sk?spark(o.sk):''}${o.why?`<span class="why">${o.why}</span>`:''}</a>`;}

function lineChart(el,series,opts={}){
  const pts=H.filter(h=>series.every(s=>h[s.k]!=null));
  if(pts.length<2){el.innerHTML='<p class="small">La trajectoire apparaîtra à partir de deux relevés.</p>';return;}
  const draw=()=>{
    if(!el.isConnected)return;
    const W=Math.max(280,el.clientWidth||600),Hh=opts.h||220,pad={l:30,r:Math.min(118,W*.3),t:12,b:24};
    const vals=pts.flatMap(h=>series.map(s=>h[s.k]));
    const ymin=Math.min(1.5,Math.floor((Math.min(...vals)-.1)*4)/4),ymax=Math.max(2.75,Math.ceil((Math.max(...vals)+.1)*4)/4);
    const x=i=>pad.l+(W-pad.l-pad.r)*i/(pts.length-1),y=v=>pad.t+(Hh-pad.t-pad.b)*(1-(v-ymin)/(ymax-ymin));
    let g='';
    for(let v=Math.ceil(ymin*2)/2;v<=ymax+1e-9;v+=.5){const th=Math.abs((v%1)-.5)<1e-9;g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule${th?'-2':''})" ${th?'stroke-dasharray="4 4"':''}/><text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end">${fr(v,1)}</text>`;if(th&&v>ymin+.1&&v<ymax-.05)g+=`<text x="${pad.l+4}" y="${y(v)-4}" style="font-size:9.5px">seuil niveau ${Math.floor(v)} | ${Math.ceil(v)}</text>`;}
    const sp=(W-pad.l-pad.r)/(pts.length-1),short=sp<62,step=Math.max(1,Math.ceil((short?34:62)/sp));const lab=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d);return short&&m?`${+m[3]}/${+m[2]}`:fdate(d,false);};pts.forEach((h,i)=>{if((pts.length-1-i)%step===0)g+=`<text x="${x(i)}" y="${Hh-6}" text-anchor="middle">${lab(h.date)}</text>`;});
    series.forEach(s=>{const d=pts.map((h,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(h[s.k]).toFixed(1)}`).join('');g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;pts.forEach((h,i)=>{g+=`<circle cx="${x(i)}" cy="${y(h[s.k])}" r="${i===pts.length-1?4.5:3}" fill="${s.c}" stroke="var(--sheet)" stroke-width="2"/>`;});});
    const ends=series.map(s=>({s,yy:y(pts[pts.length-1][s.k])})).sort((a,b)=>a.yy-b.yy);for(let i=1;i<ends.length;i++)if(ends[i].yy-ends[i-1].yy<14)ends[i].yy=ends[i-1].yy+14;
    ends.forEach(e=>{g+=`<text class="lab" x="${x(pts.length-1)+9}" y="${e.yy+4}">${esc(e.s.short||e.s.l)} <tspan style="font-family:var(--mono);font-weight:400">${fr(pts[pts.length-1][e.s.k])}</tspan></text>`;});
    g+=`<line class="xh" y1="${pad.t}" y2="${Hh-pad.b}" stroke="var(--ink-2)" visibility="hidden"/><rect class="hit" x="${pad.l-8}" y="0" width="${W-pad.l-pad.r+16}" height="${Hh}" fill="transparent"/>`;
    el.innerHTML=`<div class="legend">${series.map(s=>`<span><i style="--c:${s.c}"></i>${esc(s.l)}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" role="img" aria-label="${esc(opts.aria||'Trajectoire')}">${g}</svg><div class="tip" hidden></div>`;
    const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=svg.querySelector('.xh');
