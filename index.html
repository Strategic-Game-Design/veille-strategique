<style>
/* Mise en page : un bulletin de renseignement (la note domine, données en marge) servi comme un site
   à rubriques — en-tête, menu principal à sous-menus, menu latéral, fil d'Ariane, une page par vue. */
:root{
  --page:#eef0f3; --sheet:#ffffff; --ink:#14171c; --ink-2:#465061; --muted:#737c8a;
  --rule:#dde1e6; --rule-2:#c2c8d0; --navy:#1a2b4c; --navy-2:#2c4a80; --on-navy:#e3e9f3; --tint:#f3f5f8;
  --sev1:#2e7d5b; --sev2:#5f8f2c; --sev3:#ad8200; --sev4:#cf6420; --sev5:#bd2f29;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --serif:"Charis SIL","Bitstream Charter",Georgia,serif;
  --sans:"Lato","Carlito","Helvetica Neue",Arial,sans-serif;
  --mono:"Cousine","Liberation Mono",ui-monospace,monospace;
  --shadow:0 8px 28px rgba(20,23,28,.14); --map-dot:#bcc5d1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0f1217; --sheet:#171b21; --ink:#e9edf2; --ink-2:#b2bac6; --muted:#8a93a1;
  --rule:#2a3039; --rule-2:#3c4552; --navy:#0b1426; --navy-2:#93b6ea; --on-navy:#c9d5e8; --tint:#1e232b;
  --sev1:#4fae84; --sev2:#8fbb4f; --sev3:#dcae35; --sev4:#ee8a4a; --sev5:#ef6159;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --shadow:0 8px 28px rgba(0,0,0,.5); --map-dot:#3b4553; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#0f1217; --sheet:#171b21; --ink:#e9edf2; --ink-2:#b2bac6; --muted:#8a93a1;
  --rule:#2a3039; --rule-2:#3c4552; --navy:#0b1426; --navy-2:#93b6ea; --on-navy:#c9d5e8; --tint:#1e232b;
  --sev1:#4fae84; --sev2:#8fbb4f; --sev3:#dcae35; --sev4:#ee8a4a; --sev5:#ef6159;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --shadow:0 8px 28px rgba(0,0,0,.5); --map-dot:#3b4553; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--serif);font-size:16.5px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
a{color:var(--navy-2);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}

/* ---------- bandeau et en-tête ---------- */
.classif{background:var(--navy);color:var(--on-navy);font:700 11px var(--sans);letter-spacing:.13em;text-transform:uppercase}
.classif .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:6px}
.classif #stamp{letter-spacing:.06em;text-transform:none;font-weight:700;opacity:.92}
.hdr{background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hdr .wrap{display:flex;align-items:stretch;gap:24px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex:0 0 auto}
.brand .mk{width:36px;height:36px;border:2px solid var(--ink);display:grid;place-items:center;font:900 12px var(--sans);letter-spacing:.06em}
.brand b{font:700 17px/1.15 var(--serif);display:block}
.brand small{font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mainnav{display:flex;align-items:stretch;gap:0;margin-left:4px}
.mainnav>.it{position:relative;display:flex}
.mainnav .top{display:flex;align-items:center;gap:6px;padding:0 12px;font:700 14px var(--sans);color:var(--ink-2);text-decoration:none;border:0;background:none;cursor:pointer;border-bottom:3px solid transparent;border-top:3px solid transparent}
.mainnav .top:hover{color:var(--ink)}
.mainnav .top.on{color:var(--navy-2);border-bottom-color:var(--navy-2)}
.mainnav .car{font-size:9px;color:var(--muted);transition:transform .15s}
.mainnav .top[aria-expanded="true"] .car{transform:rotate(180deg)}
.dd{position:absolute;top:100%;left:0;min-width:270px;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);padding:6px 0;z-index:25}
.dd a{display:flex;justify-content:space-between;gap:16px;padding:9px 16px;font:600 14px var(--sans);color:var(--ink-2);text-decoration:none}
.dd a:hover,.dd a:focus-visible{background:var(--tint);color:var(--ink)}
.dd a .num{font-size:12px;color:var(--muted)}
.dd hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.relsel{display:flex;align-items:center;gap:8px;border:1px solid var(--rule-2);border-radius:4px;padding:0 4px 0 12px;font:700 13px var(--sans);background:var(--sheet)}
.relsel span{color:var(--muted);font-weight:400}
.relsel select{font:700 13px var(--sans);color:var(--ink);border:0;background:transparent;padding:8px 4px;cursor:pointer}
.burger{display:none;align-self:center;width:42px;height:42px;border:1px solid var(--rule-2);border-radius:4px;background:var(--sheet);color:var(--ink);font:700 18px var(--sans);cursor:pointer}
.drawer{position:fixed;inset:0;z-index:40;background:var(--sheet);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--rule)}
.drawer .dh button{width:42px;height:42px;border-radius:4px;border:0;background:var(--navy);color:var(--on-navy);font:700 18px var(--sans);cursor:pointer}
.drawer .relsel{margin:14px 0}
.drawer nav>a,.drawer nav>button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 18px;font:700 16px var(--sans);color:var(--ink);text-decoration:none;border:0;border-bottom:1px solid var(--rule);background:none;cursor:pointer;text-align:left}
.drawer nav>.on{color:var(--navy-2);box-shadow:inset 4px 0 0 var(--navy-2)}
.drawer .sub{background:var(--tint);border-bottom:1px solid var(--rule)}
.drawer .sub a{display:flex;justify-content:space-between;padding:11px 18px 11px 34px;font:600 15px var(--sans);color:var(--ink-2);text-decoration:none}
.drawer .sub a.on{color:var(--navy-2)}

/* ---------- gabarits de page ---------- */
main{padding-block:24px 0;min-height:60vh}
.crumbs{font:400 13px var(--sans);color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.l-side{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
.l-rail{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.l-side>*,.l-rail>*{min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--sheet);border:1px solid var(--rule)}
.side h4{margin:0;padding:14px 16px 8px}
.side a{display:grid;grid-template-columns:1fr auto;gap:3px 8px;padding:9px 16px;text-decoration:none;color:var(--ink-2);font:700 14px var(--sans);border-left:3px solid transparent}
.side a:hover{background:var(--tint)}
.side a .num{font-size:12.5px;font-weight:400;color:var(--ink-2)}
.side a i{grid-column:1/3;height:3px;background:var(--tint);position:relative}
.side a i b{position:absolute;inset:0 auto 0 0;background:var(--c)}
.side a.on{background:var(--tint);border-left-color:var(--navy-2);color:var(--navy-2)}
.side hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.sheet{background:var(--sheet);border:1px solid var(--rule)}
.doc{padding:34px 44px 40px}
.card{background:var(--sheet);border:1px solid var(--rule);padding:16px 18px;min-width:0}
.card h4,.side h4{font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card h4{margin:0 0 12px;display:flex;justify-content:space-between;gap:10px}
.stack{display:grid;gap:16px;align-content:start}
h1{font:700 30px/1.22 var(--serif);margin:4px 0 12px;letter-spacing:-.005em;text-wrap:balance}
.chapeau{font-size:18px;line-height:1.6;margin:0 0 24px;max-width:64ch}
h3.s{font:700 12.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin:30px 0 12px;border-top:1px solid var(--rule);padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
h3.s a{font-weight:700;letter-spacing:0;text-transform:none;font-size:13.5px}
.para{margin:0 0 12px;max-width:68ch}
.pk{border:1px solid var(--rule-2);background:var(--tint);padding:20px 24px}
.pk h2{font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;color:var(--navy-2)}
.pk ol{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:p}
.pk li{display:grid;grid-template-columns:34px 1fr;gap:8px;counter-increment:p}
.pk li::before{content:"§" counter(p);font:700 13px var(--mono);color:var(--navy-2);padding-top:3px}
.pagehead{padding:22px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
.pagehead h1{font-size:28px;margin-bottom:8px}
.pagehead p{margin:0;max-width:64ch}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--rule);padding:10px 12px}
.kpi .v{font:900 25px/1.1 var(--sans)}
.kpi .k{font:700 10.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.note{font-size:15px;color:var(--ink-2);border-left:3px solid var(--rule-2);padding:2px 0 2px 14px;margin:16px 0 0;max-width:80ch}
.small{font:400 13.5px/1.5 var(--sans);color:var(--ink-2)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}

/* ---------- niveaux ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--c);padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 14px;align-items:center;text-decoration:none;color:inherit}
a.tile:hover{box-shadow:var(--shadow)}
.tile .d{grid-column:1;grid-row:1/3;font:900 54px/1 var(--sans);color:var(--c)}
.tile .n{grid-column:2;grid-row:1;font:700 15px var(--sans)}
.tile .l{grid-column:2;grid-row:2;font:700 13px var(--sans);color:var(--c)}
.tile .v{grid-column:3;grid-row:1/3;text-align:right}
.tile .v .num{font-size:20px;display:block}
.tile .sc,.tile .spark,.tile .why,.tile .ax{grid-column:1/4}
.tile .spark{width:100%;height:36px;display:block}
.tile .why{font:400 12.5px/1.45 var(--sans);color:var(--muted)}
.delta{font:700 12px var(--mono);white-space:nowrap}
.delta.worse{color:var(--sev5)} .delta.better{color:var(--sev1)} .delta.flat{color:var(--muted)}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;position:relative;margin:8px 0 0}
.sc span{height:7px;background:color-mix(in srgb,var(--c) 22%,var(--tint))}
.sc span.on{background:var(--c)}
.sc .mk{position:absolute;top:-4px;width:2px;height:15px;background:var(--ink);transform:translateX(-1px)}
.ax{display:flex;justify-content:space-between;font:700 9.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- graphiques ---------- */
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.chart .lab{font-family:var(--sans);font-size:12px;font-weight:700;fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font:700 12px var(--sans);color:var(--ink-2);margin:0 0 6px}
.legend i{display:inline-block;width:14px;height:3px;background:var(--c);vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--sheet);border:1px solid var(--rule-2);box-shadow:var(--shadow);padding:8px 10px;font:400 12.5px var(--sans);color:var(--ink);min-width:160px;z-index:3}
.tip .d{font:700 11px var(--mono);color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.tip .r i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.dbars{display:grid;grid-template-columns:minmax(0,11em) 1fr auto;gap:12px 14px;align-items:start}
.dbars a{font:700 14px/20px var(--sans);color:var(--ink);text-decoration:none}
.dbars a:hover{text-decoration:underline}
.dbars small{display:block;font:400 11px/16px var(--mono);color:var(--muted)}
.dbars .tk{height:12px;margin-top:4px;background:var(--tint);position:relative}
.dbars .tk b{position:absolute;inset:0 auto 0 0;background:var(--c)}
.dbars .tk em{position:absolute;top:-3px;width:2px;height:18px;background:var(--ink)}
.dbars .dv{font:400 13px/20px var(--mono);text-align:right;white-space:nowrap}
.dbars .dv small{display:inline;color:var(--muted)}
.ax5{grid-column:2;width:100%;display:flex;justify-content:space-between;font:400 10.5px var(--mono);color:var(--muted)}
.heat{display:grid;gap:7px}
.heat .r{display:grid;grid-template-columns:minmax(0,10em) 1fr;gap:12px;align-items:center}
.heat .r>a{font:700 13px var(--sans);color:var(--ink-2);text-decoration:none}
.heat .cells{display:flex;flex-wrap:wrap;gap:3px}
.cell{width:24px;height:24px;display:grid;place-items:center;font:900 11.5px var(--sans);color:var(--ink);background:color-mix(in srgb,var(--c) 28%,var(--sheet));border:1px solid var(--c);text-decoration:none;position:relative}
.cell:hover{background:color-mix(in srgb,var(--c) 50%,var(--sheet))}
.cell sup{position:absolute;top:-3px;right:1px;font-size:9px}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font:400 12px var(--sans);color:var(--ink-2);margin-top:12px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:11px;height:11px;background:color-mix(in srgb,var(--c) 28%,var(--sheet));border:1px solid var(--c)}

/* ---------- fiches ---------- */
.fiches{display:grid;gap:14px;margin-top:18px}
.fiche{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--c);display:grid;grid-template-columns:minmax(0,1fr) 230px;scroll-margin-top:100px}
.fiche .main{padding:16px 20px;min-width:0}
.fiche .t{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fiche h2{font:700 18px/1.3 var(--serif);margin:0}
.fiche .v{font:400 13px/1.55 var(--mono);color:var(--ink-2);margin:8px 0}
.fiche p{margin:0;font-size:15.5px;max-width:70ch}
.fiche .meta{background:var(--tint);border-left:1px solid var(--rule);padding:14px 16px;font:400 13px var(--sans);display:grid;gap:9px;align-content:start;margin:0}
.fiche .meta dt{font:700 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fiche .meta dd{margin:0}
.fiche details{margin-top:10px}
.fiche summary{cursor:pointer;font:700 13.5px var(--sans);color:var(--navy-2)}
.fiche ul.srcs{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px;font:400 13.5px var(--sans)}
.fiche ul.srcs li{display:grid;grid-template-columns:6.5em 1fr;gap:8px}
.fiche ul.srcs .d{font:400 11.5px var(--mono);color:var(--muted)}
.fiche.flash{box-shadow:0 0 0 3px var(--navy-2)}
.sevb{display:inline-grid;place-items:center;width:30px;height:30px;font:900 15px var(--sans);color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--sheet));border:1.5px solid var(--c);flex:0 0 auto}
.chip{font:700 11px var(--sans);letter-spacing:.03em;border:1px solid var(--rule-2);color:var(--ink-2);padding:1px 8px;border-radius:999px;white-space:nowrap}
.chip.up{color:var(--sev5);border-color:var(--sev5)} .chip.down{color:var(--sev1);border-color:var(--sev1)}
.chip.nuc{color:var(--navy-2);border-color:var(--navy-2);display:inline-flex;align-items:center;gap:5px}
.chip .ico{width:12px;height:12px;fill:currentColor;flex:0 0 auto}
.sortbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;font:400 13px var(--sans);color:var(--muted)}
.sortbar button{font:700 12.5px var(--sans);color:var(--ink-2);background:var(--sheet);border:1px solid var(--rule-2);padding:5px 12px;border-radius:999px;cursor:pointer}
.sortbar button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* ---------- postures, échéances ---------- */
.post{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font:400 14px var(--sans);padding:8px 0;border-top:1px solid var(--rule)}
.post:first-of-type{border-top:0;padding-top:0}
.pill{font:700 11.5px var(--sans);padding:3px 9px;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--sheet));white-space:nowrap}
.watch{margin:0;padding:0;list-style:none;display:grid;gap:10px;font:400 14px/1.45 var(--sans)}
.watch li{display:grid;grid-template-columns:60px 1fr;gap:10px}
.watch .dt{font:700 12px var(--mono);color:var(--navy-2);padding-top:1px}
.ech{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}
.ech .card{display:grid;gap:7px;align-content:start}
.ech b.n{font:700 16px/1.3 var(--serif)}
.ech .steps{display:flex;flex-wrap:wrap;gap:3px}
.ech .steps span{font:400 11px var(--mono);padding:2px 6px;border:1px solid var(--rule-2);color:var(--muted)}
.ech .steps span.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.ech .now{font:400 14px/1.5 var(--sans)}
.ech details{font:400 13px/1.5 var(--sans);color:var(--ink-2)}
.ech summary{cursor:pointer;font-weight:700;color:var(--navy-2)}

/* ---------- signaux ---------- */
.sig h4 .ic{font:700 11px var(--mono);padding:1px 7px;color:var(--sheet);background:var(--c);letter-spacing:0}
.sig ul{margin:0;padding-left:18px;display:grid;gap:8px;font:400 14.5px/1.5 var(--sans)}
.reserve{font:400 14.5px/1.6 var(--sans);border-left:4px solid var(--sev4)}
.lst{margin:0;padding-left:18px;display:grid;gap:7px;font:400 14.5px/1.5 var(--sans)}

/* ---------- note complète ---------- */
.prose{max-width:70ch;font-size:16.5px}
.prose h2{font:700 22px/1.3 var(--serif);margin:34px 0 10px;padding-top:12px;border-top:2px solid var(--ink);scroll-margin-top:100px}
.prose h2:first-child{margin-top:0}
.prose h3{font:700 13px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin:24px 0 8px;scroll-margin-top:100px}
.prose p,.prose li{margin:0 0 12px}
.prose ul,.prose ol{padding-left:20px}
.prose table{font:400 14px var(--sans);margin:6px 0 18px;border-collapse:collapse;display:block;overflow-x:auto}
.prose th,.prose td{border-bottom:1px solid var(--rule);padding:6px 10px;text-align:left}
.toc a{display:block;padding:6px 16px;font:400 13.5px/1.4 var(--sans);color:var(--ink-2);text-decoration:none;border-left:3px solid transparent}
.toc a.h3{padding-left:28px;font-size:12.5px}
.toc a:hover{background:var(--tint)}

/* ---------- tableaux ---------- */
.tw{overflow-x:auto;border:1px solid var(--rule);background:var(--sheet)}
table.t{border-collapse:collapse;width:100%;font:400 14px var(--sans)}
table.t th{font:700 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--ink);padding:8px 10px;background:var(--sheet);position:sticky;top:0}
table.t td{border-bottom:1px solid var(--rule);padding:9px 10px;vertical-align:top}
table.t td.num{white-space:nowrap}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ctl select,.ctl input{font:400 14px var(--sans);color:var(--ink);background:var(--sheet);border:1px solid var(--rule-2);border-radius:4px;padding:8px 10px}
.ctl input{flex:1;min-width:min(100%,220px)}
.formula{font:400 12.5px/1.65 var(--mono);background:var(--tint);padding:14px 16px;overflow-x:auto;white-space:pre;margin:0}
.dots i{display:inline-block;width:9px;height:9px;margin-right:2px;background:var(--c)}
footer.ft{border-top:1px solid var(--rule);background:var(--sheet);margin-top:48px}
footer.ft .wrap{padding-block:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 20px;font:400 12.5px var(--sans);color:var(--muted)}
footer.ft a{color:var(--ink-2);text-decoration:none;margin-left:14px}

@media (max-width:1100px){.l-rail{grid-template-columns:minmax(0,1fr) 320px}.mainnav .top{padding:0 9px}}
@media (max-width:960px){
  .mainnav,.hdr .tools .relsel{display:none}

  .classif #stamp{display:none}
  .l-rail,.l-side{grid-template-columns:1fr}
  .side{position:static}
  .side .links{display:flex;overflow-x:auto;scrollbar-width:none}
  .side .links a{flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;grid-template-columns:auto auto}

}
@media (max-width:640px){
  body{font-size:16px}
  .hdr .wrap{min-height:56px;gap:12px}
  .brand b{font-size:15px}
  .brand small{display:none}
  .doc{padding:22px 18px 26px}
  h1{font-size:24px}
  .chapeau{font-size:16.5px}
  .pk{padding:16px}
  .pagehead{grid-template-columns:1fr;padding:18px}
  .fiche{grid-template-columns:1fr}
  .fiche .meta{border-left:0;border-top:1px solid var(--rule)}
  .dbars{grid-template-columns:1fr auto}
  .dbars .tk,.ax5{grid-column:1/3}
  .dbars .tk{margin-top:-4px}
  .dbars{row-gap:8px;grid-auto-flow:row dense}

  .heat .r{grid-template-columns:1fr}

}

/* ---------- note : modèle « Dossier » ---------- */
.dossier .kick{display:flex;justify-content:space-between;gap:12px;font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink);padding-bottom:8px}
.dossier h1{font-size:34px;line-height:1.16;margin:18px 0 14px;letter-spacing:-.012em}
.dossier .chapeau{font-size:19px}
.dropcap::first-letter{float:left;font:700 3.35em/.8 var(--serif);margin:.08em .12em 0 0;color:var(--navy-2)}
.lv3{display:none;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 0 24px}
.lv3 a{padding:10px 4px;text-align:center;border-left:1px solid var(--rule);text-decoration:none;color:inherit}
.lv3 a:first-child{border-left:0}
.lv3 b{display:block;font:900 32px/1 var(--sans);color:var(--c)}
.lv3 span{font:700 9.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lv3 .delta{display:block;margin-top:3px;font-size:11px}
.sh{font:700 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--navy-2);display:flex;align-items:center;gap:12px;margin:30px 0 8px}
.sh::after{content:"";flex:1;height:1px;background:var(--rule-2);order:1}
.sh a{order:2;font-weight:700;letter-spacing:0;text-transform:none;font-size:13px;white-space:nowrap}
.pts{display:grid}
.pt{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--rule)}
.pt:first-child{border-top:0;padding-top:6px}
.pt .n{font:700 13px var(--mono);color:var(--navy-2);padding-top:2px}
.pt .fig{display:inline-block;font:900 13.5px var(--sans);color:var(--c);border-bottom:2px solid var(--c);margin-bottom:6px;padding-bottom:1px}
.pt h3{font:700 17px/1.3 var(--serif);margin:0 0 4px}
.pt p{margin:0;max-width:66ch}
.pull,.prose blockquote{margin:26px 0;padding:6px 0 6px 18px;border-left:3px solid var(--navy-2);font:italic 400 21px/1.42 var(--serif);color:var(--ink);max-width:40ch}
.pull small,.prose blockquote small{display:block;font:700 10.5px var(--sans);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.prose blockquote p{margin:0}
.prose .rt{font:400 11.5px var(--mono);color:var(--muted);margin:-4px 0 14px}
.prose h3{color:var(--navy-2)}
.notebar{display:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;background:var(--sheet);border-bottom:1px solid var(--rule);margin:0 -16px}
.notebar button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border:0;background:none;font:700 13.5px var(--sans);color:var(--ink);cursor:pointer;text-align:left}
.notebar button span{font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.notebar .bar{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--navy-2)}
.notebar .list{max-height:60vh;overflow-y:auto;border-top:1px solid var(--rule);padding:6px 0;box-shadow:var(--shadow)}
.notebar .list a{display:block;padding:8px 16px;font:400 14px/1.4 var(--sans);color:var(--ink-2);text-decoration:none}
.notebar .list a.h3{padding-left:30px;font-size:13px}
.notebar .list a.on,.toc a.on{color:var(--navy-2);font-weight:700}
.toc a.on{border-left-color:var(--navy-2)}
@media (max-width:960px){.notebar{display:block}.l-side>.toc{display:none}}
@media (max-width:640px){
  .tiles.hide-m{display:none}
  .lv3{display:grid}
  .dossier{padding:20px 18px 28px}
  .dossier h1{font-size:27px;margin-top:14px}
  .dossier .chapeau{font-size:17px}
  .pull,.prose blockquote{font-size:18px}
  .prose{font-size:16px}
  .prose h2{font-size:22px}
  .crumbs{margin-bottom:10px}
}

/* ---------- carte de situation ---------- */
.map{position:relative;min-width:0}
.map svg{display:block;width:100%;height:auto}
.map .land{stroke:var(--map-dot);stroke-width:2.5;stroke-linecap:round;fill:none}
.map .spot{cursor:pointer;outline:none}
.map .spot .core{stroke:var(--sheet);stroke-width:1.5}
.map .spot:hover .core,.map .spot:focus-visible .core{stroke:var(--ink);stroke-width:2}
.map .sel{fill:none;stroke:var(--ink);stroke-width:2}
.map .halo{fill:none;stroke-width:1.2;opacity:.6}
.map .tag{font:700 12.5px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round}
.map .frm rect{fill:var(--navy-2)} .map .frm text{font:900 8px var(--sans);fill:var(--sheet)}
.map .dim{opacity:.22}
.mapcard{display:grid;grid-template-columns:minmax(0,1fr) 330px;margin-bottom:24px}
.mapcard>.m{padding:16px 18px 14px;border-right:1px solid var(--rule);min-width:0}
.maphead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.maphead h2{font:700 20px var(--serif);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:700 12px var(--sans);color:var(--ink-2);background:var(--sheet);border:1px solid var(--rule-2);padding:4px 11px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:4px;overflow:hidden}
.seg button{font:700 12px var(--sans);color:var(--ink-2);background:var(--sheet);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy-2);color:var(--sheet)}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font:400 12px var(--sans);color:var(--ink-2);margin-top:8px}
.mlegend i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);vertical-align:-1px;margin-right:5px}
.mlegend i.ring{background:none;border:1.5px solid var(--c)} .mlegend i.sq{border-radius:0;background:var(--navy-2)}
.mlegend .hint{margin-left:auto;color:var(--muted)}
.mdet{padding:18px;display:grid;gap:8px;align-content:start;min-width:0}
.mdet>*{min-width:0}
.mdet .nav button{min-width:0;flex:0 1 auto}
.mdet h3{font:700 20px/1.25 var(--serif);margin:0}
.mdet .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mdet .v{font:400 12.5px/1.55 var(--mono);color:var(--ink-2)}
.mdet p{margin:0;font-size:15px;line-height:1.55}
.mdet .go{font:700 13.5px var(--sans)}
.mdet .nav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--rule);padding-top:10px;margin-top:4px}
.mdet .nav button{font:700 12.5px var(--sans);color:var(--navy-2);background:none;border:0;cursor:pointer;padding:4px 0;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.mstats .card b{display:block;font:900 26px/1.1 var(--sans);margin-bottom:4px}
.mstats .card{font:400 13.5px/1.5 var(--sans);color:var(--ink-2)}
.mlist{max-height:680px;overflow-y:auto;overscroll-behavior:contain}
.mlist .it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px;padding:9px 16px;border-top:1px solid var(--rule);align-items:center;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;font:inherit;color:inherit}
.mlist .it:hover{background:var(--tint)}
.mlist .it.on{background:var(--tint);box-shadow:inset 3px 0 0 var(--navy-2)}
.mlist .it b{font:700 14px var(--sans)} .mlist .it small{grid-column:2/4;font:400 12.5px/1.45 var(--sans);color:var(--ink-2)}
.mlist .tr{font:700 12px var(--sans)}
.loc{border:1px solid var(--rule);background:var(--sheet);margin-bottom:2px}
.loc .land{stroke-width:2}
.picto{display:inline-grid;place-items:center;color:var(--navy-2)}
.picto svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side a.ic{grid-template-columns:20px 1fr auto}
.side a.ic .picto{width:18px;height:18px}
.side a.ic i{grid-column:1/4}
.pagehead .phi{display:flex;gap:16px;align-items:flex-start}
.pagehead .phi>.picto{width:52px;height:52px;border:1.5px solid var(--navy-2);flex:0 0 auto;padding:10px;margin-top:4px}
@media (max-width:1100px){.mapcard{grid-template-columns:minmax(0,1fr) 280px}}
@media (max-width:960px){.mlist{max-height:none}.mapcard{grid-template-columns:1fr}.mapcard>.m{border-right:0;border-bottom:1px solid var(--rule)}.mstats{grid-template-columns:1fr}.side .links a.ic{grid-template-columns:auto auto auto}}
@media (max-width:640px){.mapcard>.m{padding:12px 10px}.mlegend .hint{display:none}.map .land{stroke-width:3}.pagehead .phi>.picto{width:42px;height:42px;padding:8px}}
/* ---------- ouverture animée ---------- */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.intro .i-map{position:absolute;inset:0}
.intro .i-map svg{width:100%;height:100%}
.intro .i-land{fill:none;stroke-linecap:round;stroke-width:2.6}
.intro .i-scan{stroke-width:1.5}
.intro .i-dot{fill:var(--c)}
.intro .i-ring{fill:none;stroke:var(--c);stroke-width:1.3}
.intro .i-spot,.intro .i-fr,.intro .i-card,.intro .i-lv>div,.intro .i-foc{opacity:0}

.intro .i-card{position:relative;text-align:center;max-width:560px;padding:28px 28px 24px}

.intro h2{font:700 clamp(28px,6vw,44px)/1.1 var(--serif);margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}
.intro .i-sub{font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;margin:0 0 22px}

.intro .i-lv div{padding:12px 6px}

.intro .i-lv b{display:block;font:900 40px/1 var(--sans);color:var(--c)}
.intro .i-lv span{display:block;font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}

/* variante 1 : bleu nuit */
.intro.v1{background:#0e1a30;color:#e3e9f3}

/* rubrique Carburant */
.cblink{display:block;text-decoration:none;color:var(--ink);font:600 14px var(--sans)}.cblink:hover{border-color:var(--rule-2)}.cblink span:last-child{color:var(--navy-2)}
.cbhead .cbix{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center;border:1px solid var(--rule);border-top:4px solid var(--c);padding:10px 14px;min-width:250px}

gne (2 blessés) ; le PNAT s'est saisi le 13/10 et le suspect a été écroué ; un second mineur a été mis en examen pour complicité puis placé sous contrôle judiciaire (vers le 15-16/10). Aucun nouveau projet déjoué n'est confirmé du 06 au 23/10. Le dossier de Sarcelles (CNews, 22/10 : un « commanditaire présumé » écroué, piste terroriste incertaine) semble prolonger l'enquête de juillet 2026 sur un projet visant la synagogue de Sarcelles (six hommes mis en examen le 25/07), mais l'article n'a pas pu être lu.","valeur":"1 attaque terroriste (Aubagne, 12/10/2026 : 2 blessés ; PNAT saisi le 13/10 ; 2 mineurs mis en examen) ; aucun nouveau projet déjoué confirmé du 06 au 23/10 ; Sarcelles (22/10) : suite probable du dossier de juillet, non vérifiée","qualite":"partielle","sources":[{"titre":"Brut – Fusillade au collège d'Aubagne : le parquet antiterroriste se saisit de l'enquête","url":"https://www.brut.media/fr/articles/fusillade-au-college-d-aubagne-le-parquet-antiterroriste-se-saisit-de-l-enquete","date":"2026-10-13","rang":"presse"},{"titre":"Euronews – Attaque dans un collège d'Aubagne : le suspect de 14 ans serait fasciné par les tueries de masse","url":"https://fr.euronews.com/2026/10/13/attaque-dans-un-college-daubagne-le-suspect-de-14-ans-serait-fascine-par-les-tueries-de-ma","date":"2026-10-13","rang":"presse"},{"titre":"Sud Radio – Fusillade d'Aubagne : un deuxième mineur mis en examen pour complicité et placé sous contrôle judiciaire","url":"https://www.sudradio.fr/societe/fusillade-daubagne-un-deuxieme-mineur-mis-en-examen-pour-complicite-et-place-sous-controle-judiciaire","date":"2026-10-16","rang":"presse"},{"titre":"DH/AFP – Soupçons de projet d'attaque en France : six hommes mis en examen et écroués à Paris (Sarcelles, juillet)","url":"https://www.dhnet.be/dernieres-depeches/2026/07/25/soupcons-de-projet-dattaque-en-france-six-hommes-mis-en-examen-et-ecroues-a-paris-JFIBQTJZFNHF7EUONA3GGFTSSU/","date":"2026-07-25","rang":"presse"},{"titre":"CNews – Projet d'attaque à Sarcelles : un commanditaire présumé écroué, la piste terroriste toujours incertaine (titre seul, page illisible)","url":"https://www.cnews.fr/france/2026-10-22/projet-dattaque-sarcelles-un-commanditaire-presume-ecroue-la-piste-terroriste","date":"2026-10-22","rang":"presse"}],"date_donnee":"2026-10-16","rang_source":"presse","coef_qualite":0.8,"severite_ajustee":4.25,"coef":1.2},{"id":"certfr_alertes_ouvertes","composante":"alertes","libelle":"CERT-FR : alertes de sécurité ouvertes","severite":4,"tendance":"hausse","systemique":false,"justification":"Le CERT-FR a été consulté le 23/10/2026 (le site a été redirigé vers cert.cyber.gouv.fr). Trois alertes ont été ouvertes dans la fenêtre : ALE-012, le 12/10, sur un incident visant les contrôleurs à distance d'installations de réfrigération (Danfoss AK-SM/AK-SC, Copeland/Dixell xweb), avec « de nombreuses compromissions » et des campagnes probablement en cours ; ALE-013, le 14/10, sur Ivanti Connect Secure ; ALE-014, le 21/10 (mise à jour le 22/10), sur de multiples vulnérabilités dans PHP. ALE-009 (SonicWall) et ALE-010 (Metabase) ont été clôturées le 13/10. Il y a maintenant 4 alertes ouvertes, contre 3 le 06/10 ; 14 ont été émises en 2026, dont 10 clôturées.","valeur":"4 alertes ouvertes (ALE-011 Citrix, ALE-012 réfrigération, ALE-013 Ivanti ICS, ALE-014 PHP) ; 14 émises et 10 clôturées en 2026 (au 23/10/2026)","qualite":"verifiee","sources":[{"titre":"CERT-FR – Alertes de sécurité","url":"https://cert.cyber.gouv.fr/alerte","date":"2026-10-23","rang":"officiel"},{"titre":"Refindustry – French Cybersecurity Agency Warns of Attacks on Refrigeration Controllers","url":"https://refindustry.com/news/french-cybersecurity-agency-warns-of-attacks-on-refrigeration-controllers/","date":"2026-10-15","rang":"presse"}],"date_donnee":"2026-10-22","rang_source":"officiel","coef_qualite":1.0,"severite_ajustee":4.25,"coef":1.0},{"id":"cyber_fuites_donnees","composante":"alertes","libelle":"Cyber : fuites massives de données de l'État","severite":4,"tendance":"stable","systemique":false,"justification":"Le 09-10/10/2026, la CAF a signalé une fuite sur sa plateforme d'aides aux vacances (Vacaf) ; un pirate revendique environ 1,2 million de dossiers, chiffre non confirmé. L'Ined a confirmé le 21/10 une cyberattaque détectée le 17/10, sans exfiltration de données établie. Le 22/10, environ 450 000 dossiers de l'Ircantec (retraite complémentaire des agents publics, Caisse des dépôts) ont été mis en vente sur un forum : revendication jugée crédible mais non confirmée (à ne pas confondre avec la fuite de 70 000 dossiers de février 2025). Le dernier bilan de l'ANSSI (fin septembre) compte 99 fuites signalées depuis le 01/08, dont 67 confirmées, pour environ 55 millions de profils.","valeur":"CAF/Vacaf : ≈ 1,2 M dossiers revendiqués (10/10/2026) ; Ined : attaque confirmée (21/10) ; Ircantec : ≈ 450 000 revendiqués (22/10, non confirmé) ; ANSSI : 99 fuites et ≈ 55 M profils depuis le 01/08","qualite":"partielle","sources":[{"titre":"Le Monde Informatique – La Cnaf signale une fuite de données sur sa plateforme Vacaf","url":"https://www.lemondeinformatique.fr/actualites/lire-la-cnaf-signale-une-fuite-de-donnees-sur-sa-plateforme-vacaf-100851.html","date":"2026-10-10","rang":"presse"},{"titre":"FrenchBreaches – Fuites de données en France 2026 (Ircantec 22/10, Ined 21/10, CAF 09/10)","url":"https://frenchbreaches.com/","date":"2026-10-22","rang":"secondaire"},{"titre":"Cyberattaque.org – L'ANSSI révèle un été noir pour l'État : près de 55 millions de profils concernés","url":"https://www.cyberattaque.org/lanssi-revele-un-ete-noir-pour-letat-pres-de-55-millions-de-profils-concernes-par-des-fuites-de-donnees/","date":"2026-09-30","rang":"presse"},{"titre":"Next – Caisse des dépôts (Ircantec) piratée, 70 000 personnes (février 2025, antécédent)","url":"https://next.ink/brief-article/caisse-des-depots-ircantec-piratee-des-donnees-de-70-000-personnes-derobees/","date":"2025-02-14","rang":"presse"}],"date_donnee":"2026-10-22","rang_source":"presse","coef_qualite":0.8,"severite_ajustee":4.0,"coef":0.8},{"id":"vigilance_meteo","composante":"alertes","libelle":"Vigilance Météo-France (état instantané)","severite":3,"tendance":"stable","systemique":false,"justification":"Le bulletin Météo-France du 22/10/2026 à 16 h, valable pour le 23/10, place 15 départements en vigilance orange vent pour la tempête Austen (Bretagne, Normandie, Loire-Atlantique, Hauts-de-France littoraux, Yvelines, Val-d'Oise), 53 en jaune et aucun en rouge ; les rafales attendues atteignent 100 à 120 km/h dans les terres et 130 à 140 km/h sur les côtes (Météo-France, 22/10). Un site de presse mis à jour le 23/10 à 6 h 10 annonce 23 départements en orange, dont toute l'Île-de-France ; ce chiffre n'a pas été vérifié sur le bulletin officiel. Le risque est passé des pluies méditerranéennes du 06/10 au vent sur le nord-ouest, à intensité comparable.","valeur":"23/10/2026 : 15 départements orange vent (tempête Austen), 53 jaune, 0 rouge (bulletin du 22/10 16 h) ; rafales jusqu'à 130-140 km/h sur les côtes","qualite":"verifiee","sources":[{"titre":"Météo-France – Vigilance accessible (bulletin du 22/10/2026 16 h)","url":"https://vigilance.meteofrance.fr/fr/vigilance-accessible","date":"2026-10-22","rang":"officiel"},{"titre":"Météo-France – Tempête Austen : vents violents ce vendredi sur le nord-ouest du pays","url":"https://meteofrance.com/actualites/tempete-austen-vents-violents-ce-vendredi-sur-le-nord-ouest-du-pays","date":"2026-10-22","rang":"officiel"},{"titre":"Labo Maison – Tempête du 23 octobre 2026 : régions concernées (maj 23/10 6 h 10)","url":"https://labomaison.com/maison/tempete-23-octobre-2026-regions-vent-violent/","date":"2026-10-23","rang":"presse"}],"date_donnee":"2026-10-22","rang_source":"officiel","coef_qualite":1.0,"severite_ajustee":3.0,"coef":1.0},{"id":"canicule_surmortalite_orsan","composante":"alertes","libelle":"Canicules été 2026 : surmortalité et ORSAN 3","severite":5,"tendance":"stable","systemique":false,"justification":"Santé publique France n'a toujours pas publié de bilan consolidé de l'été au 23/10/2026. Le bulletin du 16/09 (relu le 23/10) annonce ce bilan estival après la période de surveillance, sans date. Ses chiffres provisoires, d'au moins 5 764 + 1 243 + 817 décès en excès, donnent un cumul d'environ 7 800 décès sur les trois vagues de juin à août, sans compter l'épisode de mai (≥ 300). Il n'y a ni vigilance canicule ni activation ORSAN en octobre. La note de 5 reflète l'ampleur d'un bilan désormais ancien.","valeur":"≥ 7 800 décès en excès (bilans SPF provisoires, dernier du 16/09/2026) ; bilan estival consolidé non publié au 23/10 ; aucune vigilance canicule en octobre","qualite":"partielle","sources":[{"titre":"SPF – Canicule et santé : excès de mortalité durant l'épisode du 27 juillet au 20 août 2026","url":"https://www.santepubliquefrance.fr/climat/fortes-chaleurs-canicule/bulletin-national/canicule-et-sante-exces-de-mortalite-durant-lepisode-de-canicule-du-27-juillet-au-20-aout-2026","date":"2026-09-16","rang":"officiel"},{"titre":"Vidal – Canicules en France : près de 8 000 décès en excès selon un bilan provisoire","url":"https://www.vidal.fr/actualites/38320-canicules-en-france-pres-de-8-000-deces-en-exces-selon-un-bilan-provisoire.html","date":"2026-09-16","rang":"presse"},{"titre":"Météo-France – Vigilance (bulletin du 22/10/2026, aucune vigilance canicule)","url":"https://vigilance.meteofrance.fr/fr/vigilance-accessible","date":"2026-10-22","rang":"officiel"}],"date_donnee":"2026-09-16","rang_source":"institut","coef_qualite":0.9,"severite_ajustee":5.0,"coef":0.9},{"id":"feux_foret_2026","composante":"alertes","libelle":"Feux de forêt 2026 : saison record","severite":4,"tendance":"stable","systemique":false,"justification":"La compilation satellitaire Sylvie Forêt (Copernicus EFFIS), mise à jour le 22/10/2026, compte environ 94 132 ha brûlés et 786 feux, dont 37 632 ha en Gironde, et seulement 819 ha sur les 30 derniers jours. Le seul bilan national chiffré hors satellite reste celui de France Assureurs (28/08 : « près de 100 000 ha », plus de 500 M€ de sinistres). Une recherche dédiée n'a trouvé aucun bilan de saison de la DGSCGC ni du ministère de l'Intérieur au 23/10. La saison est close de fait, mais la note de 4 est maintenue pour son caractère record.","valeur":"≈ 94 132 ha et 786 feux (EFFIS/Sylvie Forêt, maj 22/10/2026) ; ≈ 100 000 ha selon France Assureurs (28/08) ; pas de bilan officiel DGSCGC","qualite":"partielle","sources":[{"titre":"Sylvie Forêt – Feux de forêt en France 2026 (données Copernicus EFFIS)","url":"https://www.sylvie-foret.com/ressources/feux-de-foret/","date":"2026-10-22","rang":"secondaire"},{"titre":"24matins – Feux de forêt 2026, une facture qui dépasse déjà 500 millions (France Assureurs)","url":"https://www.24matins.fr/feux-de-foret-2026-une-facture-qui-depasse-deja-500-millions-1419689","date":"2026-08-29","rang":"presse"}],"date_donnee":"2026-10-22","rang_source":"presse","coef_qualite":0.8,"severite_ajustee":4.0,"coef":0.8},{"id":"epidemies_arboviroses","composante":"alertes","libelle":"Santé publique : arboviroses et reprise respiratoire","severite":3,"tendance":"hausse","systemique":false,"justification":"Le bulletin SPF du 21/10/2026 (données au 19/10) recense 27 épisodes de transmission vectorielle autochtone en France hexagonale (+1 par rapport à la semaine précédente) : 22 épisodes de chikungunya totalisant 183 cas (contre 162 au 12/10), dengue 7 cas en 5 épisodes (+1 épisode), et 195 cas autochtones de West Nile (+17 en une semaine, contre 178 au 12/10). Les décès West Nile n'ont pas pu être relus dans ce bulletin (5 au bulletin du 14/10). La progression se poursuit à rythme hebdomadaire régulier (+17 West Nile, +21 chikungunya), sans accélération. Le bulletin du 28/10 n'est pas encore paru. Chiffres issus de résumés de recherche, le PDF n'ayant pas pu être ouvert.","valeur":"183 chikungunya autochtones (22 épisodes), 7 dengue (5 épisodes) et 195 West Nile (+17) au bulletin SPF du 21/10/2026 (données au 19/10)","qualite":"partielle","sources":[{"titre":"Santé publique France – Bulletin national arboviroses du 21/10/2026 (données au 19/10)","url":"https://www.santepubliquefrance.fr/sites/default/files/2026-10/bullnat_arboviroses_20261021.pdf","date":"2026-10-21","rang":"officiel"},{"titre":"Santé publique France – Bulletin national arboviroses du 14/10/2026","url":"https://www.santepubliquefrance.fr/sites/default/files/2026-10/bullnat_arboviroses_20261014.pdf","date":"2026-10-14","rang":"officiel"}],"date_donnee":"2026-10-19","rang_source":"officiel","coef_qualite":1.0,"severite_ajustee":3.25,"coef":1.0},{"id":"asnr_ines","composante":"alertes","libelle":"Sûreté nucléaire (ASNR, échelle INES)","severite":1,"tendance":"stable","systemique":false,"justification":"Les quatre avis d'incident publiés par l'ASNR en octobre 2026 sont tous classés au niveau 1 (anomalie). Le 09/10 : Cattenom 3 (soupapes du circuit de réfrigération à l'arrêt mal tarées, faits des 27-30/09, déclarés le 05/10) et Saint-Laurent-des-Eaux 1 (soupape sur l'injection aux joints des pompes primaires, faits du 25/08, reclassés au niveau 1 le 30/09). Le 14/10 : Cruas-Meysse 2 (détection tardive d'un dépassement du débit de fuite du circuit primaire le 25/09). Le 22/10 : EPR de Flamanville (non-respect des RGE après indisponibilité d'un matériel, le 01/10). Aucun événement de niveau 2 ou plus en 2026.","valeur":"Max INES 2026 = niveau 1 ; 4 avis ASNR d'octobre (Cattenom 3, Saint-Laurent 1, Cruas 2, EPR Flamanville), tous au niveau 1","qualite":"verifiee","sources":[{"titre":"ASNR – Non-respect des RGE à la suite de l'indisponibilité d'un matériel (EPR de Flamanville, niveau 1)","url":"https://reglementation-controle.asnr.fr/controle/actualites-du-controle/installations-nucleaires/avis-d-incident-des-installations-nucleaires/non-respect-des-rge-concernant-la-conduite-a-tenir-a-la-suite-de-l-indisponibilite-d-un-materiel","date":"2026-10-22","rang":"officiel"},{"titre":"ASNR – Détection tardive du dépassement d'un critère de débit de fuite du circuit primaire (Cruas-Meysse 2, niveau 1)","url":"https://reglementation-controle.asnr.fr/controle/actualites-du-controle/installations-nucleaires/avis-d-incident-des-installations-nucleaires/detection-tardive-du-depassement-d-un-critere-de-debit-de-fuite-du-circuit-primaire","date":"2026-10-14","rang":"officiel"},{"titre":"ASNR – Erreur de réglage des soupapes du circuit RRA du réacteur 3 (Cattenom, niveau 1)","url":"https://reglementation-controle.asnr.fr/controle/actualites-du-controle/installations-nucleaires/avis-d-incident-des-installations-nucleaires/erreur-de-reglage-des-soupapes-du-circuit-de-refrigeration-a-l-arret-du-reacteur-3","date":"2026-10-09","rang":"officiel"},{"titre":"ASNR – Soupape sur la ligne d'injection d'eau des joints des pompes primaires (Saint-Laurent-des-Eaux 1, niveau 1)","url":"https://reglementation-controle.asnr.fr/controle/actualites-du-controle/installations-nucleaires/avis-d-incident-des-installations-nucleaires/soupape-sur-la-ligne-d-injection-d-eau-des-joints-des-pompes-primaires","date":"2026-10-09","rang":"officiel"}],"date_donnee":"2026-10-22","rang_source":"officiel","coef_qualite":1.0,"severite_ajustee":1.0,"coef":1.0},{"id":"ordre_public_violences_urbaines","composante":"alertes","libelle":"Ordre public et violences urbaines","severite":5,"tendance":"hausse","systemique":false,"justification":"Les 17 et 18/10/2026, en marge de la journée « contre la vie chère », pillages et attaques de bâtiments publics ont touché la plupart des grandes villes : hôtel de ville de Limoges incendié, office du tourisme de Lyon brûlé, intrusion dans l'hôtel de ville de Marseille, résidence du préfet visée à Bordeaux. Le bilan est d'environ 2 400 interpellations, 997 FDO et pompiers blessés, au moins 3 000 commerces touchés et une facture d'environ 1,1 Md€ (IFRAP). Des couvre-feux préfectoraux sont en vigueur depuis le 19/10 : Paris (République, Halles, 23h-6h, prolongé jusqu'au 26/10), Lyon (21h-6h), Marseille (mineurs), Toulouse. L'état d'urgence est écarté « pour l'heure » par S. Lecornu, mais réclamé par B. Retailleau et souhaité par 71 % des sondés (Elabe). La commission des lois de l'AN a reçu des pouvoirs d'enquête le 20/10.","valeur":"≈ 2 400 interpellations, 997 FDO/pompiers blessés, ≥ 3 000 commerces touchés, ≈ 1,1 Md€ de dégâts ; couvre-feux à Paris, Lyon, Marseille et Toulouse (19-26/10)","qualite":"verifiee","sources":[{"titre":"Le Club des Juristes – L'état d'urgence après les violences du 17 octobre ?","url":"https://www.leclubdesjuristes.com/droit/letat-durgence-apres-les-violences-du-17-octobre-17937/","date":"2026-10-21","rang":"institut"},{"titre":"IFRAP – Violences des 17 et 18 octobre 2026 : une facture qui approche le milliard d'euros","url":"https://www.ifrap.org/etat-et-collectivites/violences-des-17-et-18-octobre-2026-une-facture-qui-approche-le-milliard-deuros","date":"2026-10-20","rang":"institut"},{"titre":"Public Sénat – Violences du 17 octobre : pourquoi l'état d'urgence est écarté par le gouvernement","url":"https://www.publicsenat.fr/actualites/politique/violences-du-17-octobre-pourquoi-letat-durgence-est-ecarte-par-le-gouvernement","date":"2026-10-19","rang":"presse"},{"titre":"i24news – Violences en France : Paris, Lyon et Marseille prolongent les couvre-feux","url":"https://www.i24news.tv/fr/actu/france/artc-violences-en-france-paris-lyon-et-marseille-prolongent-les-couvre-feux","date":"2026-10-20","rang":"presse"},{"titre":"Sortiraparis – Curfew in Paris and a ban on demonstrations: the neighborhoods affected (MAJ 22/10)","url":"https://www.sortiraparis.com/en/news/in-paris/articles/355062-curfew-in-paris-and-a-ban-on-demonstrations-in-the-affected-districts","date":"2026-10-22","rang":"presse"},{"titre":"Pandore Gendarmerie – Violences du 17 octobre : chronologie et bilan actualisé (bilan Intérieur du 18/10)","url":"https://www.pandore-gendarmerie.org/violences-17-octobre-2026-chronologie-bilan-forces-secours/","date":"2026-10-18","rang":"presse"},{"titre":"CNews – Mobilisation du 17 octobre : 2 397 personnes interpellées et 997 policiers et gendarmes blessés (titre)","url":"https://www.cnews.fr/france/2026-10-18/mobilisation-du-17-octobre-2397-personnes-ont-ete-interpellees-et-997-policiers","date":"2026-10-18","rang":"presse"},{"titre":"Impact European – Manifestations du 17 octobre 2026 : bilan et violences","url":"https://impacteuropean.fr/manifestations-17-octobre-2026-france-bilan-violences/","date":"2026-10-18","rang":"presse"}],"date_donnee":"2026-10-22","rang_source":"institut","coef_qualite":0.9,"severite_ajustee":5.0,"coef":0.9},{"id":"gouvernement_censure","composante":"interieur","libelle":"Stabilité gouvernementale / risque de censure","severite":4,"tendance":"stable","systemique":true,"justification":"Aucune motion de censure déposée n'a été trouvée au 25/10/2026. Calendrier PLF 2027 confirmé : examen de la partie recettes repris le 27/10 jusqu'au 2/11, vote des recettes le 3/11, vote de l'ensemble le 17/11 ; au 19/10, seuls 15 des 58 articles de la première partie étaient examinés (43 restants, plus de 2 600 amendements). Le PLFSS doit être voté le 27/10 ; l'option des ordonnances budgétaires ne serait possible qu'après 70 jours (18/12). Position PS/RN inchangée depuis le 23/10 (menace de censure, 49.3 non tranché).","valeur":"Aucune motion déposée au 25/10 ; reprise du PLF le 27/10, vote des recettes le 3/11, ensemble le 17/11 ; ordonnances possibles au plus tôt le 18/12 ; 49.3 non décidé","qualite":"partielle","sources":[{"titre":"NosParlementaires – Date du vote du budget 2027 : le 3 novembre","url":"https://nosparlementaires.fr/actualites/budget-2027-calendrier-assemblee-cinq-semaines","date":"2026-10-20","rang":"secondaire"},{"titre":"Yahoo Finance – Le vote du volet impôts du budget 2027 est repoussé, examen repris le 27 octobre","url":"https://fr.finance.yahoo.com/actualites/vote-volet-imp%C3%B4ts-budget-2027-143734708.html","date":"2026-10-20","rang":"presse"},{"titre":"Boursorama/AFP – Budget 2027 : Lecornu et le PS se confrontent avant un vote à suspense","url":"https://www.boursorama.com/actualite-economique/actualites/budget-2027-lecornu-et-le-ps-se-confrontent-avant-un-vote-a-suspense-3afc929e37c6df00fab170696d0b0e8d","date":"2026-10-13","rang":"presse"}],"date_donnee":"2026-10-25","rang_source":"presse","coef_qualite":0.8,"severite_ajustee":4.0,"coef":1.2},{"id":"plf_2027_finances_publiques","composante":"interieur","libelle":"PLF 2027 et finances publiques (déficit, dette)","severite":5,"tendance":"hausse","systemique":true,"justification":"Dans son avis sur le PLF 2027 (présenté début octobre 2026), le HCFP juge « optimiste » la prévision de croissance de 1 % pour 2027 (consensus 0,7-0,9 %). À croissance de consensus, le déficit atteindrait 5,2-5,3 % du PIB et non les 5,0 % visés, après 5,4 % attendus en 2026. Le HCFP salue un effort structurel d'environ 40 Md€, largement absorbé par la hausse des taux. Les votes de l'Assemblée ont depuis dégradé le solde d'environ 10 Md€ (D. Amiel, 19/10), l'OAT 10 ans a atteint 5,13 % le 22/10, et Moody's a maintenu Aa3 négative le 23/10 en supposant explicitement l'adoption d'un budget réduisant le déficit, que S. Lecornu veut voir adopté avant la fin de l'année à 5 %.","valeur":"Cible déficit 2027 : 5,0 % (HCFP : 5,2-5,3 % à croissance de consensus ; croissance 1 % jugée « optimiste ») ; solde dégradé d'environ 10 Md€ par les votes (19/10) ; dette ≈ 121,7 % du PIB ; OAT 10 ans 5,13 % (22/10)","qualite":"partielle","sources":[{"titre":"Public Sénat – Budget 2027 : le Haut Conseil des finances publiques pointe des prévisions « optimistes » du gouvernement","url":"https://www.publicsenat.fr/actualites/economie/budget-2027-le-haut-conseil-des-finances-publiques-pointe-des-previsions-optimistes-du-gouvernement","date":"2026-10-07","rang":"presse"},{"titre":"Yahoo Actualités/AFP – Moody's maintient la note sou
