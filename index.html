P.sources.after=()=>{
  const STC={'répondu':'var(--sev1)','sans nouveauté':'var(--sev3)','bloqué':'var(--sev5)','non sollicitée':'var(--rule-2)'};
  const body=$('#c-body'),cat=$('#c-cat'),niv=$('#c-niv'),st=$('#c-st'),q=$('#c-q');
  const render=()=>{const k=q.value.trim().toLowerCase();const rows=(cat.value==='M'?D.catalogue:F.catalogue).filter(r=>(!niv.value||r.niveau===niv.value)&&(!st.value||r.statut===st.value)&&(!k||(r.nom+' '+(r.editeur||'')+' '+(r.mesure||'')).toLowerCase().includes(k)));
   body.innerHTML=rows.map(r=>{const url=(r.url||'').split(/\s*;\s*|\s+\/\s+/)[0].trim();const j=(r.journal||[]).slice(-8).map(e=>`<i style="--c:${STC[e.statut]||'var(--rule-2)'}" title="${esc(fdate(e.date))} : ${esc(e.statut)}"></i>`).join('');
   return `<tr><td class="num">${esc(r.niveau)}</td><td>${url.startsWith('http')?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(r.nom)}</a>`:esc(r.nom)}<div class="small">${esc(r.mesure||'')}</div></td><td class="small">${esc(r.frequence||'')}</td><td><b style="color:${STC[r.statut]||'var(--muted)'}">${esc(r.statut)}</b>${r.dernier_doc?`<div class="small">${esc(r.dernier_doc)}</div>`:''}</td><td class="dots" style="white-space:nowrap">${j}</td></tr>`;}).join('')||'<tr><td colspan="5">Aucune source ne correspond.</td></tr>';};
  [cat,niv,st].forEach(e=>e.addEventListener('change',render));q.addEventListener('input',render);render();
};
P.methode=()=>{const ws=S.stabilite.poids,wg=S.guerre.poids,se=D.sensibilite,sf=F.sensibilite;
 return `<div class="l-side">${sideNav(sectionOf('sources'),'methode')}<div>
   ${crumbs([['Synthèse','synthese'],['Sources & méthode','sources'],['Méthode du modèle','methode']])}
   <article class="sheet doc"><div class="lbl">Modèle ${esc(D.version_modele||'v3')} · figé pour la comparabilité de la série</div><h1>Méthode du modèle</h1>
   <p class="para">Le modèle s’inspire des indices composites de référence (Global Peace Index, ACLED) et du DEFCON. Chaque indicateur reçoit une sévérité de 1 (calme) à 5 (critique), pondérée par la cotation de sa source. Le niveau final se lit de 5 (calme) à 1 (critique).</p>
   <h3 class="s">Calcul</h3><pre class="formula">sévérité_ajustée = borne[1;5](sévérité + tendance)     aggravation +0,25 · stable 0 · apaisement −0,25
cotation         = meilleur rang des sources citées : officiel 1,0 · institut 0,9 · presse 0,8 · secondaire 0,6 · lacune 0,5
                   (donnée de plus de 30 jours : un cran de moins)
MONDE   coef = cotation × 1,5 si puissance nucléaire (indice guerre seulement)
        score_domaine = Σ(sév_aj × coef) / Σ(coef) ;  conjoncturel = Σ poids_domaine × score_domaine
FRANCE  coef = cotation × 1,5 si systémique
        conjoncturel = 0,40 × intérieur + 0,30 × extérieur + 0,30 × alertes
SOCLE   structurel = Σ(sév_aj × pertinence × cotation) / Σ(pertinence × cotation)
composite = 0,70 × conjoncturel + 0,30 × structurel ;  niveau_continu = 6 − composite ;  niveau = arrondi</pre>
   <h3 class="s">Poids des domaines</h3><div class="tw"><table class="t"><thead><tr><th>Domaine</th><th>Stabilité</th><th>Guerre</th><th>Contenu</th></tr></thead><tbody>${Object.keys(DOM).map(k=>`<tr><td><a href="#monde-${k}">${DOM[k]}</a></td><td class="num">${fr(ws[k])}</td><td class="num">${fr(wg[k])}</td><td>${DOM_TXT[k]}</td></tr>`).join('')}</tbody></table></div>
   <h3 class="s">Paliers qualitatifs</h3>
   <p class="para"><b>Guerre :</b> sous 3 seulement si des forces de puissances nucléaires (ou de leurs alliances) échangent des tirs directs et délibérés, ou si l’article 5 est invoqué ; sous 2 seulement en cas de guerre ouverte et soutenue entre au moins deux puissances nucléaires ou blocs.</p>
   <p class="para"><b>France :</b> sous 3 seulement en cas de Vigipirate « alerte attentat », d’état d’urgence déclaré (même local) ou de chute du gouvernement sans successeur cumulée à une dégradation de note ; sous 2 seulement en cas d’état d’urgence national, d’attaque armée sur le territoire ou de mobilisation.</p>
   <h3 class="s">Robustesse du résultat</h3><div class="tw"><table class="t"><thead><tr><th>Variante</th><th>Stabilité</th><th>Guerre</th><th>France</th></tr></thead><tbody>
    <tr><td><b>Modèle retenu</b></td><td class="num">${fr(S.stabilite.niveau_continu)}</td><td class="num">${fr(S.guerre.niveau_continu)}</td><td class="num">${fr(F.niveau_continu)}</td></tr>
    <tr><td>Poids égaux</td><td class="num">${fr(se.stabilite.poids_egaux)}</td><td class="num">${fr(se.guerre.poids_egaux)}</td><td class="num">${fr(sf.poids_egaux)}</td></tr>
    <tr><td>Sans ajustement de tendance</td><td class="num">${fr(se.stabilite.sans_tendance)}</td><td class="num">${fr(se.guerre.sans_tendance)}</td><td class="num">${fr(sf.sans_tendance)}</td></tr>
    <tr><td>Sans coefficient nucléaire / systémique</td><td class="num">—</td><td class="num">${fr(se.guerre.sans_coef_nucleaire)}</td><td class="num">${fr(sf.sans_coef_systemique)}</td></tr>
    <tr><td>Couche conjoncturelle seule</td><td class="num">${fr(se.stabilite.sans_couche_structurelle)}</td><td class="num">${fr(se.guerre.sans_couche_structurelle)}</td><td class="num">${fr(sf.sans_couche_structurelle)}</td></tr>
    <tr><td>Socle structurel seul</td><td class="num">${fr(se.stabilite.structurel_seul)}</td><td class="num">${fr(se.guerre.structurel_seul)}</td><td class="num">${fr(sf.structurel_seul)}</td></tr>
    <tr><td>Moyenne simple des sévérités</td><td class="num">${fr(se.stabilite.brut_moyenne_simple)}</td><td class="num">${fr(se.guerre.brut_moyenne_simple)}</td><td class="num">${fr(sf.brut_moyenne_simple)}</td></tr></tbody></table></div>
   <h3 class="s">Limites</h3><p class="para">Les sévérités sont des jugements d’analyste adossés aux faits cités, pas des mesures. Les indicateurs conjoncturels sont des points chauds ; le domaine « diplomatie & prévision » et le socle structurel servent de contrepoids.</p>
   </article></div></div>`;};
P.archives=()=>`<div class="l-side">${sideNav(sectionOf('sources'),'archives')}<div>
   ${crumbs([['Synthèse','synthese'],['Sources & méthode','sources'],['Archives des relevés','archives']])}
   <section class="sheet pagehead"><div><div class="lbl">${nRel} relevés depuis le ${fdate(H[0]&&H[0].date)}</div><h1>Archives des relevés</h1><p>Les relevés antérieurs conservent leurs niveaux et leurs faits marquants. Le détail des indicateurs n’est disponible que pour le relevé en cours.</p></div></section>
   ${card('<span>Trajectoire complète</span>','<div class="chart" id="ch-arch"></div>','style="margin-top:16px"')}
   <div class="tw" style="margin-top:16px"><table class="t"><thead><tr><th>Relevé</th><th>Stabilité</th><th>Guerre</th><th>France</th><th>Faits marquants</th></tr></thead><tbody>${[...H].reverse().map((h,i)=>`<tr><td class="num"><a href="#${i===0?'synthese':'archive-'+h.date}">${fdate(h.date)}</a>${h.modele&&h.modele!=='v3'?`<div class="small">modèle ${esc(h.modele)}</div>`:''}</td><td class="num">${h.stabilite_niveau??'—'} · ${fr(h.stabilite_continu)}</td><td class="num">${h.guerre_niveau??'—'} · ${fr(h.guerre_continu)}</td><td class="num">${h.france_niveau??'—'} · ${fr(h.france_continu)}</td><td style="min-width:20em">${esc((h.faits_marquants||'').slice(0,260))}${(h.faits_marquants||'').length>260?'…':''}</td></tr>`).join('')}</tbody></table></div></div></div>`;
P.archives.after=()=>lineChart($('#ch-arch'),[{k:'stabilite_continu',l:'Stabilité',c:'var(--s1)'},{k:'guerre_continu',l:'Guerre',c:'var(--s2)'},{k:'france_continu',l:'France',c:'var(--s3)'}],{aria:'Trajectoire complète',h:240});
function pageArchive(date){
  const i=H.findIndex(h=>h.date===date),h=H[i];if(!h)return P.archives();
  const p=i>0?H[i-1]:null;
  const row=(n,lvl,v,pv,lib)=>`<div class="tile" style="--c:${lvlVar(lvl)}"><span class="d">${lvl??'—'}</span><span class="n">${n}</span><span class="l">${esc(lib[lvl]||'')}</span><span class="v"><span class="num">${fr(v)}</span>${p?(()=>{const d=Math.round((v-pv)*100)/100;return `<span class="delta ${d<0?'worse':d>0?'better':'flat'}">${d<0?'▼ −':d>0?'▲ +':'= '}${fr(Math.abs(d))}</span>`;})():''}</span>${scale(v,lvl)}</div>`;
  return `<div class="l-side">${sideNav(sectionOf('sources'),'archives')}<div>
   ${crumbs([['Synthèse','synthese'],['Archives des relevés','archives'],[fdate(date),'archive-'+date]])}
   <section class="sheet pagehead"><div><div class="lbl">Relevé archivé · modèle ${esc(h.modele||'v3')}</div><h1>Relevé du ${fdate(date,true,true)}</h1><p>Seuls les niveaux et les faits marquants de ce relevé sont conservés. <a href="#synthese">Revenir au relevé en cours</a>.</p></div></section>
   <div class="tiles" style="margin-top:16px">${row('Stabilité mondiale',h.stabilite_niveau,h.stabilite_continu,p&&p.stabilite_continu,LS)}${row('Risque de guerre',h.guerre_niveau,h.guerre_continu,p&&p.guerre_continu,LG)}${row('France',h.france_niveau,h.france_continu,p&&p.france_continu,LF)}</div>
   <article class="sheet doc"><h3 class="s" style="margin-top:0;border:0;padding:0"><span>Faits marquants</span></h3><ul class="lst">${(h.faits_marquants||'').split(/\s;\s/).filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></article></div></div>`;
}

/* ---------- routeur ---------- */
let curId='synthese';
function route(){
  let id=(location.hash||'#synthese').slice(1)||'synthese';
  let html;
  if(P[id])html=P[id]();
  else if(id.startsWith('monde-')&&DOM[id.slice(6)])html=pageDomaine(id.slice(6));
  else if(id.startsWith('france-')&&COMP[id.slice(7)])html=pageComp(id.slice(7));
  else if(id.startsWith('archive-'))html=pageArchive(id.slice(8));
  else{id='synthese';html=P.synthese();}
  const oldLinks=document.querySelector('#main .side .links'),oldSec=sectionOf(curId.startsWith('archive-')?'archives':curId),keepX=oldLinks?oldLinks.scrollLeft:0;
  curId=id;
  $('#main').innerHTML=html;
  const nl=document.querySelector('#main .side .links');
  if(nl){if(sectionOf(id.startsWith('archive-')?'archives':id)===oldSec)nl.scrollLeft=keepX;const on=nl.querySelector('a.on');if(on){const a=on.offsetLeft-nl.offsetLeft,b=a+on.offsetWidth;if(a<nl.scrollLeft)nl.scrollLeft=a-16;else if(b>nl.scrollLeft+nl.clientWidth)nl.scrollLeft=b-nl.clientWidth+16;}}
  if(P[id]&&P[id].after)P[id].after();
  const sec=sectionOf(id.startsWith('archive-')?'archives':id);
  document.querySelectorAll('.mainnav .top').forEach(b=>b.classList.toggle('on',b.dataset.sec===sec.id));
  closeMenus();closeDrawer();
  const sel=$('#rel');sel.value=id.startsWith('archive-')?id:'synthese';
  const t=titleOf(id);document.title=(t&&id!=='synthese'?t+' · ':'')+'Veille stratégique mondiale';
  const f=pendingFocus&&document.getElementById(pendingFocus);pendingFocus=null;
  if(f){f.scrollIntoView({block:'center'});f.classList.add('flash');const d=f.querySelector('details');if(d)d.open=true;setTimeout(()=>f.classList.remove('flash'),1600);}else window.scrollTo(0,0);
}
let pendingFocus=null;
document.addEventListener('click',e=>{const a=e.target.closest('[data-focus]');if(!a)return;pendingFocus=a.dataset.focus;if(a.getAttribute('href')===location.hash){e.preventDefault();route();}},true);
window.addEventListener('hashchange',route);
buildNav();
$('#foot').innerHTML=`<span>Veille stratégique mondiale · bulletin n° ${nRel} du ${fdate(dateRel)} · modèle ${esc(D.version_modele||'v3')} · ${D.catalogue.length+F.catalogue.length} sources ouvertes</span><span><a href="#methode">Méthode</a><a href="#archives">Archives</a><a href="#sources">Sources</a></span>`;
/* ---------- aperçu de partage : #apercu (capturé en 1200 × 630 pour og.png) ---------- */
function renderApercu(){
  const S=D.scores,F=D.france,sp=spotsAll(),n5=sp.filter(s=>s.x.severite>=5).length;
  const marks=sp.sort((a,b)=>a.x.severite-b.x.severite).map(s=>{const r=3+s.x.severite*1.5,c=({3:'#e0b53c',4:'#ef8b4c',5:'#ef6159'})[s.x.severite]||'#9fb0c8';return `${s.x.tendance==='hausse'?`<circle cx="${s.px}" cy="${s.py}" r="${r+6}" fill="none" stroke="${c}" stroke-width="1.3" opacity=".6"/>`:''}<circle cx="${s.px}" cy="${s.py}" r="${r}" fill="${c}"/>`;}).join('');
  const [fx,fy]=PJ(2.4,46.6);
  const col=n=>({1:'#ef6159',2:'#ef8b4c',3:'#e0b53c',4:'#9cc55a',5:'#4fae84'})[n];
  const o=document.createElement('div');o.id='og';
  o.innerHTML=`<div class="m"><svg viewBox="0 ${MV.top} ${MV.W} ${MV.h-MV.top}"><use href="#vsm-land" class="land"/>${marks}<rect x="${fx-6}" y="${fy-6}" width="12" height="12" fill="#93b6ea"/></svg></div><div class="veil"></div>
   <div class="band"><span>Sources ouvertes · Usage personnel</span><span>Modèle v3 · ${D.catalogue.length+F.catalogue.length} sources</span></div>
   <div class="txt"><span class="mk">VSM</span><h1>Veille stratégique mondiale</h1><p class="sub">Bulletin n° ${(D.historique||[]).length} · ${fdate(D.date_releve,true,true)}</p>
    ${N.titre?`<p class="head">${esc(N.titre)}</p>`:''}
    <div class="lv">${[['Stabilité',S.stabilite.niveau],['Guerre',S.guerre.niveau],['France',F.niveau]].map(([n,l])=>`<div style="--c:${col(l)}"><b>${l}</b><span>${n}</span></div>`).join('')}</div></div>
   <div class="foot"><b>${n5} foyers critiques</b> · ${sp.length} foyers suivis · échelle de 5 (calme) à 1 (critique)</div>`;
  document.body.appendChild(o);document.body.classList.add('og');
}
if(location.hash==='#apercu'){renderApercu();return;}

route();
/* ---------- ouverture animée ---------- */
(function(){
  const KEY='vsm-intro-'+(D.date_releve||'');
  let seen=false;try{seen=sessionStorage.getItem(KEY)==='1';}catch(e){}
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const force=/intro/.test(location.search)||window.__INTRO_FORCE;
  if(!force&&(seen||reduce||navigator.webdriver||document.visibilityState==='hidden'))return;
  try{sessionStorage.setItem(KEY,'1');}catch(e){}
  const V=1;
  const S=D.scores,F=D.france;
  const spots=(typeof spotsAll==='function'?spotsAll():[]).sort((a,b)=>b.x.severite-a.x.severite||a.px-b.px);
  const el=document.createElement('div');el.id='intro';el.className='intro v'+V;el.setAttribute('role','dialog');el.setAttribute('aria-label','Présentation');
  const [fx,fy]=PJ(2.4,46.6);
  el.innerHTML=`<div class="i-map"><svg viewBox="0 ${MV.top} ${MV.W} ${MV.h-MV.top}" preserveAspectRatio="xMidYMid slice"><defs><clipPath id="i-clip"><rect id="i-sweep" x="0" y="-10" width="0" height="480"/></clipPath></defs><g clip-path="url(#i-clip)"><use href="#vsm-land" class="i-land"/></g><line id="i-scan" x1="0" x2="0" y1="-10" y2="470" class="i-scan"/>${spots.map((s,i)=>`<g class="i-spot" data-i="${i}" style="--c:${sevVar(s.x.severite)}"><circle class="i-ring" cx="${s.px}" cy="${s.py}" r="${5+s.x.severite*1.6}"/><circle class="i-dot" cx="${s.px}" cy="${s.py}" r="${3+s.x.severite*1.2}"/></g>`).join('')}<g class="i-fr" transform="translate(${fx-7} ${fy-7})"><rect width="14" height="14"/></g></svg></div>
   <div class="i-veil"></div>
   <div class="i-card"><div class="i-band">Sources ouvertes · Usage personnel</div><div class="i-mk">VSM</div><h2>Veille stratégique mondiale</h2><p class="i-sub">Bulletin n° ${(D.historique||[]).length} · ${fdate(D.date_releve,true,true)}</p>
    <div class="i-lv">${[['Stabilité',S.stabilite.niveau,S.stabilite.libelle],['Guerre',S.guerre.niveau,S.guerre.libelle],['France',F.niveau,F.libelle]].map(([n,l,lib])=>`<div style="--c:${lvlVar(l)}"><b>${l}</b><span>${n}</span><em>${esc(lib)}</em></div>`).join('')}</div>
    <p class="i-foc">${spots.filter(s=>s.x.severite>=5).length} foyers critiques · ${spots.length} foyers suivis</p></div>
   <button type="button" class="i-skip">Passer</button>`;
  document.body.appendChild(el);document.body.style.overflow='hidden';
  const q=s=>el.querySelector(s),sweep=q('#i-sweep'),scan=q('#i-scan'),card=q('.i-card'),gs=[...el.querySelectorAll('.i-spot')];
  const T=4200; let t0=null,done=false,raf;
  const ease=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);
  function frame(t){
    const sw=ease(t/1500)*1000; sweep.setAttribute('width',sw); scan.setAttribute('x1',sw);scan.setAttribute('x2',sw);scan.style.opacity=t<1500?.7:0;
    gs.forEach((g,i)=>{const s=spots[i];const ts=Math.max(s.px/1000*1500, 700+i*55);const k=ease((t-ts)/350);g.style.opacity=k;const ring=g.firstChild;const p=((t-ts)%1400)/1400;if(t>ts){ring.setAttribute('r',5+s.x.severite*1.6+p*12);ring.style.opacity=(1-p)*.7;}});
    q('.i-fr').style.opacity=ease((t-1200)/400);
    const c=ease((t-(V===1?1500:900))/700);card.style.opacity=c;card.style.transform=`translateY(${(1-c)*14}px)`;
    el.querySelectorAll('.i-lv>div').forEach((d,i)=>{const k=ease((t-(V===1?2200:1600)-i*160)/500);d.style.opacity=k;d.style.transform=`translateY(${(1-k)*10}px)`;});
    q('.i-foc').style.opacity=ease((t-(V===1?2900:2300))/500);
    const out=ease((t-T)/700); el.style.opacity=1-out; if(V===1)q('.i-map').style.transform=`scale(${1+out*.06})`;
    if(t>=T+700)finish();
  }
  function loop(ts){if(t0===null)t0=ts;frame(ts-t0);if(!done)raf=requestAnimationFrame(loop);}
  function finish(){if(done)return;done=true;cancelAnimationFrame(raf);el.remove();document.body.style.overflow='';}
  el.addEventListener('click',()=>{if(t0!==null)t0=Math.min(t0,performance.now()-T);});
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'||e.key==='Enter'||e.key===' '){if(t0!==null)t0=Math.min(t0,performance.now()-T);document.removeEventListener('keydown',k);}});
  window.__introFrame=frame; if(!window.__INTRO_FREEZE)raf=requestAnimationFrame(loop);
})();

})();
</script>
