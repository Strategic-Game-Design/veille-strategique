titut"}],"date_donnee":"2026-04-30","prochaine_edition":"2027-05","coef_qualite":0.9,"severite_ajustee":2.0},{"id":"s_cpi_2025","libelle":"Indice de perception de la corruption 2025 – 66/100","severite":2,"tendance":"stable","poids":0.3,"justification":"Transparency International, publié le 10 février 2026 : France 66/100, 27e sur 180 (67 en 2024 ; moyenne 1995-2025 de 69,4, maximum 75 en 2005). Légère érosion tendancielle sans rupture. Vérifié le 23/10/2026 : aucune nouvelle édition dans la fenêtre du 6 au 23 octobre (publication annuelle, prochaine édition attendue en 2027-02).","valeur":"66/100, 27e (février 2026)","rang_source":"institut","qualite":"verifiee","sources":[{"titre":"Transparency International – CPI 2025 France","url":"https://www.transparency.org/en/cpi/2025/index/fra","date":"2026-02-10","rang":"institut"},{"titre":"Trading Economics – France corruption index","url":"https://tradingeconomics.com/france/corruption-index","date":"2026-09-19","rang":"secondaire"}],"date_donnee":"2026-02-10","prochaine_edition":"2027-02","coef_qualite":0.9,"severite_ajustee":2.0},{"id":"s_anssi_panorama_2025","libelle":"ANSSI – Panorama de la cybermenace 2025","severite":4,"tendance":"hausse","poids":0.7,"justification":"Publié le 11 mars 2026 : 3 586 événements de sécurité traités en 2025 (−18 % vs 2024) dont 1 366 incidents ; secteurs enseignement/recherche 34 %, administrations 24 %, santé 10 % ; 460 fuites potentielles (42 % confirmées) ; menaces étatiques russes et chinoises (prépositionnement sur télécoms et énergie) ; l'ANSSI anticipe une hausse massive des attaques hybrides destructrices d'ici 2030. Vérifié le 23/10/2026 : pas de nouvelle édition (annuelle, mars) ; seule actualité ANSSI de la fenêtre : ECSC 2026 (12/10) ; le directeur général de l'ANSSI V. Strubel a été auditionné avec le SGDSN et Viginum par la commission des affaires étrangères et de la défense du Sénat le 21/10/2026.","valeur":"3 586 événements, 1 366 incidents en 2025 (mars 2026)","rang_source":"officiel","qualite":"verifiee","sources":[{"titre":"ANSSI – Panorama de la cybermenace 2025","url":"https://cyber.gouv.fr/actualites/panorama-de-la-cybermenace-2025/","date":"2026-03-11","rang":"officiel"},{"titre":"CERT-FR – CERTFR-2026-CTI-002 (PDF)","url":"https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-002.pdf","date":"2026-03-11","rang":"officiel"},{"titre":"Sénat – Convocation rectifiée de la commission AE-Défense du 21/10/2026 (audition SGDSN, ANSSI, Viginum)","url":"https://www.senat.fr/fileadmin/cru-1781387320/Commissions/Affaires_etrangeres_Defense_Forces_armees/Convocation.pdf","date":"2026-10-19","rang":"officiel"}],"date_donnee":"2026-03-11","prochaine_edition":"2027-03","coef_qualite":1.0,"severite_ajustee":4.25},{"id":"s_ssmsi_bilan_2025","libelle":"SSMSI – Insécurité et délinquance en 2025","severite":4,"tendance":"hausse","poids":0.8,"justification":"Bilan statistique et atlas départemental (page datée 9 juillet 2026) : 975 homicides (stable), tentatives +4 %, coups et blessures volontaires +5 %, violences sexuelles +8 %, trafic de stupéfiants +9 %, escroqueries +7 % ; atteintes aux biens en baisse (cambriolages −3 %, vols de véhicules −9 %, vols avec armes −8 %). Vérifié le 23/10/2026 : aucune nouvelle édition dans la fenêtre du 6 au 23 octobre (publication annuelle, prochaine édition attendue en 2027-01).","valeur":"975 homicides ; violences sexuelles +8 % ; trafic +9 % (2025)","rang_source":"officiel","qualite":"verifiee","sources":[{"titre":"Interstats – Insécurité et délinquance en 2025 : bilan statistique","url":"https://www.interieur.gouv.fr/Interstats/Actualites/Insecurite-et-delinquance-en-2025-bilan-statistique-et-atlas-departemental","date":"2026-07-09","rang":"officiel"}],"date_donnee":"2026-07-09","prochaine_edition":"2027-01","coef_qualite":1.0,"severite_ajustee":4.25},{"id":"s_bdf_ers_juin_2026","libelle":"Banque de France – ERS juin 2026","severite":3,"tendance":"hausse","poids":0.6,"justification":"Évaluation des risques du système financier publiée le 24 juin 2026 : risque dominant = instabilité géopolitique (conflit au Moyen-Orient depuis le 28 février, fermeture du détroit d'Ormuz, ~20 % de la consommation mondiale d'hydrocarbures) ; le système financier « continue de faire preuve de résilience ». Pas de note chiffrée. Vérifié le 23/10/2026 : pas de nouvelle ERS (prochaine en décembre) ; publications BdF de la fenêtre : enquête mensuelle de conjoncture (12/10), billets sur prix du pétrole et délais de paiement ; une étude « Comment anticiper les risques extrêmes sur la croissance en France ? » est annoncée pour le 23/10.","valeur":"Risque dominant : instabilité géopolitique (24/06/2026)","rang_source":"officiel","qualite":"verifiee","sources":[{"titre":"Banque de France – Financial Stability Report June 2026","url":"https://www.banque-france.fr/en/news/financial-stability-report-june-2026","date":"2026-06-24","rang":"officiel"},{"titre":"Banque de France – Publications (consultée le 23/10/2026)","url":"https://www.banque-france.fr/fr/publications-et-statistiques/publications","date":"2026-10-23","rang":"officiel"}],"date_donnee":"2026-06-24","prochaine_edition":"2026-12","coef_qualite":1.0,"severite_ajustee":3.25},{"id":"s_lpm_actualisee_2026","libelle":"LPM actualisée (loi n° 2026-791 du 16 août 2026)","severite":3,"tendance":"stable","poids":0.5,"justification":"LPM actualisée promulguée le 16 août 2026 : +36 Md€ sur 2026-2030 (436 Md€ au total), 2,7 % du PIB en 2030, 3,5 % visé en 2035. Première annuité dans le PLF 2027 (déposé le 01/10/2026) : environ +6,4/6,5 Md€ pour la Défense (> 63,4 Md€), l'un des seuls budgets en hausse ; le CEMA F. Mandon a été auditionné par la commission de la défense de l'AN le 8 octobre, l'avis budgétaire de cette commission (n° 3394) est daté du 22 octobre, et la discussion en séance a commencé le 13 octobre. Risque d'exécution accru : le HCFP (avis du 25/09, présenté au Sénat le 07/10) juge la croissance 2027 (1 %) « optimiste », le déficit 2026 à 5,4 % et la dette proche de 122 % du PIB en 2027, avec une charge d'intérêts qui absorbe une large part de l'effort.","valeur":"+36 Md€ 2026-2030 ; PLF 2027 Défense ≈ +6,5 Md€ (> 63,4 Md€) ; avis AN n° 3394 (22/10)","rang_source":"officiel","qualite":"verifiee","sources":[{"titre":"Assemblée nationale – Dossier législatif PLF 2027 (projet n° 3210, avis défense n° 3394 du 22/10)","url":"https://www.assemblee-nationale.fr/dyn/17/dossiers/PLF_2027","date":"2026-10-22","rang":"officiel"},{"titre":"HCFP – Avis n° HCFP-2026-5 relatif aux PLF et PLFSS 2027","url":"https://www.hcfp.fr/sites/default/files/2026-10/Avis%20HCFP%202026-5%20-%20PLF-PLFSS%202027.pdf","date":"2026-09-25","rang":"officiel"},{"titre":"Sénat – La loi en clair : actualisation de la LPM","url":"https://www.senat.fr/travaux-parlementaires/textes-legislatifs/la-loi-en-clair/projet-de-loi-actualisant-la-programmation-militaire-pour-les-annees-2024-a-2030-et-portant-diverses-dispositions-interessant-la-defense.html","date":"2026-08-16","rang":"officiel"},{"titre":"LCP – Budget 2027 : audition de Fabien Mandon, chef d'état-major des armées","url":"https://lcp.fr/index%2ephp/programmes/la-seance-est-ouverte/budget-2027-audition-de-fabien-mandon-chef-d-etat-major-des-armees","date":"2026-10-08","rang":"presse"},{"titre":"Public Sénat – Budget 2027 : le HCFP pointe des prévisions « optimistes »","url":"https://www.publicsenat.fr/actualites/economie/budget-2027-le-haut-conseil-des-finances-publiques-pointe-des-previsions-optimistes-du-gouvernement","date":"2026-10-07","rang":"presse"}],"date_donnee":"2026-10-22","prochaine_edition":"2026-12 (vote de la loi de finances 2027, mission Défense)","coef_qualite":1.0,"severite_ajustee":3.0}],"echelles":[{"nom":"Vigipirate","autorite":"SGDSN / Premier ministre","niveaux":["vigilance","vigilance renforcée","alerte attentat"],"niveau_actuel":"vigilance renforcée (posture été-automne 2026, ministère de l'Intérieur) ; aucun changement repéré au 23/10 ; page SGDSN illisible","date_niveau_actuel":"2026-10-23","historique_2026":"« Urgence attentat » (ancien plan, niveau maximal) du 5 janvier au 21 juin 2026 (posture hiver-printemps, en continuité depuis le 25 mars 2024) ; nouveau plan « Faire face ensemble » et passage au niveau intermédiaire « vigilance renforcée » le 22 juin 2026 (posture été-automne 2026, priorités drones/sites touristiques/bâtiments publics) ; renforcement de Sentinelle et télégramme « extrême vigilance » début mars 2026 (guerre d'Iran) ; aucun changement en septembre 2026. Confirmé inchangé au 21 septembre 2026 (SGDSN, préfecture de l'Ain) ; réunion des préfets de zone sur la résilience nationale le 17/09/2026. Confirmé inchangé au 28 septembre 2026 (SGDSN) ; le 24/09, le président évoque publiquement un scénario d'attaques de drones russes contre la France et demande un plan de protection des infrastructures critiques (nucléaire, réseaux électriques, ports), sans relèvement du niveau ; grève et manifestations de la fonction publique le 29/09 sous cette posture. Confirmé inchangé au 6 octobre 2026 (page SGDSN consultée ce jour ; alerte MEAE du 10/09 au même stade) : aucun relèvement après l'épisode du 24/09 ni autour des manifestations du 29/09 (206 000 manifestants, 440 interpellations). — Relevé du 23/10/2026 : Du 06 au 23/10/2026, aucun changement de niveau n'a été repéré : ni après l'attaque du collège d'Aubagne (12/10, PNAT saisi le 13/10), ni après les violences du 17/10 (2 397 interpellations). La page SGDSN était bloquée par un contrôle anti-robot le 23/10, et la posture hiver-printemps n'est pas encore annoncée. — Complément du 23/10/2026 (soir) : 23/10/2026 : aucune annonce de changement de niveau ni de posture hiver-printemps 2026-2027 (ministère de l'Intérieur, info.gouv.fr, presse) ; la page SGDSN et la page de la préfecture de l'Ain sont restées inaccessibles (anti-robot, maintenance), à la veille de la journée de mobilisation du 24/10. — Relevé du 25/10/2026 : aucun changement de niveau ni posture hiver-printemps 2026-2027 repérés du 23 au 25/10/2026 (recherche web : les pages du ministère et de l'enseignement supérieur indiquent toujours « vigilance renforcée » depuis le 22/06/2026) ; page SGDSN non consultable (accès réseau impossible depuis cet environnement).","url":"https://www.sgdsn.gouv.fr/vigipirate"},{"nom":"Vigilance météorologique","autorite":"Météo-France","niveaux":["vert","jaune","orange","rouge"],"niveau_actuel":"orange vent : 15 départements (tempête Austen ; Bretagne, Normandie, Loire-Atlantique, Nord, Pas-de-Calais, Somme, Yvelines, Val-d'Oise) et 53 en jaune pour le 23/10/2026, 0 rouge (bulletin du 22/10 16 h)","date_niveau_actuel":"2026-10-22","historique_2026":"Épisodes majeurs : canicule fin mai (17 départements orange le 26-30 mai) ; 25 juin 2026 : 72 départements en rouge canicule et 14 en orange, inédit depuis 2004 ; 12 juillet : 37 rouges, 46 oranges ; 13-14 août : jusqu'à 80 départements orange ; historique complet des vigilances orange/rouge 2026 non compilé. 19/09 : jaune orages 2A/2B ; 20-21/09 : carte entièrement verte (bulletin du 20/09, 6 h). 27/09 : carte entièrement verte (bulletin du 27/09 6 h ; 22-26/09 non compilés) ; 28/09 : retour des orages, 26 départements en jaune orages (Île-de-France, Centre, Poitou-Charentes, Aquitaine, Pyrénées), > 20 mm en 3 h à Niort ; pic de chaleur tardif (> 30 °C) attendu le 29/09 et épisode cévenol annoncé pour les 30/09-01/10 (jusqu'à 300 mm). 30/09 : épisode cévenol, Gard et Hérault en vigilance ROUGE pluie-inondation (levée à 22 h 15), 337,6 mm à Saint-Hippolyte-du-Fort, 299 mm à Colognac, 80-120 mm en 3 h à Montpellier, écoles fermées, 8 évacués, 1 blessée légère, aucun décès rapporté ; orange maintenu jusqu'au 01/10 (9 h dans le Gard et l'Hérault, midi dans les Bouches-du-Rhône), Var menacé le soir du 01/10 (issue non lue) ; 02-05/10 non compilés. 06/10 (bulletin de 6 h) : nouveau passage en orange pluie-inondation/orages du Gard et de l'Hérault, 39 départements en jaune ; 61 jaune annoncés pour le 07/10. — Relevé du 23/10/2026 : Les 07-21/10/2026 n'ont pas été compilés. Le 22/10, 3 départements bretons étaient en orange vent. Pour le 23/10 (tempête Austen, première tempête d'automne), 15 départements sont en orange vent et 53 en jaune, avec des rafales de 130 à 140 km/h sur les côtes ; la presse annonce 23 départements en orange, dont l'Île-de-France, au bulletin du 23/10 6 h (non vérifié). — Relevé du 25/10/2026 : le bulletin de vigilance du 24 et du 25/10/2026 n'a pas pu être lu (accès à vigilance.meteofrance.fr impossible) ; aucune source trouvée sur les niveaux du 24-25/10 ni sur un bilan de la tempête Austen (23/10). Dernier état vérifié : bulletin du 22/10 16 h (15 départements orange vent, 0 rouge). Non compilé : 07-21/10 ; 24-25/10.","url":"https://vigilance.meteofrance.fr/fr/vigilance-accessible"},{"nom":"ORSAN (organisation de la réponse du système de santé)","autorite":"Ministère de la Santé / ARS (volets AMAVI, CLIM, EPI-VAC, BIO, NRC)","niveaux":["niveau 1 – surveillance","niveau 2 – coordination renforcée","niveau 3 – mobilisation maximale (déprogrammations ciblées)","niveau 4 – dépassement des capacités nationales"],"niveau_actuel":"aucune activation nationale signalée","date_niveau_actuel":"2026-10-23","historique_2026":"Niveau 2 activé le 23 juin 2026 puis niveau 3 activé nationalement le 25 juin 2026 (72 départements, 51,1 M d'habitants, réserve sanitaire mobilisée) — première activation nationale simultanée du niveau 3 ; date de désactivation non retrouvée ; aucune activation signalée en septembre. Aucune activation signalée du 18 au 21 septembre 2026. Aucune activation signalée du 22 au 28 septembre 2026 (ministère de la Santé non consulté ; aucune vigilance canicule). Aucune activation signalée du 28 septembre au 6 octobre 2026 (recherche presse ; ministère de la Santé non consulté) ; lors de l'épisode cévenol du 30/09, seul un aménagement d'activité du CHU de Nîmes (report des rendez-vous non urgents) est rapporté. — Relevé du 23/10/2026 : Aucune activation ORSAN signalée du 06 au 23/10/2026 (recherche presse limitée ; ministère de la Santé non consulté), y compris après les violences du 17/10 (997 membres des forces de l'ordre blessés) et pendant la tempête Austen. — Relevé du 25/10/2026 : aucune activation ORSAN repérée du 23 au 25/10/2026 (recherche limitée).","url":"https://www.journaldeleconomie.fr/orsan-niveau-3-comment-sante-canicule/"},{"nom":"Vigilance canicule / plan de gestion des vagues de chaleur","autorite":"Météo-France (vigilance) / ministère de la Santé, Santé publique France","niveaux":["vert – pas de vigilance","jaune – pic de chaleur","orange – canicule","rouge – canicule extrême"],"niveau_actuel":"vert – aucune vigilance canicule en cours","date_niveau_actuel":"2026-10-22","historique_2026":"Quatre épisodes : 24-28 mai (≥ 300 décès en excès), 17 juin-2 juillet (5 764 décès en excès, 72 départements rouges le 25 juin, température moyenne nationale record de 30 °C les 24-25 juin), 3-20 juillet (≥ 1 243), 27 juillet-20 août (≥ 817, 79 départements, durée record égalant juillet 1983) ; ≥ 7 800 décès en excès cumulés, été le plus meurtrier depuis 2003 ; bilan consolidé SPF à venir. Aucun nouveau bilan SPF depuis le 16/09/2026 ; aucune vigilance au 20-21/09. Aucune vigilance canicule du 22 au 28/09/2026 malgré un pic de chaleur tardif annoncé (> 30 °C le 29/09) ; aucun nouveau bilan SPF depuis le 16/09 (≥ 7 800 décès en excès). Aucune vigilance canicule du 29/09 au 06/10/2026 (bulletin Météo-France du 06/10 : pluie-inondation et orages seulement) ; toujours pas de bilan consolidé SPF (dernier : 16/09, ≥ 7 800 décès en excès ; ≈ 7 919 selon l'addition de presse du 17/09). — Relevé du 23/10/2026 : Aucune vigilance canicule du 06 au 23/10/2026 (bulletin du 22/10 : vent, pluie-inondation, orages, vagues-submersion) ; aucun nouveau bilan SPF repéré depuis celui du 16/09 (≥ 7 800 décès en excès). — Relevé du 25/10/2026 : toujours pas de bilan consolidé SPF ; SPF indique un bilan définitif attendu début 2027 (périmètre de surveillance 01/06-15/09) ; provisoire cumulé 7 919 décès en excès (presse du 17/09). Aucune vigilance canicule repérée.","url":"https://www.santepubliquefrance.fr/climat/fortes-chaleurs-canicule/bulletin-national/canicule-et-sante-exces-de-mortalite-durant-lepisode-de-canicule-du-27-juillet-au-20-aout-2026"},{"nom":"Vigilance feux de forêt (Météo des forêts)","autorite":"Météo-France / DGSCGC (sécurité civile)","niveaux":["vert – danger faible","jaune – danger modéré","orange – danger élevé","rouge – danger très élevé"],"niveau_actuel":"non compilé (carte Météo des forêts non consultée ; saison close de fait, tempête et pluies sur l'ouest)","date_niveau_actuel":"2026-10-22","historique_2026":"Saison record : ≈ 96 300 ha brûlés au 24 août (EFFIS ; précédent record 66 300 ha en 2022), ~11 000 départs de feu ; incendie de Saumos (Gironde) du 23 juillet : 42 000 ha, 252 bâtiments détruits, 208 000 personnes évacuées, 330+ pompiers blessés, 3 300 sapeurs-pompiers et 1 500 militaires engagés, « plus grande opération feu de forêt de l'histoire de la sécurité civile » ; sécheresse extrême des sols sur 77 % du territoire mi-août. Estimations divergentes : 71 612 ha (VigieFeux/EFFIS au 20/09/2026, 37 626 ha en Gironde) vs ≈ 96 300-100 000 ha (compilations EFFIS fin août) ; hommage national aux pompiers morts en Gironde le 18/09/2026 à Bordeaux. Aucun grand feu signalé du 22 au 28/09/2026 ; toujours pas de bilan officiel DGSCGC de la saison (dernière estimation : 71 612 ha VigieFeux/EFFIS au 20/09). Au 05/10/2026 : 93 561 ha et 769 feux cartographiés par satellite (Sylvie Forêt ; 37 632 ha en Gironde), dont ≈ 1 084 ha sur les 30 derniers jours (Ariège 409 ha, Landes 292 ha) ; départs encore signalés dans l'Aude du 21 au 27/09 ; toujours pas de bilan officiel DGSCGC. — Relevé du 23/10/2026 : Au 22/10/2026 : environ 94 132 ha et 786 feux cartographiés par satellite (Sylvie Forêt/EFFIS ; 37 632 ha en Gironde), dont 23 feux et environ 819 ha sur 30 jours ; toujours pas de bilan officiel de la DGSCGC.","url":"https://www.gironde.gouv.fr/Actualites/Communiques-de-presse/Communiques-de-presse-2026/Aout-2026/Incendie-de-Saumos-point-de-situation-ce-samedi-1er-aout-a-20h"},{"nom":"Échelle INES (événements nucléaires et radiologiques)","autorite":"ASNR (Autorité de sûreté nucléaire et de radioprotection)","niveaux":["0 – écart","1 – anomalie","2 – incident","3 – incident grave","4 – accident n'entraînant pas de risque important hors du site","5 – accident entraînant un risque hors du site","6 – accident grave","7 – accident majeur"],"niveau_actuel":"niveau 1 (maximum 2026) ; les 4 avis ASNR d'octobre sont tous au niveau 1","date_niveau_actuel":"2026-10-22","historique_2026":"Au moins 15 événements de niveau 1 entre le 25 juin et le 17 septembre 2026 (Cattenom 2 et 4, Nogent 1, Chooz B2, Saint-Alban 1, Tricastin, Golfech 1 et 2, Blayais 1, Dampierre, Chinon B1, Bugey 2, CEA LECI Saclay, Framatome) plus des avis antérieurs (février-mars) ; aucun événement ≥ niveau 2 identifié en 2026 ; arrêt temporaire de Golfech le 23 juin pour canicule. Aucun nouvel avis du 18 au 21 septembre 2026. 23/09/2026 : trois nouveaux avis d'incident ASNR (Civaux : indisponibilité de deux chaînes de mesure neutronique détectée tardivement ; RHF de l'ILL : distribution de faisceau de neutrons ; Tricastin : indisponibilité d'une alimentation électrique de secours), niveaux INES non vérifiés ; EDF a déclaré le 14/09 un ESS de niveau 1 sur Blayais 1 (faits du 10/09) ; aucun événement ≥ 2. 29/09/2026 : deux nouveaux avis ASNR (Chooz B1 : indisponibilité prolongée d'un groupe diesel de secours après erreur de maintenance ; Blayais : indisponibilité de la source électrique externe auxiliaire au-delà du délai autorisé), déclarés au niveau 1 par EDF ; aucun avis daté d'octobre au 06/10, aucun événement ≥ 2. — Relevé du 23/10/2026 : ASNR : le 09/10/2026, avis sur Cattenom 3 (réglage erroné des soupapes du circuit de réfrigération à l'arrêt) et Saint-Laurent-des-Eaux 1 (soupape bloquée sur l'injection aux joints des pompes primaires) ; le 14/10, détection tardive d'un dépassement de débit de fuite du circuit primaire (réacteur 2, site non précisé) ; le 22/10, non-respect des RGE après indisponibilité d'une soupape. Niveaux INES non indiqués ; aucun événement de niveau 2 ou plus. — Complément du 23/10/2026 (soir) : Niveaux INES des avis d'octobre confirmés sur les pages ASNR : Cattenom 3 (niveau 1, déclaré le 05/10, publié le 09/10) ; Saint-Laurent-des-Eaux 1 (niveau 1 après reclassement le 30/09, publié le 09/10) ; Cruas-Meysse 2 (fuite du circuit primaire du 25/09, niveau 1, publié le 14/10) ; EPR de Flamanville (non-respect des RGE le 01/10, niveau 1, publié le 22/10). Aucun événement de niveau 2 ou plus. — Relevé du 25/10/2026 : aucun nouvel avis ASNR repéré après celui du 22/10 (Flamanville EPR) ; aucun événement de niveau 2 ou plus (liste ASNR non consultable directement).","url":"https://reglementation-controle.asnr.fr/controle/ines-et-asn-sfro"},{"nom":"CERT-FR – alertes de sécurité (CERTFR-AAAA-ALE-nnn)","autorite":"ANSSI / CERT-FR","niveaux":["pas d'échelle de niveau : alerte ouverte / alerte clôturée (indicateur = nombre d'alertes ouvertes)"],"niveau_actuel":"4 alertes ouvertes : ALE-014 PHP (21/10), ALE-013 Ivanti Connect Secure (14/10), ALE-012 contrôleurs de réfrigération (12/10), ALE-011 Citrix NetScaler (28/09)","date_niveau_actuel":"2026-10-22","historique_2026":"10 alertes émises en 2026 (ALE-001 Ivanti EPMM 30/01 ; ALE-002 Cisco SD-WAN 25/02 ; ALE-003 ciblage des messageries instantanées 20/03 ; ALE-004 F5 BIG-IP ; ALE-005 Exchange 15/05 ; ALE-006 SonicWall 15/07 ; ALE-007 WordPress 20/07 ; ALE-008/009/010 ouvertes) ; contexte : fuite ANTS 11,7 M de comptes (avril), vague de fuites publiques en août, attribution au FSB le 13 juillet 2026. Clôtures : ALE-002 (26/03), ALE-003 (20/04), ALE-005 (13/07), ALE-001 et ALE-004 (28/07), ALE-006 et ALE-007 (24/08) ; aucune nouvelle alerte ni clôture du 19 au 21/09/2026. Clôture de CERTFR-2026-ALE-008 (Microsoft SharePoint, publiée le 22/07) le 22/09/2026 ; aucune nouvelle alerte (pas d'ALE-011) au 28/09 ; 10 émises, 8 clôturées en 2026. 28/09/2026 : ouverture de CERTFR-2026-ALE-011 (Citrix NetScaler ADC et Gateway, exploitation active antérieure aux correctifs, mise à jour le 30/09) ; au 06/10 : 3 ouvertes, 11 émises, 8 clôturées ; le 30/09, l'ANSSI reconnaît la compromission de 120 de ses comptes (118 ANSSI, 2 DINUM) via la faille Metabase (ALE-010), au lendemain de son rapport sur le piratage de la DGFiP (≈ 700 000 contribuables). — Relevé du 23/10/2026 : Le 12/10/2026, ouverture d'ALE-012 (incident ciblant les contrôleurs à distance des installations de réfrigération : Danfoss, Copeland/Dixell ; compromissions nombreuses, mise à jour le 13/10). Le 13/10, clôture d'ALE-009 (SonicWall SMA) et d'ALE-010 (Metabase). Le 14/10, ouverture d'ALE-013 (Ivanti Connect Secure) ; le 21/10, d'ALE-014 (PHP, mise à jour le 22/10). Au 23/10 : 4 alertes ouvertes, 14 émises, 10 clôturées ; le site a migré vers cert.cyber.gouv.fr. — Relevé du 25/10/2026 : aucune ALE-015 ni nouvelle alerte repérée du 23 au 25/10/2026 (recherche web ; site CERT-FR inaccessible depuis cet environnement). Compte maintenu à 4 ouvertes, sans vérification directe.","url":"https://www.cert.ssi.gouv.fr/alerte/"},{"nom":"FR-Alert (alerte des populations par diffusion cellulaire)","autorite":"Ministère de l'Intérieur (DGSCGC) / préfectures","niveaux":["pas d'échelle : alerte déclenchée par type d'événement (incendie, inondation, orage, attentat, accident industriel, alerte enlèvement)"],"niveau_actuel":"aucune alerte en cours connue ; dernière diffusion identifiée le 30/09/2026 ; tableau officiel inaccessible (robots, 23/10)","date_niveau_actuel":"2026-09-30","historique_2026":"Extension au relais des alertes enlèvement (mars 2026) ; utilisé pour l'évacuation du Cap Ferret / Bassin d'Arcachon (~40 000 personnes en quelques heures) lors de l'incendie de Saumos fin juillet 2026 ; tableau des alertes 2026 disponible sur fr-alert.gouv.fr mais non consultable. Aucune diffusion FR-Alert signalée par la presse du 18 au 21/09/2026 (non vérifiable sur le tableau officiel). Aucune diffusion FR-Alert identifiée du 22 au 28/09/2026 (tableau officiel toujours inaccessible, robots/TLS ; presse non exhaustive). 30/09/2026 : messages FR-Alert diffusés dans le Gard et l'Hérault pendant la vigilance rouge pluie-inondation (consigne de rester à l'abri ; source AFP, périmètre exact non précisé) ; tableau officiel toujours inaccessible au 06/10 ; diffusion éventuelle pour la vigilance orange du 06/10 non vérifiée. — Relevé du 23/10/2026 : Aucune diffusion FR-Alert identifiée du 06 au 23/10/2026 (tableau officiel bloqué par robots.txt ; recherche limitée). Une éventuelle diffusion pour la tempête Austen (orange vent, 23/10) n'a pas été vérifiée. — Relevé du 25/10/2026 : aucune diffusion FR-Alert identifiée du 23 au 25/10/2026 (tableau officiel inaccessible) ; diffusion pour la tempête Austen non vérifiée.","url":"https://fr-alert.gouv.fr/tableau-alertes"},{"nom":"État d'urgence (loi n° 55-385 du 3 avril 1955)","autorite":"Président de la République en Conseil des ministres (décret, 12 jours) puis Parlement (loi de prorogation)","niveaux":["non déclaré","déclaré par décret (12 jours)","prorogé par la loi"],"niveau_actuel":"non déclaré","date_niveau_actuel":"2026-10-23","historique_2026":"Aucun décret d'état d'urgence identifié en 2026 (à confirmer sur Légifrance) ; la LPM actualisée (loi 2026-791 du 16 août 2026) crée par ailleurs un « état d'alerte de sécurité nationale », non activé. Aucun décret d'état d'urgence ni activation de l'« état d'alerte de sécurité nationale » signalés au 21/09/2026. Aucun décret d'état d'urgence ni activation de l'« état d'alerte de sécurité nationale » signalés au 28/09/2026 (Légifrance non consulté ; rien dans l'interview présidentielle du 24/09 ni dans la presse). Aucun décret d'état d'urgence ni activation de l'« état d'alerte de sécurité nationale » signalés au 06/10/2026 (recherche presse sans résultat ; Légifrance non consulté). — Relevé du 23/10/2026 : Après les émeutes et pillages des 17-18/10/2026, l'état d'urgence n'a pas été déclaré au 23/10. S. Lecornu l'écarte « pour l'heure » tout en se disant prêt à le décréter « si c'est nécessaire » ; B. Retailleau (LR) le réclame et 71 % des sondés le souhaitent dans les zones touchées (Elabe, 21/10). Le gouvernement privilégie des couvre-feux préfectoraux localisés depuis le 19/10 (Paris, Lyon, Marseille, Toulouse) et des interdictions de manifester, seules les manifestations syndicales étant autorisées le 24/10 (annonce d'E. Macron, 22/10). Un Conseil de sécurité s'est tenu à l'Élysée le 22/10. L'« état d'alerte de sécurité nationale » n'a pas été activé (Légifrance non consulté). — Relevé du 25/10/2026 : aucune déclaration d'état d'urgence repérée au 25/10/2026 (recherche web ; Légifrance non consulté). Emmanuel Macron aurait affirmé que « l'état d'urgence ne se justifie pas dans la situation actuelle » (article du 21/10) ; la coordination à l'origine du 17/10 annonce un « acte II » le 24/10 et une action le 31/10. Bilan du 24/10 non trouvé.","url":"https://www.legifrance.gouv.fr"},{"nom":"Notations souveraines (dette long terme de la France)","autorite":"Fitch Ratings, S&P Global Ratings, Moody's","niveaux":["AAA / Aaa","AA+ / Aa1","AA / Aa2","AA- / Aa3","A+ / A1","A / A2","A- / A3","BBB+ / Baa1","BBB / Baa2","BBB- / Baa3","spéculatif (BB+ / Ba1 et en dessous)"],"niveau_actuel":"Moody's Aa3 perspective négative, maintenue le 23/10/2026 sans action de notation (dégradation à A1 attendue mais évitée) ; Fitch A+ stable (28/08/2026) ; S&P A+ stable (29/05/2026, revue le 27/11/2026) ; DBRS AA négative (18/09/2026) ; Scope A+ stable (18/09/2026) ; KBRA AA- stable (12/06/2026, revue le 11/12/2026)","date_niveau_actuel":"2026-10-23","historique_2026":"Aucune dégradation en 2026 après celles de 2025 (Fitch AA- → A+ le 12/09/2025, S&P AA- → A+ le 17/10/2025, Moody's Aa3 perspective négative le 24/10/2025) ; prochaines revues programmées : Moody's 24/10/2026, S&P 28/11/2026 ; spread OAT-Bund > 100 pb en séance le 18/09/2026, plus haut depuis 2012. Aucune action de notation du 18 au 21/09/2026 ; revue Moody's du 24/10 = prochain rendez-vous, sous pression d'un spread OAT-Bund > 100 pb. Aucune action de notation du 21 au 28/09/2026 ; spread OAT-Bund en clôture au-dessus de 100 pb du 22 au 25/09 (105,4 pb le 25/09, pic 109,9 pb le 24/09), CDS 5 ans 41,5 pb (18/09), France empruntant plus cher que l'Italie ; PLF 2027 (54 Md€, déficit 5 %) en Conseil des ministres le 30/09-1er/10 avant la revue Moody's du 24/10. Aucune action de notation du 28/09 au 06/10/2026 (tableau de l'Agence France Trésor consulté le 06/10) ; DBRS a confirmé AA avec perspective négative et Scope A+ stable le 18/09 ; l'AFT affiche la revue Moody's au 23/10 et celle de S&P au 27/11 (soit un jour plus tôt que les dates retenues jusqu'ici) ; spread OAT-Bund donné à 130,3 pb le 01/10 et 146,9 pb le 02/10 par un agrégateur (source unique, à recouper). — Relevé du 23/10/2026 : Du 6 au 23/10/2026, aucune action de notation n'a été publiée. La revue Moody's du 23/10 était attendue après la clôture, avec une baisse d'un cran à A1 anticipée par la plupart des économistes (Boursorama, 21/10) et environ 91 % de probabilité d'une dégradation sur Polymarket. Le spread OAT-Bund est passé de 127 pb (6/10) à 174,6 pb (22/10), l'OAT 10 ans dépassant 5 % (21/10, une première depuis 2002) et le CDS 5 ans atteignant 80,8 pb (12/10, plus haut depuis 2013). Le résultat de la revue Moody's reste à intégrer. — Complément du 23/10/2026 (soir) : 23/10/2026 (après la clôture) : Moody's publie sa revue sans action de notation, et la France reste Aa3 perspective négative, contre une dégradation à A1 anticipée par la plupart des économistes et environ 91 % de probabilité sur Polymarket. L'agence suppose l'adoption d'un budget 2027 réduisant le déficit et une légère détente des coûts de financement et des tensions sociales. S. Lecornu salue une décision qui « déjoue les pronostics déclinistes ». Prochain rendez-vous : S&P le 27/11.","url":"https://countryeconomy.com/ratings/france"}],"stats":{"n":33,"n_struct":10,"n5":5,"n4":16,"hausse":12,"baisse":0,"syst":9,"rangs":{"officiel":19,"institut":11,"presse":13,"secondaire":0,"lacune":0}},"catalogue":[{"domaine":"securite","nom":"Vigipirate – posture nationale","editeur":"SGDSN","url":"https://www.sgdsn.gouv.fr/vigipirate","frequence":"Posture semestrielle (été-automne, hiver-printemps) + adaptations événementielles","mesure":"Niveau de la menace terroriste et mesures de protection (3 niveaux, plan « Faire face ensemble » 2026)","acces":"Public","niveau":"A","verifie":"2026-10-25","consultee":false,"statut":"bloqué","dernier_doc":"Recherche web du 25/10/2026 : vigilance renforcée toujours en vigueur depuis le 22/06/2026, aucune posture hiver-printemps 2026-2027 annoncée (page SGDSN non lue).","journal":[{"date":"2026-09-19","statut":"répondu"},{"date":"2026-09-21","statut":"répondu"},{"date":"2026-09-28","statut":"répondu"},{"date":"2026-10-06","statut":"répondu"},{"date":"2026-10-23","statut":"bloqué"},{"date":"2026-10-25","statut":"bloqué"}]},{"domaine":"securite","nom":"Portail Vigipirate (mesures détaillées)","editeur":"SGDSN","url":"https://www.vigipirate.gouv.fr","frequence":"Continu","mesure":"Mesures du plan Vigipirate, fiches pratiques","acces":"Public","niveau":"B","verifie":"2026-10-25","consultee":false,"statut":"bloqué","dernier_doc":"Accès direct impossible (WebFetch : erreur DNS sur les domaines .gouv.fr le 25/10/2026) ; seule la recherche web a été utilisée.","journal":[{"date":"2026-09-19","statut":"non sollicitée"},{"date":"2026-09-21","statut":"bloqué"},{"date":"2026-09-28","statut":"bloqué"},{"date":"2026-10-06","statut":"bloqué"},{"date":"2026-10-23","statut":"bloqué"},{"date":"2026-10-25","statut":"bloqué"}]},{"domaine":"securite"," const REPORT = "<p>Relevé du <strong>dimanche 25 octobre 2026<\/strong>, comparé à celui du 23 octobre. Modèle v3 inchangé. <strong>La fenêtre est de deux jours, week-end compris, et aucune page n'a pu être lue directement<\/strong> (erreur DNS sur tous les domaines) : les faits ci-dessous viennent de recherches web, surtout de presse, et sont datés. Les indicateurs sans fait nouveau sont reportés du 23 octobre.<\/p>\n<h3>Synthèse<\/h3>\n<p><strong>Stabilité mondiale : niveau 2, « Crise systémique » (1,94, contre 1,94 le 23 oct.).<\/strong> <strong>Risque de guerre mondiale : niveau 3, « Risque élevé » (calculé 1,93, contre 1,93 ; brut 2, maintenu à 3 par la règle de palier).<\/strong> <strong>France : niveau 3, « Tension marquée » (2,22, contre 2,2 ; brut 2, plancher 3).<\/strong> Sous-niveaux : risque extérieur 2,52 (contre 2,47 ; niveau 3, « Risque élevé », le passage de 2 à 3 tient à l'arrondi), tension intérieure 1,82 (contre 1,76), alertes officielles 2,38 (inchangées).<\/p>\n<p>Rien ne franchit de seuil. Trois faits dominent : l'ambiguïté américaine sur l'Iran (frappe possible dès le 25 ou « grand accord »), la poursuite des tirs houthis sur l'Arabie saoudite et du minage revendiqué à Ormuz avec un Brent à 116,72 $, et, en France, la mobilisation du 24 octobre sur fond de spread à ≈ 172 pb avant le vote des recettes du 3 novembre.<\/p>\n<h2>Monde<\/h2>\n<h3>Iran, Ormuz et Golfe<\/h3>\n<p>Les 24 et 25 octobre, Donald Trump a dit pouvoir frapper l'Iran dès le 25 ou conclure un « grand accord », ce qui contredit l'attente annoncée jusqu'au 3 novembre ; ABC relaie par ailleurs des plans de frappes américano-israéliennes après cette date. Une offre iranienne par le Pakistan (Ormuz contre levée du blocus) est démentie par les médias iraniens. Ces éléments ne reposent que sur de la presse (India TV, Arab Times, ABC, CBS) : l'indicateur « canal de désescalade États-Unis–Iran » passe à 4 en hausse, qualité non vérifiée.<\/p>\n<p>À Ormuz, les Gardiens de la révolution revendiquent deux supertankers immobilisés par des mines (23 oct.), plus quatre navires frappés et trois minés au total selon leurs communiqués, contestés par Trump. Ces revendications ne sont pas vérifiées ; l'indicateur reste à 5, en hausse. Le 24 octobre, des missiles houthis ont été interceptés vers Riyad, Taïf et Yanbu ; les Houthis disent avoir frappé l'oléoduc Est-Ouest, Yanbu et Rabigh, ce que Riyad ne confirme pas. Washington ordonne le départ du personnel non essentiel d'Arabie saoudite, et le <em>Wall Street Journal<\/em> (cité par Gulf News) rapporte que les États-Unis rechargent des munitions sur l'USS <em>George Washington<\/em>.<\/p>\n<h3>Ukraine et diplomatie<\/h3>\n<p>Dans la nuit du 21 au 22 octobre, 21 missiles balistiques sont tombés sur Kyiv, puis 4 personnes sont mortes et 78 ont été blessées dans le pays le 23. Vladimir Poutine accepte « en principe » une rencontre trilatérale après le 10 novembre (Ouchakov, 21 oct.), sans lieu, sans accord de Kyiv et sans cessez-le-feu : l'indicateur de négociation reste à 4, stable.<\/p>\n<h3>Marchés<\/h3>\n<p>Le Brent a réglé à 116,72 $ le 23 octobre (+3,1 %, plus haut règlement depuis le 29 avril, troisième hausse hebdomadaire), le WTI à 103,27 $ (CNBC). Le VIX clôture à 19,45 (16,68 le 21 oct.). Le rendement du Treasury à 10 ans revient à environ 5,00 % (5,13 % le 21 oct.), tandis que l'or cède environ 4 % sur la semaine, à ≈ 3 996 $ l'once, son plus bas depuis la mi-juillet. Pour la Fed, le statu quo du 28 octobre est donné à 83-92 % selon les sources et une hausse en décembre à environ 78 %. Le Baltic Dry Index était à 2 680 le 21 octobre (pas de valeur trouvée pour les 22-23). Aucun chiffre FRED n'a pu être lu : toutes les valeurs viennent de la presse financière, d'où un rang de source « presse ».<\/p>\n<h3>Autres domaines<\/h3>\n<p>Mer Rouge, Baltique, mer Noire, mer de Chine méridionale, espaces aériens, violations de l'OTAN, nucléaire, alliances, hybride, Taïwan, Corée, Inde–Pakistan, Sahel et Soudan : aucun fait daté du 24-25 octobre n'a été trouvé ; les indicateurs sont reportés du 23 octobre sans changement. Domaines (stabilité) : maritime 4,53, hybride 4,38, aérien 4,43, nucléaire 4,32, géopolitique 3,99, financier 3,66, alliances 3,64, diplomatie 3,31.<\/p>\n<h2>France<\/h2>\n<h3>Composante intérieure (1,82)<\/h3>\n<p>La journée de mobilisation du 24 octobre a réuni 410 000 manifestants selon le gouvernement et 800 000 selon la CGT (550 000 le 17), avec près de 1 000 interpellations à 19 h 30 selon Laurent Nuñez et moins de casse que le 17 (France 24, franceinfo). La grève du 5 novembre est maintenue et Solidaires appelle à agir le 31 octobre. Au Parlement, l'examen des recettes du PLF 2027 reprend le 27 octobre, le vote des recettes est fixé au 3 novembre et celui de l'ensemble au 17 novembre ; aucune motion de censure n'a été trouvée et des ordonnances budgétaires ne seraient possibles qu'à partir du 18 décembre. Un sondage Ifop-Fiducial (17-19 oct.) place Marine Le Pen à 36-38 % au premier tour de la présidentielle.<\/p>\n<h3>Marchés et notation<\/h3>\n<p>Le spread OAT-Bund a clôturé autour de 173 pb le 22 octobre, plus haut depuis novembre 2011, et 171,8 pb le 23 (OAT 5,05 %, Bund 3,33 %) ; l'OAT a touché 5,14 % en séance le 22, plus haut depuis 2002. Les sources divergent (167,8 à 178 pb). Moody's a maintenu Aa3 perspective négative le 23, sans action, en supposant l'adoption d'un budget 2027 réduisant le déficit (Bloomberg, CNBC). Fitch et S&P : rien de nouveau ; la revue de S&P est attendue le 27 novembre.<\/p>\n<h3>Extérieur (2,52)<\/h3>\n<p>Emmanuel Macron a affirmé le 21 octobre que du personnel et des capacités français sont déployés à Yanbu « depuis huit jours » (vers le 13 oct.), lors de sa visite à Riyad ; les effectifs ne sont pas publiés (Al-Monitor). Avec les tirs houthis du 24 sur Yanbu, l'exposition des forces françaises reste à 4. Le sous-niveau extérieur franchit 2,5 et s'affiche au niveau 3 : c'est un effet d'arrondi, pas un nouveau seuil de risque.<\/p>\n<h3>Alertes officielles (2,38) et postures<\/h3>\n<p>Vigipirate : « vigilance renforcée » depuis le 22 juin, aucun changement ni posture hiver 2026-2027 annoncés (page SGDSN non lue). État d'urgence : non déclaré (Macron, 21 oct. : il « ne se justifie pas »). CERT-FR : quatre alertes ouvertes, pas de nouvelle alerte repérée ; ASNR : dernier avis, EPR de Flamanville, niveau 1 (22 oct.). Santé publique France (bulletin du 21 oct., données au 19) : 27 épisodes autochtones d'arboviroses, chikungunya 183 cas en 22 épisodes (162 au 12 oct.), dengue 7 cas en 5 épisodes, West Nile 195 cas (+17) ; l'indicateur reste à 3, en hausse. Vigilance météo du 24-25 octobre et bilan de la tempête Austen : non trouvés. Notations : voir ci-dessus.<\/p>\n<h2>Socle structurel<\/h2>\n<p><strong>Monde.<\/strong> L'Ecological Threat Report 2026 de l'IEP serait paru vers le 21 octobre (27 pays « hotspots », environ 768 millions de personnes exposées) d'après un seul article (Oman Observer) non confirmé sur le site de l'IEP : l'entrée « Global Peace Index » est annotée mais sa sévérité (4) et sa date de donnée (juin 2026) ne changent pas. Strategic Survey de l'IISS (T4 ?) toujours non confirmé ; CrisisWatch d'octobre attendu vers le 30 oct.-1er nov. Aucune autre édition annuelle n'est attendue avant décembre (ACLED).<\/p>\n<p><strong>France.<\/strong> Fractures françaises (Ipsos) 2026, attendue en octobre-novembre, n'était pas parue au 25 octobre ; aucune nouvelle vague CEVIPOF (prochaine : février 2027) ; Banque de France ERS attendue en décembre ; demandeurs d'emploi du T3 non publiés.<\/p>\n<h2>Publications de la semaine (niveaux A et C)<\/h2>\n<p>Faute d'accès direct aux pages « publications » des instituts, aucun balayage exhaustif n'a été possible ce jour. Seules mentions trouvées : l'Ecological Threat Report 2026 de l'IEP (non confirmé) ; la Première Commission de l'ONU siège jusqu'au 6 novembre et l'Union européenne y a demandé le 7 octobre un nouveau cadre après New START ; Santé publique France, bulletin arboviroses du 21 octobre. Le balayage complet des niveaux A et C est reporté au prochain relevé.<\/p>\n<p><em>Bilan des sources :<\/em> monde 4 répondues, 23 sans nouveauté, 44 injoignables, 13 non sollicitées (niveau D surtout) ; France 7 répondues, 16 sans nouveauté, 33 injoignables, 5 non sollicitées.<\/p>";

function deltaTxt(cur,old){if(old==null)return '';const d=Math.round((cur-old)*100)/100;const c=d<0?'worse':d>0?'better':'flat';return `<span class="delta ${c}" title="Depuis le relevé du ${fdate(prev&&prev.date)}">${d<0?'▼':d>0?'▲':'='} ${d<0?'−':d>0?'+':''}${fr(Math.abs(d))}</span>`;}
function scale(cont,n){const pos=Math.max(0,Math.min(100,(cont-0.5)/5*100));return `<div class="sc" role="img" aria-label="Niveau ${n} sur 5, valeur ${fr(cont)}">${[1,2,3,4,5].map(k=>`<span class="${k===n?'on':''}"></span>`).join('')}<b class="mk" style="left:${pos}%"></b></div>`;}
function spark(key){const pts=H.filter(h=>h[key]!=null);if(pts.length<2)return '';const v=pts.map(h=>h[key]),mn=Math.min(...v)-0.15,mx=Math.max(...v)+0.15,X=i=>3+294*i/(v.length-1),Y=x=>33-28*(x-mn)/(mx-mn);const d=v.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(x).toFixed(1)).join('');return `<svg class="spark" viewBox="0 0 300 36" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L297,36 L3,36Z" fill="var(--c)" opacity=".1"/><path d="${d}" fill="none" stroke="var(--c)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;}
function tile(o){return `<a class="tile" href="#${o.href}" style="--c:${lvlVar(o.n)}"><span class="d" aria-hidden="true">${o.n}</span><span class="n">${esc(o.name)}</span><span class="l">Niveau ${o.n} · ${esc(o.lib)}</span><span class="v"><span class="num">${fr(o.cont)}</span>${deltaTxt(o.cont,o.prev)}</span>${scale(o.cont,o.n)}<span class="ax"><span>1 critique</span><span>5 calme</span></span>${o.sk?spark(o.sk):''}${o.why?`<span class="why">${o.why}</span>`:''}</a>`;}

function lineChart(el,series,opts={}){
  const pts=H.filter(h=>series.every(s=>h[s.k]!=null));
  if(pts.length<2){el.innerHTML='<p class="small">La trajectoire apparaîtra à partir de deux relevés.</p>';return;}
  const draw=()=>{
    if(!el.isConnected)return;
    const W=Math.max(280,el.clientWidth||600),Hh=opts.h||220,pad={l:30,r:Math.min(118,W*.3),t:12,b:24};
    const vals=pts.flatMap(h=>series.map(s=>h[s.k]));
    const ymin=Math.min(1.5,Math.floor((Math.min(...vals)-.1)*4)/4),ymax=Math.max(2.75,Math.ceil((Math.max(...vals)+.1)*4)/4);
    const x=i=>pad.l+(W-pad.l-pad.r)*i/(pts.length-1),y=v=>pad.t+(Hh-pad.t-pad.b)*(1-(v-ymin)/(ymax-ymin));
    let g='';
    for(let v=Math.ceil(ymin*2)/2;v<=ymax+1e-9;v+=.5){const th=Math.abs((v%1)-.5)<1e-9;g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule${th?'-2':''})" ${th?'stroke-dasharray="4 4"':''}/><text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end">${fr(v,1)}</text>`;if(th&&v>ymin+.1&&v<ymax-.05)g+=`<text x="${pad.l+4}" y="${y(v)-4}" style="font-size:9.5px">seuil niveau ${Math.floor(v)} | ${Math.ceil(v)}</text>`;}
    const sp=(W-pad.l-pad.r)/(pts.length-1),short=sp<62,step=Math.max(1,Math.ceil((short?34:62)/sp));const lab=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d);return short&&m?`${+m[3]}/${+m[2]}`:fdate(d,false);};pts.forEach((h,i)=>{if((pts.length-1-i)%step===0)g+=`<text x="${x(i)}" y="${Hh-6}" text-anchor="middle">${lab(h.date)}</text>`;});
    series.forEach(s=>{const d=pts.map((h,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(h[s.k]).toFixed(1)}`).join('');g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`;pts.forEach((h,i)=>{g+=`<circle cx="${x(i)}" cy="${y(h[s.k])}" r="${i===pts.length-1?4.5:3}" fill="${s.c}" stroke="var(--sheet)" stroke-width="2"/>`;});});
    const ends=series.map(s=>({s,yy:y(pts[pts.length-1][s.k])})).sort((a,b)=>a.yy-b.yy);for(let i=1;i<ends.length;i++)if(ends[i].yy-ends[i-1].yy<14)ends[i].yy=ends[i-1].yy+14;
    ends.forEach(e=>{g+=`<text class="lab" x="${x(pts.length-1)+9}" y="${e.yy+4}">${esc(e.s.short||e.s.l)} <tspan style="font-family:var(--mono);font-weight:400">${fr(pts[pts.length-1][e.s.k])}</tspan></text>`;});
    g+=`<line class="xh" y1="${pad.t}" y2="${Hh-pad.b}" stroke="var(--ink-2)" visibility="hidden"/><rect class="hit" x="${pad.l-8}" y="0" width="${W-pad.l-pad.r+16}" height="${Hh}" fill="transparent"/>`;
    el.innerHTML=`<div class="legend">${series.map(s=>`<span><i style="--c:${s.c}"></i>${esc(s.l)}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" role="img" aria-label="${esc(opts.aria||'Trajectoire')}">${g}</svg><div class="tip" hidden></div>`;
    const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=svg.querySelector('.xh');
    const move=ev=>{const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*(W/r.width);let i=Math.round((px-pad.l)/((W-pad.l-pad.r)/(pts.length-1)));i=Math.max(0,Math.min(pts.length-1,i));const h=pts[i];xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('visibility','visible');
      tip.innerHTML=`<div class="d">${fdate(h.date)}${h.modele&&h.modele!=='v3'?' · modèle '+esc(h.modele):''}</div>${series.map(s=>`<div class="r"><span><i style="--c:${s.c}"></i>${esc(s.l)}</span><b class="num">${fr(h[s.k])}</b></div>`).join('')}`;tip.hidden=false;const left=x(i)*(r.width/W);tip.style.left=Math.min(r.width-tip.offsetWidth,Math.max(0,left+12))+'px';tip.style.top=(r.top-el.getBoundingClientRect().top+6)+'px';};
    const hit=svg.querySelector('.hit');hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);hit.addEventListener('pointerleave',()=>{tip.hidden=true;xh.setAttribute('visibility','hidden');});
  };
  draw();el._redraw=draw;
}

const GEO={ukraine:[33,48.8],iran_guerre:[54.5,31.5],nucleaire_iranien:[51.5,34.2],israel_liban:[35.6,33.4],yemen_arabie:[45,19.5],taiwan:[121.3,23.8],coree:[127.5,38.6],inde_pakistan:[74,32.5],soudan:[30,13.5],sahel:[-1.5,16],rdc:[28.7,-2],hormuz:[56.6,26.3],mer_rouge:[41.5,15.3],baltique:[19.5,57.5],mer_noire:[33,43.3],mer_chine_sud:[115,12.5],porte_avions_us:[62,17],violations_otan:[24.5,52.5],espace_aerien_golfe:[48.5,28.6],sabotage_hybride:[12,50.5],gnss_cables:[58.5,24],posture_russe:[37.6,55.8]};
const MV={top:-2,h:455.3,W:1000};
const EE=(lon,lat)=>{const A1=1.340264,A2=-0.081106,A3=0.000893,A4=0.003796,M=Math.sqrt(3)/2,l=lon*Math.PI/180,th=Math.asin(M*Math.sin(lat*Math.PI/180)),t2=th*th,t6=t2*t2*t2;return [2*Math.sqrt(3)*l*Math.cos(th)/(3*(9*A4*t6*t2+7*A3*t6+3*A2*t2+A1)),th*(A1+A2*t2+t6*(A3+A4*t2))];};
const EX0=EE(180,0)[0],EY0=EE(0,90)[1];
const PJ=(lon,lat)=>{const [x,y]=EE(lon,lat),s=MV.W/(2*EX0);return [(x+EX0)*s,(EY0-y)*s];};
const MDOM={'':'Tous',geopolitique:'Conflits',maritime:'Maritime',aerien:'Aérien',hybride:'Hybride',nucleaire:'Nucléaire'};
function spotsAll(){return D.indicateurs.map(x=>{const g=x.geo||GEO[x.id];if(!g)return null;const [px,py]=PJ(g[0],g[1]);return {x,px,py};}).filter(Boolean);}
const tendCol=t=>t==='hausse'?'var(--sev5)':t==='baisse'?'var(--sev1)':'var(--muted)';
function mapSVG(o={}){
  const all=spotsAll(),dom=o.dom||'',lens=o.lens||'sev';
  let vb=`0 ${MV.top} ${MV.W} ${MV.h-MV.top}`,list=all;
  if(!o.focus&&innerWidth<=640){const [x1]=PJ(-22,20),[x2]=PJ(142,20),[,y1]=PJ(0,64),[,y2]=PJ(0,-14);vb=`${x1} ${y1} ${x2-x1} ${y2-y1}`;}
  if(o.focus){const s=all.find(z=>z.x.id===o.focus);if(!s)return '';const w=o.fw||170,h=w*.55;vb=`${s.px-w/2} ${s.py-h/2} ${w} ${h}`;list=[s];}
  let g=`<use href="#vsm-land" class="land"/>`;
  if(!o.focus){const [fx,fy]=PJ(2.4,46.6);g+=`<g class="frm"><title>France</title><a href="#france"><rect x="${fx-7}" y="${fy-7}" width="14" height="14"/><text x="${fx}" y="${fy+3}" text-anchor="middle">FR</text></a></g>`;}
  [...list].sort((a,b)=>a.x.severite-b.x.severite).forEach(s=>{const x=s.x,on=!dom||x.domaine===dom;
    const c=lens==='tend'?tendCol(x.tendance):lens==='nuc'?(x.puissance_nucleaire?'var(--navy-2)':'var(--muted)'):sevVar(x.severite);
    const r=o.focus?3.5+x.severite*.6:4+x.severite*1.5, dim=!on||(lens==='nuc'&&!x.puissance_nucleaire);
    g+=`<g class="spot${dim?' dim':''}" data-spot="${esc(x.id)}" tabindex="${o.focus||dim?-1:0}" role="button" aria-label="${esc(x.libelle)}, sévérité ${x.severite}"><title>${esc(x.libelle)} · ${x.severite}/5</title>`;
    if(x.tendance==='hausse'&&lens!=='nuc')g+=`<circle class="halo" cx="${s.px}" cy="${s.py}" r="${r+5.5}" stroke="${c}"/>`;
    g+=`<circle class="core" cx="${s.px}" cy="${s.py}" r="${r}" fill="${c}" fill-opacity=".88"/>`;
    if(o.sel===x.id&&!o.focus)g+=`<circle class="sel" cx="${s.px}" cy="${s.py}" r="${r+10}"/>`;
    g+=`</g>`;});
  const ss=all.find(z=>z.x.id===o.sel);
  if(ss&&!o.focus&&o.tag!==false){const right=ss.px<MV.W*.72,lx=ss.px+(right?18:-18),ly=ss.py-16;g+=`<line x1="${ss.px}" y1="${ss.py}" x2="${lx}" y2="${ly}" stroke="var(--ink)" stroke-width=".8"/><text class="tag" x="${lx+(right?4:-4)}" y="${ly+4}" text-anchor="${right?'start':'end'}">${esc(ss.x.libelle.replace(/\s*\(.*\)$/,''))}</text>`;}
  return `<svg viewBox="${vb}" role="img" aria-label="Carte des foyers de tension">${g}</svg>`;
}
function mapLegend(lens,hint=true){
  const items=lens==='tend'?[['var(--sev5)','en aggravation'],['var(--muted)','stable'],['var(--sev1)','en apaisement']]:lens==='nuc'?[['var(--navy-2)','implique une puissance nucléaire'],['var(--muted)','autres foyers']]:[['var(--sev5)','5 critique'],['var(--sev4)','4'],['var(--sev3)','3'],['var(--sev2)','2']];
  return `<div class="mlegend">${items.map(([c,l])=>`<span><i style="--c:${c}"></i>${l}</span>`).join('')}${lens!=='nuc'&&lens!=='tend'?'<span><i class="ring" style="--c:var(--sev5)"></i>en aggravation</span>':''}<span><i class="sq"></i>France</span>${hint?'<span class="hint">Touchez un foyer pour le détail</span>':''}</div>`;
}

   <div class="row"><span class="sevb" style="--c:${sevVar(x.severite)}">${x.severite}</span><span class="chip ${t.c}">${t.t}</span>${x.puissance_nucleaire?`<span class="chip nuc">${NUC}puissances nucléaires ×1,5</span>`:''}</div>
   <div class="v">${esc(x.valeur)}</div><p>${esc(first)}</p>
   <a class="go" href="#monde-${esc(x.domaine)}" data-focus="f-${esc(x.id)}">Ouvrir la fiche →</a>
   <div class="nav"><button type="button" data-mnav="-1">‹ ${esc((ALL.get(ids[(i-1+ids.length)%ids.length])||{}).libelle||'')}</button><button type="button" data-mnav="1">${esc((ALL.get(ids[(i+1)%ids.length])||{}).libelle||'')} ›</button></div>`;
}
const MAPST={dom:'',lens:'sev',sel:null};
function mapIds(){return spotsAll().filter(s=>!MAPST.dom||s.x.domaine===MAPST.dom).sort((a,b)=>b.x.severite_ajustee-a.x.severite_ajustee).map(s=>s.x.id);}
function mountMap(root){

  let rzm;window.addEventListener('resize',()=>{clearTimeout(rzm);rzm=setTimeout(()=>{if(root.isConnected)render();},200);});
  const render=()=>{const ids=mapIds();if(!ids.includes(MAPST.sel))MAPST.sel=ids[0];
    root.querySelector('.map').innerHTML=mapSVG({dom:MAPST.dom,lens:MAPST.lens,sel:MAPST.sel});
    root.querySelector('.mleg').innerHTML=mapLegend(MAPST.lens);
    root.querySelector('.mdet').innerHTML=mapDetail(MAPST.sel,ids);
    const l=root.querySelector('.mlist');if(l)l.innerHTML=ids.map(id=>{const x=ALL.get(id);return `<button type="button" class="it ${id===MAPST.sel?'on':''}" data-spot="${esc(id)}"><span class="sevb" style="--c:${sevVar(x.severite)}">${x.severite}</span><b>${esc(x.libelle)}</b><span class="tr" style="color:${tendCol(x.tendance)}">${x.tendance==='hausse'?'↑':x.tendance==='baisse'?'↓':'='}</span><small>${esc(String(x.valeur).split(' ; ')[0])}</small></button>`;}).join('');
    root.querySelectorAll('.chips button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.dom===MAPST.dom)));
    root.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lens===MAPST.lens)));};
  root.addEventListener('click',e=>{const s=e.target.closest('[data-spot]');if(s){MAPST.sel=s.dataset.spot;render();return;}
    const n=e.target.closest('[data-mnav]');if(n){const ids=mapIds(),i=ids.indexOf(MAPST.sel);MAPST.sel=ids[(i+(+n.dataset.mnav)+ids.length)%ids.length];render();return;}
    const c=e.target.closest('.chips button');if(c){MAPST.dom=c.dataset.dom;render();return;}
    const l=e.target.closest('.seg button');if(l){MAPST.lens=l.dataset.lens;render();}});
  root.addEventListener('keydown',e=>{const s=e.target.closest('.spot');if(s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();MAPST.sel=s.dataset.spot;render();root.querySelector(`.spot[data-spot="${MAPST.sel}"]`)?.focus();}});
  render();
}
const mapChips=()=>{const doms=new Set(spotsAll().map(s=>s.x.domaine));return `<div class="chips" role="group" aria-label="Domaine">${Object.entries(MDOM).filter(([k])=>!k||doms.has(k)).map(([k,l])=>`<button type="button" data-dom="${k}" aria-pressed="${k===MAPST.dom}">${l}</button>`).join('')}</div>`;};
const NUC='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><path d="M12 9.2 8.3 2.9A10 10 0 0 0 2 12h7.2a2.8 2.8 0 0 1 2.8-2.8zM14.8 12H22a10 10 0 0 0-6.3-9.1L12 9.2a2.8 2.8 0 0 1 2.8 2.8zM13.4 14.4l3.6 6.3a10 10 0 0 1-10 0l3.6-6.3a2.8 2.8 0 0 0 2.8 0z"/></svg>';
const ICON={monde:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 maritime:'<path d="M12 7v13M8 10h8M5 14a7 7 0 0 0 14 0"/><circle cx="12" cy="5" r="2"/>',
 aerien:'<path d="M2 14l9-2V5a1.5 1.5 0 0 1 3 0v7l8 2v2l-8-1v4l2 1.5V21l-3.5-1L9 21v-1.5l2-1.5v-4l-9 1z"/>',
 hybride:'<rect x="4" y="4" width="16" height="12" rx="1"/><path d="M8 20h8M12 16v4M8.5 10l2 2 4-4"/>',
 nucleaire:'<circle cx="12" cy="12" r="2"/><path d="M12 10 8.5 4a8 8 0 0 0-4.5 8h6M14 12h6a8 8 0 0 0-4.5-8L12 10M11 13.7 7.5 19.5a8 8 0 0 0 9 0L13 13.7"/>',
 geopolitique:'<path d="M4 21V9l8-5 8 5v12M3 21h18M9 21v-6h6v6"/>',
 financier:'<path d="M3 20h18M6 17v-5M11 17V8M16 17v-7M20 5l-6 4-4-3-6 4"/>',
 alliances:'<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/>',
 diplomatie:'<path d="M4 8h9M11 16h9M4 8l3-3M4 8l3 3M20 16l-3-3M20 16l-3 3"/>',
 socle:'<path d="M12 3 3 8l9 5 9-5zM3 13l9 5 9-5M3 17l9 5 9-5"/>',
 carte:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/>'};
const picto=k=>ICON[k]?`<span class="picto" aria-hidden="true"><svg viewBox="0 0 24 24">${ICON[k]}</svg></span>`:'';
const iconOf=id=>id==='monde'?'monde':id==='monde-socle'?'socle':id.startsWith('monde-')?id.slice(6):'';

const heat=(groups)=>`<div class="heat">${groups.map(g=>`<div class="r"><a href="#${g.href}">${esc(g.l)}</a><div class="cells">${g.items.map(x=>`<a class="cell" style="--c:${sevVar(x.severite)}" href="#${g.href}" data-focus="f-${esc(x.id)}" title="${esc(x.libelle)} : sévérité ${x.severite}, ${esc((TEND[x.tendance]||{}).t||'')}">${x.severite}${x.tendance==='hausse'?'<sup>↑</sup>':x.tendance==='baisse'?'<sup>↓</sup>':''}</a>`).join('')}</div></div>`).join('')}</div><div class="keys">${[1,2,3,4,5].map(s=>`<span><i style="--c:${sevVar(s)}"></i>${s}${s===1?' calme':s===5?' critique':''}</span>`).join('')}<span>↑ aggravation · ↓ apaisement</span></div>`;

function fiche(x){
  const t=TEND[x.tendance]||TEND.stable;
  const tag=x.puissance_nucleaire?'<span class="chip nuc" title="Implique une puissance nucléaire : coefficient ×1,5 sur l’indice guerre"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><path d="M12 9.2 8.3 2.9A10 10 0 0 0 2 12h7.2a2.8 2.8 0 0 1 2.8-2.8zM14.8 12H22a10 10 0 0 0-6.3-9.1L12 9.2a2.8 2.8 0 0 1 2.8 2.8zM13.4 14.4l3.6 6.3a10 10 0 0 1-10 0l3.6-6.3a2.8 2.8 0 0 0 2.8 0z"/></svg>puissances nucléaires ×1,5</span>':x.systemique?'<span class="chip nuc" title="Indicateur systémique : coefficient ×1,5"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V3h2v1.5c3-1.5 5 1.5 8 0s4-1 4-1v9s-1-.5-4 1-5-1.5-8 0V21z"/></svg>systémique ×1,5</span>':'';
  const src=x.sources||[];
  return `<article class="fiche" id="f-${esc(x.id)}" style="--c:${sevVar(x.severite)}"><div class="main">
   <div class="t"><span class="sevb" aria-label="Sévérité ${x.severite} sur 5">${x.severite}</span><h2>${esc(x.libelle)}</h2><span class="chip ${t.c}">${t.t}</span>${tag}</div>
   <div class="v">${esc(x.valeur)}</div><p>${esc(x.justification)}</p>
   ${src.length?`<details><summary>Sources (${src.length})</summary><ul class="srcs">${src.map(s=>`<li><span class="d">${s.date?fdate(s.date):''}</span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.titre)}</a></li>`).join('')}</ul></details>`:''}
  </div><dl class="meta">${(x.geo||GEO[x.id])?`<div class="loc map">${mapSVG({focus:x.id,fw:150})}</div>`:''}<div><dt>Donnée</dt><dd>${fdate(x.date_donnee)}</dd></div><div><dt>Cotation</dt><dd>${RANG[x.rang_source]||esc(x.rang_source)}</dd></div><div><dt>Qualité</dt><dd>${QUAL[x.qualite]||esc(x.qualite)}</dd></div><div><dt>Sévérité ajustée</dt><dd class="num">${fr(x.severite_ajustee)}</dd></div></dl></article>`;
}
function fichesBlock(items){
  const id='fl'+Math.random().toString(36).slice(2,7);
  return `<div class="sortbar" data-list="${id}"><span>Trier :</span><button type="button" data-s="sev" aria-pressed="true">par sévérité</button><button type="button" data-s="date" aria-pressed="false">par date de donnée</button><button type="button" data-s="up" aria-pressed="false">aggravations d’abord</button></div><div class="fiches" id="${id}">${sortItems(items,'sev').map(fiche).join('')}</div>`;
}
function sortItems(items,how){const a=[...items];if(how==='date')a.sort((x,y)=>(y.date_donnee||'').localeCompare(x.date_donnee||''));else if(how==='up'){const r={hausse:0,stable:1,baisse:2};a.sort((x,y)=>r[x.tendance]-r[y.tendance]||y.severite_ajustee-x.severite_ajustee);}else a.sort((x,y)=>y.severite_ajustee-x.severite_ajustee);return a;}
document.addEventListener('click',e=>{const b=e.target.closest('.sortbar button');if(!b)return;const bar=b.parentElement,list=document.getElementById(bar.dataset.list);bar.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const items=[...list.children].map(el=>ALL.get(el.id.slice(2)));list.innerHTML=sortItems(items,b.dataset.s).map(fiche).join('');});
const ALL=new Map([...D.indicateurs,...F.indicateurs].map(x=>[x.id,x]));

function sideNav(sec,cur){return `<nav class="side" aria-label="${esc(sec.t)}"><h4>${esc(sec.t)}</h4><div class="links">${sec.kids.map(k=>`${k.sep?'<hr>':''}<a href="#${k.id}" class="${k.id===cur?'on':''}${iconOf(k.id)?' ic':''}" ${k.id===cur?'aria-current="page"':''} ${k.v!=null?`style="--c:${sevVar(k.v)}"`:''}>${picto(iconOf(k.id))}<span>${esc(k.t)}</span>${k.v!=null?`<span class="num">${fr(k.v)}</span><i><b style="width:${(k.v-1)/4*100}%"></b></i>`:''}</a>`).join('')}</div></nav>`;}
const crumbs=(arr)=>`<div class="crumbs">${arr.map((c,i)=>i<arr.length-1?`<a href="#${c[1]}">${esc(c[0])}</a> / `:esc(c[0])).join('')}</div>`;
const card=(h,body,extra='')=>`<section class="card" ${extra}><h4>${h}</h4>${body}</section>`;
const postures=()=>{const p=N.postures&&N.postures.length?N.postures:F.echelles.slice(0,5).map(e=>({nom:e.nom,etat:String(e.niveau_actuel||'').split(/[;(]/)[0],sev:3}));return p.map(o=>`<div class="post"><span>${esc(o.nom)}</span><span class="pill" style="--c:${sevVar(o.sev||3)}">${esc(o.etat)}</span></div>`).join('')+`<p class="small" style="margin:10px 0 0"><a href="#france-postures">Toutes les postures officielles →</a></p>`;};
const watch=()=>{const e=(N.echeances||[]).filter(o=>!o.date||o.date>=dateRel);return e.length?`<ul class="watch">${e.map(o=>`<li><span class="dt">${fdate(o.date,false)}</span><span>${esc(o.texte)}</span></li>`).join('')}</ul>`:'<p class="small">Aucune échéance renseignée.</p>';};

const P={};
P.synthese=()=>{
  const st=S.stabilite,gu=S.guerre;
  const pts=(N.points_cles||[]).map((o,i)=>`<div class="pt" style="--c:${sevVar(o.sev||4)}"><span class="n">§${i+1}</span><div>${o.chiffre?`<span class="fig">${esc(o.chiffre)}</span>`:''}<h3>${esc(o.titre)}</h3><p>${esc(o.texte)}</p></div></div>`).join('');
  const lv=(href,lab,n,cont,pv)=>`<a href="#${href}" style="--c:${lvlVar(n)}"><b>${n}</b><span>${lab}</span>${deltaTxt(cont,pv)}</a>`;

   ${tile({href:'monde',name:'Risque de guerre mondiale',n:gu.niveau,lib:gu.libelle||LG[gu.niveau],cont:gu.niveau_continu,prev:prev&&prev.guerre_continu,sk:'guerre_continu',why:gu.niveau!==gu.niveau_calcule_brut?`Calculé ${gu.niveau_calcule_brut}, maintenu à ${gu.niveau} par la règle de palier`:'Aucun palier appliqué'})}
   ${tile({href:'france',name:'France',n:F.niveau,lib:F.libelle||LF[F.niveau],cont:F.niveau_continu,prev:prev&&prev.france_continu,sk:'france_continu',why:`Intérieur ${fr(F.composantes.interieur.niveau_continu)} · extérieur ${fr(F.composantes.exterieur.niveau_continu)} · alertes ${fr(F.composantes.alertes.niveau_continu)}`})}
  </div>
  <section class="sheet mapcard" id="homemap"><div class="m"><div class="maphead"><h2>Carte de situation</h2>${mapChips()}</div><div class="map"></div><div class="mleg"></div></div><aside class="mdet" aria-live="polite"></aside></section>
  <div class="l-rail">
   <article class="sheet doc dossier">
    <div class="kick"><span>Bulletin n° ${nRel} · Synthèse</span><span>${fdate(dateRel,true,true)}</span></div>
    <h1>${esc(N.titre||'Synthèse du relevé')}</h1>
    ${N.chapeau?`<p class="chapeau dropcap">${esc(N.chapeau)}</p>`:''}
    <div class="lv3">${lv('monde','Stabilité',st.niveau,st.niveau_continu,prev&&prev.stabilite_continu)}${lv('monde','Guerre',gu.niveau,gu.niveau_continu,prev&&prev.guerre_continu)}${lv('france','France',F.niveau,F.niveau_continu,prev&&prev.france_continu)}</div>
    ${pts?`<div class="sh">Points clés</div><div class="pts">${pts}</div>`:''}
    ${ex}
    ${(N.appreciation||[]).length?`<div class="sh">Appréciation<a href="#note">Note complète →</a></div>${N.appreciation.map(p=>`<p class="para">${esc(p)}</p>`).join('')}`:''}
    <div class="sh">Pour aller plus loin</div>
    <p class="small" style="margin:0">Le détail par domaine est dans <a href="#monde">Monde</a>, les composantes et postures dans <a href="#france">France</a>, ce qui ferait changer de niveau dans <a href="#signaux">Signaux</a>.</p>
   </article>
   <aside class="stack">
    ${card(`<span>Trajectoire</span><span>${nRel} relevés</span>`,'<div class="chart" id="ch-main"></div>')}

};

P.carte=()=>{
  const all=spotsAll(),n5=all.filter(s=>s.x.severite>=5),nuc5=n5.filter(s=>s.x.puissance_nucleaire).length,up=all.filter(s=>s.x.tendance==='hausse').length,down=all.filter(s=>s.x.tendance==='baisse').length;

   <section class="sheet" id="fullmap" style="margin-top:16px">

   </section>

};

P.monde=()=>{
  const st=S.stabilite,gu=S.guerre,sec=sectionOf('monde');
  const nh=D.indicateurs.filter(x=>x.tendance==='hausse').length,nb=D.indicateurs.filter(x=>x.tendance==='baisse').length;
  return `<div class="l-side">${sideNav(sec,'monde')}<div>
   ${crumbs([['Synthèse','synthese'],['Monde','monde']])}
   <section class="sheet pagehead"><div><div class="lbl">Vue d’ensemble · ${D.indicateurs.length} indicateurs, 8 domaines</div><h1>Monde</h1><p>${esc(N.lecture_monde||'')}</p></div>
    <div class="kpis"><div class="kpi"><div class="v" style="color:${lvlVar(st.niveau)}">${st.niveau} · ${fr(st.niveau_continu)}</div><div class="k">stabilité</div></div><div class="kpi"><div class="v" style="color:${lvlVar(gu.niveau)}">${gu.niveau} · ${fr(gu.niveau_continu)}</div><div class="k">guerre (calculé ${gu.niveau_calcule_brut})</div></div><div class="kpi"><div class="v">${D.stats.n5}</div><div class="k">indicateurs à 5/5</div></div><div class="kpi"><div class="v">${nh} ↑ · ${nb} ↓</div><div class="k">tendances</div></div></div></section>
   <div class="g2" style="margin-top:16px">
    ${card('<span>Sévérité par domaine</span><span>stabilité / guerre</span>',`<div class="dbars">${domOrder.map(k=>{const v=st.domaines[k],w=gu.domaines[k];return `<span><a href="#monde-${k}">${esc(DOM[k])}</a><small>poids ${Math.round(st.poids[k]*100)} % / ${Math.round(gu.poids[k]*100)} %</small></span><span class="tk" style="--c:${sevVar(v)}"><b style="width:${(v-1)/4*100}%"></b><em style="left:calc(${(w-1)/4*100}% - 1px)"></em></span><span class="dv">${fr(v)} <small>/ ${fr(w)}</small></span>`;}).join('')}<span class="ax5"><span>1 calme</span><span>3</span><span>5 critique</span></span></div><p class="small" style="margin:12px 0 0">Barre : score pour la stabilité. Trait : score pour l’indice guerre, où les sujets impliquant une puissance nucléaire pèsent 1,5 fois plus.</p>`)}
    ${card('<span>Carte des tensions</span><span>1 case = 1 indicateur</span>',heat(domOrder.map(k=>({l:DOM[k],href:'monde-'+k,items:D.indicateurs.filter(x=>x.domaine===k).sort((a,b)=>b.severite_ajustee-a.severite_ajustee)}))))}
   </div>
   ${card('<span>Trajectoire des indices mondiaux</span>','<div class="chart" id="ch-monde"></div>','style="margin-top:16px"')}
   <p class="note">${esc(N.palier_guerre||'')}</p>
  </div></div>`;
};
P.monde.after=()=>lineChart($('#ch-monde'),[{k:'stabilite_continu',l:'Stabilité',c:'var(--s1)'},{k:'guerre_continu',l:'Guerre',c:'var(--s2)'}],{aria:'Trajectoire des indices mondiaux',h:220});
function pageDomaine(k){
  const st=S.stabilite,gu=S.guerre,items=D.indicateurs.filter(x=>x.domaine===k);
  const nh=items.filter(x=>x.tendance==='hausse').length,nb=items.filter(x=>x.tendance==='baisse').length;
  const rank=domOrder.indexOf(k)+1;
  return `<div class="l-side">${sideNav(sectionOf('monde'),'monde-'+k)}<div>
   ${crumbs([['Synthèse','synthese'],['Monde','monde'],[DOM[k],'monde-'+k]])}
   <section class="sheet pagehead"><div class="phi">${picto(k)}<div><div class="lbl">Domaine · ${items.length} indicateurs · ${rank}${rank===1?'er':'e'} sur 8 par sévérité</div><h1>${esc(DOM[k])}</h1><p>${esc(DOM_TXT[k])}</p></div></div>
    <div class="kpis"><div class="kpi"><div class="v" style="color:${sevVar(st.domaines[k])}">${fr(st.domaines[k])}</div><div class="k">score stabilité</div></div><div class="kpi"><div class="v" style="color:${sevVar(gu.domaines[k])}">${fr(gu.domaines[k])}</div><div class="k">score guerre</div></div><div class="kpi"><div class="v">${Math.round(st.poids[k]*100)} % · ${Math.round(gu.poids[k]*100)} %</div><div class="k">poids stab. · guerre</div></div><div class="kpi"><div class="v">${nh} ↑ · ${nb} ↓</div><div class="k">tendances</div></div></div></section>
   ${fichesBlock(items)}</div></div>`;
}
function pageSocle(scope){
  const isM=scope==='monde',rows=isM?D.structurels:F.structurels;
  return `<div class="l-side">${sideNav(sectionOf(scope),scope+'-socle')}<div>
   ${crumbs([['Synthèse','synthese'],[isM?'Monde':'France',scope],['Socle structurel',scope+'-socle']])}

P['france-postures']=()=>{

  return `<div class="l-side">${sideNav(sectionOf('france'),'france-postures')}<div>

};

  const head=(t,p)=>`<div class="l-side">${sideNav(sectionOf('france'),'france-carburant')}<div>${crumbs([['Synthèse','synthese'],['France','france'],['Carburant','france-carburant']])}${t}${p||''}</div></div>`;
  if(!CB||!CB.national)return head(`<section class="sheet pagehead"><div><div class="lbl">Approvisionnement et prix</div><h1>Carburant</h1><p>Le suivi automatique des prix et des ruptures (flux officiel prix-carburants.gouv.fr, relevé toutes les 3 heures) n’a pas encore produit de données. La rubrique se remplira au premier relevé.</p></div></section>`);
  const ix=CB.indice||{},nat=CB.national,fuels=['Gazole','E10','SP98','SP95','E85','GPLc'].filter(c=>nat[c]);
  if(!nat[cbFuel])cbFuel=fuels[0];
  const vals={};for(const d in CB.deps){const x=CB.deps[d][cbFuel];vals[d]=x&&x[2]>=5?x[1]:null;}
  const top=Object.entries(CB.deps).map(([d,x])=>[d,x[cbFuel]]).filter(([,x])=>x&&x[2]>=10&&x[1]>0).sort((a,b)=>b[1][1]-a[1][1]||b[1][0]-a[1][0]).slice(0,8);
  const dsel=cbDep&&CB.deps[cbDep]?cbDep:null;
  const detail=dsel?`<div class="cbdet"><div class="lbl">${esc(FRM.rn[FRM.r[dsel]]||'')}</div><b>${esc(FRM.n[dsel])} (${dsel})</b><table class="t"><thead><tr><th>Carburant</th><th>Prix</th><th>Ruptures</th></tr></thead><tbody>${fuels.map(c=>{const x=CB.deps[dsel][c];return x?`<tr><td>${CBN[c]}</td><td class="num">${eur(x[0])} €</td><td class="num" style="color:${x[1]>=2?rCol(x[1]):'inherit'}">${pct(x[1])} <span class="small">/ ${x[2]}</span></td></tr>`:'';}).join('')}</tbody></table><button type="button" class="lnk" data-cbdep="">Fermer</button></div>`:'';
  const titre=CBX.titre||`Carburant : niveau ${ix.niveau} · ${ix.libelle||CBL[ix.niveau]||''}`;
  const chap=CBX.chapeau||`${pct(nat.Gazole&&nat.Gazole.rupt)} des stations déclarent le gazole en rupture ; prix moyen ${eur(nat.Gazole&&nat.Gazole.prix)} €/L.`;
  const pj=CBX.projection||{},sc=pj.scenarios||[],am=CBX.amont||{};
  const jr=[...(CB.journal||[]).map(a=>({date:a.date,texte:a.titre,sev:a.sev})),...(CBX.journal||[]).map(a=>({date:a.date,texte:a.texte,sev:a.sev||2}))].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,10);
  return head(`
   <section class="sheet pagehead cbhead"><div><div class="lbl">Approvisionnement et prix · ${CB.n_stations} stations · ${cbLive?'données en direct':'données du relevé'} · ${hhmm(CB.maj)}</div><h1>${esc(titre)}</h1><p>${esc(chap)}</p></div>
    <div class="cbix" style="--c:${lvlVar(ix.niveau||3)}"><span class="d">${ix.niveau||'—'}</span><span class="n">Tension carburant</span><span class="l">${esc(ix.libelle||'')}</span><span class="v num">${fr(ix.continu)} · échelle 5 normal → 1 pénurie</span></div></section>
   <div class="cbfuels">${fuels.map(c=>{const n=nat[c],v=CB.var7&&CB.var7[c];return `<button type="button" class="cbf${c===cbFuel?' on':''}" data-cbfuel="${c}" style="--c:${n.rupt>=2?rCol(n.rupt):'var(--sev1)'}" aria-pressed="${c===cbFuel}"><span class="k">${CBN[c]}</span><span class="p num">${eur(n.prix)}<small>€/L</small></span><span class="dl num" style="color:${v>0?'var(--sev5)':v<0?'var(--sev1)':'var(--muted)'}">${v==null?'—':(v>0?'▲ +':v<0?'▼ ':'= ')+eur(Math.abs(v))+' sur 7 j'}</span>${cbSpark(c)}<span class="r">Ruptures<i><b style="width:${Math.min(100,n.rupt*10)}%"></b></i><span class="num">${pct(n.rupt)}</span></span></button>`;}).join('')}</div>
   <section class="card cbmap"><h4><span>Stations en rupture · ${esc(CBN[cbFuel])}</span><span>par département</span></h4>
    <div class="cbmapin"><div>${frMap(vals,dsel)}<div class="cbleg"><span><i style="background:var(--map-dot)"></i>&lt; 1 %</span><span><i style="background:var(--rule-2)"></i>1–2 %</span><span><i style="background:var(--sev3)"></i>2–4 %</span><span><i style="background:var(--sev4)"></i>4–8 %</span><span><i style="background:var(--sev5)"></i>≥ 8 %</span></div></div>
     <div>${detail||`<div class="lbl" style="margin-bottom:6px">Départements les plus touchés</div><div class="cbtop">${top.length?'':'<p class="small" style="margin:0">Aucune rupture déclarée pour ce carburant.</p>'}${top.map(([d,x])=>`<button type="button" data-cbdep="${d}" style="--c:${rCol(x[1])}"><b class="num">${d}</b><span>${esc(FRM.n[d])}</span><span class="num v">${pct(x[1])}</span></button>`).join('')}</div><p class="small">Part des stations déclarant le carburant en rupture temporaire. Touchez un département pour le détail.</p>`}</div></div></section>
   <div class="g2" style="margin-top:16px">
    ${card('<span>Prix à la pompe</span><span>90 jours</span>',cbPrix())}
    ${card('<span>Composantes de l’indice</span><span>sévérité 1 → 5</span>',`<div class="cbcomp">${(ix.composantes||[]).map(c=>`<div style="--c:${c.sev?sevVar(c.sev):'var(--rule-2)'}"><span class="t">${esc(c.t)} <span class="small">· ${Math.round(c.w*100)} %</span></span><span class="num s">${c.sev||'—'}</span><i><b style="width:${c.sev?(c.sev/5*100):0}%"></b></i><span class="small">${esc(c.val||'')}</span></div>`).join('')}</div>`)}
   </div>
   <section class="card cbproj" style="margin-top:16px"><h4><span>Projection à 4 semaines</span><span>${CBX.date?`relevé du ${fdate(CBX.date)}`:'appréciation de l’analyste'}</span></h4>
    ${sc.length?`${cbFan()}${pj.appreciation?`<blockquote class="cbq">${esc(pj.appreciation)}</blockquote>`:''}
     <div class="tw"><table class="t cbsc"><thead><tr><th>Scénario</th><th>Gazole</th><th>Hypothèses</th><th>Ruptures</th></tr></thead><tbody>${sc.map(s=>`<tr style="--c:${sevVar(s.sev||3)}"><td><span class="tag">${esc(s.nom)}${s.proba!=null?` · ${s.proba} %`:''}</span><br>${esc(s.titre||'')}</td><td class="num">${s.gazole?`${eur(s.gazole[0],2)}–${eur(s.gazole[1],2)} €`:'—'}</td><td>${esc(s.hypotheses||'')}</td><td class="num">${esc(s.ruptures||'—')}</td></tr>`).join('')}</tbody></table></div>
     ${(pj.declencheurs||[]).length?`<div class="cbtrig"><span class="lbl">Déclencheurs</span>${pj.declencheurs.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}`
    :`<p class="small" style="margin:0">La projection est rédigée à chaque relevé hebdomadaire, en croisant ces données avec l’actualité (Brent, Ormuz, raffineries, mouvements sociaux, stocks stratégiques).</p>`}</section>
   <div class="g2" style="margin-top:16px">
    ${card('<span>Approvisionnement amont</span><span>'+(am.sev?'sévérité '+am.sev+'/5':'relevé hebdo')+'</span>',(am.facteurs||[]).length?`<div class="cbdrv">${am.facteurs.map(f=>`<div><span>${esc(f.nom)}</span><span class="num">${esc(f.valeur||'')}</span><span style="color:${f.tendance==='hausse'?'var(--sev5)':f.tendance==='baisse'?'var(--sev1)':'var(--muted)'}">${f.tendance==='hausse'?'▲':f.tendance==='baisse'?'▼':'='} ${esc(f.texte||'')}</span></div>`).join('')}</div>`:`<p class="small" style="margin:0">${esc(am.texte||'Renseigné à chaque relevé hebdomadaire.')}</p>`)}
    ${card('<span>Journal</span><span>alertes et événements</span>',jr.length?`<div class="cbjr">${jr.map(j=>`<div style="--c:${sevVar(j.sev||2)}"><b class="num">${fdate(String(j.date).slice(0,10),false)}</b><span>${esc(j.texte)}</span></div>`).join('')}</div>`:'<p class="small" style="margin:0">Aucune alerte pour l’instant.</p>')}
   </div>
   <p class="note">Source : ${esc(CB.source||'prix-carburants.gouv.fr')} — ${CB.n_stations} stations de métropole et de Corse ; prix de plus de 8 jours exclus des moyennes ; données publiées ${hhmm(CB.donnees_maj)}. L’indice combine ruptures nationales (35 %), foyers locaux (20 %), dynamique des prix sur 30 jours (20 %) et approvisionnement amont apprécié au relevé (25 %) ; paliers : niveau 2 au plus si 5 % de ruptures ou 5 départements à 10 %, niveau 1 si 10 % de ruptures.</p>`);
};

P.note=()=>{
  const tmp=document.createElement('div');tmp.innerHTML=REPORT;
  let n=0;const toc=[];
  tmp.querySelectorAll('h2,h3').forEach(h=>{h.id='n'+(++n);toc.push(`<a href="#note" data-to="${h.id}" class="${h.tagName.toLowerCase()}">${esc(h.textContent)}</a>`);});
  tmp.querySelectorAll('h2').forEach(h=>{let w=0,el=h.nextElementSibling;while(el&&el.tagName!=='H2'){w+=(el.textContent||'').split(/\s+/).length;el=el.nextElementSibling;}const m=Math.max(1,Math.round(w/230));const d=document.createElement('div');d.className='rt';d.textContent=`${w} mots · lecture ${m} min`;h.after(d);});
  tmp.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
  return `<div class="l-side"><nav class="side toc" aria-label="Sommaire"><h4>Sommaire</h4><div>${toc.join('')}</div></nav><div>
   ${crumbs([['Synthèse','synthese'],['Note complète','note']])}
   <div class="notebar" id="notebar"><button type="button" aria-expanded="false" aria-controls="nb-list">Sommaire ▾<span id="nb-cur"></span></button><div class="list" id="nb-list" hidden>${toc.join('')}</div><b class="bar" id="nb-bar"></b></div>
   <article class="sheet doc dossier" id="note-doc"><div class="kick"><span>Bulletin n° ${nRel} · Note complète</span><span>${fdate(dateRel,true,true)}</span></div>
    <h1>Note complète du relevé</h1><p class="small" style="margin:-4px 0 22px">Ce qui a changé depuis le relevé du ${prev?fdate(prev.date):'—'}.</p>
    <div class="prose">${tmp.innerHTML}</div></article>
  </div></div>`;
};
P.note.after=()=>{
  const btn=$('#notebar button'),list=$('#nb-list');
  btn.addEventListener('click',()=>{list.hidden=!list.hidden;btn.setAttribute('aria-expanded',String(!list.hidden));});
  list.addEventListener('click',()=>{list.hidden=true;btn.setAttribute('aria-expanded','false');});
  noteSpy();
};
function noteSpy(){
  const doc=$('#note-doc');if(!doc)return;
  const hs=[...doc.querySelectorAll('.prose h2,.prose h3')];
  const r=doc.getBoundingClientRect(),vh=innerHeight;
  const pct=Math.max(0,Math.min(1,(vh*0.3-r.top)/(r.height-vh*0.5)));
  const bar=$('#nb-bar');if(bar)bar.style.width=(pct*100)+'%';
  let cur=hs[0];for(const h of hs){if(h.getBoundingClientRect().top<innerHeight*0.4)cur=h;else break;}
  if(cur){let h2=cur;if(cur.tagName==='H3'){let e=cur;while(e&&e.tagName!=='H2')e=e.previousElementSibling;h2=e||cur;}
   const c=$('#nb-cur');if(c)c.textContent=h2===cur?cur.textContent:`${h2.textContent} · ${cur.textContent}`;
   document.querySelectorAll('[data-to]').forEach(a=>a.classList.toggle('on',a.dataset.to===cur.id));}
}
let spyT;window.addEventListener('scroll',()=>{if(curId!=='note')return;if(spyT)return;spyT=requestAnimationFrame(()=>{spyT=null;noteSpy();});},{passive:true});
document.addEventListener('click',e=>{const a=e.target.closest('[data-to]');if(!a)return;e.preventDefault();const t=document.getElementById(a.dataset.to);if(t)window.scrollTo({top:t.getBoundingClientRect().top+scrollY-(innerWidth<=960?112:96),behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});if(false)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});});

P.sources=()=>`<div class="l-side">${sideNav(sectionOf('sources'),'sources')}<div>

   <section class="sheet pagehead"><div><div class="lbl">${D.catalogue.length} sources monde · ${F.catalogue.length} sources France</div><h1>Catalogue des sources</h1><p>Statut de chaque source au dernier relevé, et journal des sollicitations. Niveaux : A socle annuel, B flux de veille, C instituts, D outils.</p></div>
    <div class="kpis">${['répondu','bloqué'].map(s=>`<div class="kpi"><div class="v">${[...D.catalogue,...F.catalogue].filter(r=>r.statut===s).length}</div><div class="k">${s}</div></div>`).join('')}</div></section>
   <div class="card" style="margin-top:16px"><div class="ctl"><select id="c-cat" aria-label="Catalogue"><option value="M">Monde</option><option value="F">France</option></select><select id="c-niv" aria-label="Niveau"><option value="">Tous niveaux</option><option value="A">A · socle annuel</option><option value="B">B · flux de veille</option><option value="C">C · instituts</option><option value="D">D · outils</option></select><select id="c-st" aria-label="Statut"><option value="">Tous statuts</option><option>répondu</option><option>sans nouveauté</option><option>bloqué</option><option>non sollicitée</option></select><input id="c-q" type="search" placeholder="Rechercher une source" aria-label="Rechercher une source"></div>
