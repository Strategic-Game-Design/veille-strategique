<title>Veille stratégique mondiale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#e9ecf1; --ink:#101418; --ink-2:#4b545e; --muted:#7d868f; --line:#d7dce3; --line-2:#c3cad3;
  --accent:#1f4e79; --accent-ink:#ffffff;
  --s1:#0ca30c; --s2:#7fa61a; --s3:#e0a114; --s4:#e0703f; --s5:#c9302c;
  --s1-bg:#e5f5e5; --s2-bg:#eef3dd; --s3-bg:#fdf1d3; --s4-bg:#fbe3d7; --s5-bg:#f8dcdb;
  --shadow:0 1px 2px rgba(16,20,24,.06),0 6px 20px rgba(16,20,24,.06);
  --display:"IBM Plex Sans Condensed",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1317; --surface:#181d23; --surface-2:#222830; --ink:#f1f3f5; --ink-2:#b9c0c7; --muted:#8a939c; --line:#2c343d; --line-2:#3a434d;
  --accent:#7fb0e0; --accent-ink:#0f1317;
  --s1:#3fbf3f; --s2:#9cbd33; --s3:#f0b62b; --s4:#f08a5a; --s5:#e8514c;
  --s1-bg:#17301a; --s2-bg:#26301a; --s3-bg:#3a2e12; --s4-bg:#3d2417; --s5-bg:#3f1c1c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0f1317; --surface:#181d23; --surface-2:#222830; --ink:#f1f3f5; --ink-2:#b9c0c7; --muted:#8a939c; --line:#2c343d; --line-2:#3a434d;
  --accent:#7fb0e0; --accent-ink:#0f1317;
  --s1:#3fbf3f; --s2:#9cbd33; --s3:#f0b62b; --s4:#f08a5a; --s5:#e8514c;
  --s1-bg:#17301a; --s2-bg:#26301a; --s3-bg:#3a2e12; --s4-bg:#3d2417; --s5-bg:#3f1c1c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.01em}
.brand .stamp{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink-2);font:600 .86rem var(--body);padding:8px 12px 10px;cursor:pointer;white-space:nowrap;letter-spacing:.01em}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
main{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-inline:16px}
.panel[hidden]{display:none}
h2{font-family:var(--display);font-size:1.5rem;font-weight:600;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-size:1.12rem;font-weight:600;margin:22px 0 8px;text-wrap:balance}
.lede{color:var(--ink-2);max-width:72ch;margin:0 0 18px}
.eyebrow{font:600 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* gauges */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:22px}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center}
.gauge .big{font-family:var(--display);font-weight:700;font-size:4.6rem;line-height:1;font-variant-numeric:tabular-nums;grid-row:1/3}
.gauge .name{font-family:var(--display);font-weight:600;font-size:1.15rem}
.gauge .lvl{font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.9rem}
.gauge .scale{grid-column:1/3;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:10px}
.gauge .scale span{height:9px;border-radius:3px;background:var(--surface-2);position:relative}
.gauge .scale span.on{background:var(--c)}
.gauge .scale span i{position:absolute;top:12px;left:0;right:0;text-align:center;font:500 .68rem var(--mono);color:var(--muted);font-style:normal}
.gauge .sub{grid-column:1/3;margin-top:26px;font-size:.85rem;color:var(--ink-2)}
.gauge .sub b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card h3{margin-top:0}
/* domain bars */
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:.9rem}
.bars .lab{color:var(--ink-2)}
.bars .track{height:12px;background:var(--surface-2);border-radius:3px;position:relative;overflow:hidden}
.bars .fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--c)}
.bars .val{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.bars .w{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
/* indicator rows */
.ind{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ind:first-child{border-top:0}
.sev{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.3rem;background:var(--sb);color:var(--sc);border:1px solid var(--sc)}
.ind .t{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.ind .t b{font-weight:600}
.chip{font:500 .72rem var(--mono);padding:1px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.up{color:var(--s5);border-color:var(--s5)} .chip.down{color:var(--s1);border-color:var(--s1)}
.chip.nuc{color:var(--accent);border-color:var(--accent)}
.ind .v{font-family:var(--mono);font-size:.82rem;color:var(--ink);margin-top:3px}
.ind .j{color:var(--ink-2);font-size:.9rem;margin-top:4px;max-width:90ch}
.ind .src{margin-top:5px;font-size:.8rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.ind .src a{text-decoration:none;border-bottom:1px solid var(--line-2)}
.ind .src a:hover{border-bottom-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.8rem;color:var(--ink-2);margin:8px 0 14px}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.legend .k i{width:12px;height:12px;border-radius:3px;background:var(--c);display:inline-block}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.86rem;background:var(--surface)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .72rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.filters select,.filters input{font:500 .85rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 10px}
.filters input{min-width:200px;flex:1}
.formula{font-family:var(--mono);font-size:.84rem;background:var(--surface-2);padding:10px 12px;border-radius:6px;overflow-x:auto;white-space:pre}
.note{border-left:3px solid var(--s3);background:var(--s3-bg);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.9rem;margin:14px 0}
.note.red{border-color:var(--s5);background:var(--s5-bg)}
.prose{max-width:74ch}
.prose h2{font-size:1.25rem;margin-top:26px}
.prose h3{font-size:1.05rem}
.prose table{font-size:.84rem}
.prose blockquote{margin:0;padding-left:14px;border-left:3px solid var(--line-2);color:var(--ink-2)}
ul.tight{margin:6px 0;padding-left:20px} ul.tight li{margin:3px 0}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.subnav button{font:600 .8rem var(--body);color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;cursor:pointer}
.subnav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.subnav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ech{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.ech .card{padding:12px 14px}
.ech .lv{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.ech .lv span{font:500 .7rem var(--mono);padding:2px 7px;border-radius:4px;border:1px solid var(--line-2);color:var(--muted)}
.ech .lv span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .n{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.1}
.kpi .l{font-size:.75rem;color:var(--muted)}
@media (max-width:520px){.gauge .big{font-size:3.6rem}.bars{grid-template-columns:1fr;gap:4px}.bars .lab{margin-top:8px}}
@media (prefers-reduced-motion:no-preference){.bars .fill{transition:width .5s ease}}
</style>

rande ampleur repéré dans la fenêtre. Pression grise en hausse en revanche : les garde-côtes taïwanais ont compté 244 navires chinois autour de l'île en septembre (contre 55 en juin et 30 en mai), dont ~60 % de garde-côtes. Le paquet d'armes américain de 14 Md$ reste suspendu (aucune décision trouvée au 23 oct.).","valeur":"5 avions / 6 navires APL (19 oct.) ; 244 navires chinois en septembre (vs 55 en juin) ; paquet de 14 Md$ toujours suspendu","qualite":"partielle","sources":[{"titre":"WebIndia123/ANI, relevés MND Taïwan des 18 et 19 oct. 2026","url":"https://news.webindia123.com/news/articles/World/20261019/4512574.html","date":"2026-10-19","rang":"presse"},{"titre":"AP/ABC News, Taiwan says US arms sales to island are unchanged, but a $14B package remains on hold","url":"https://abcnews.com/International/wireStory/taiwan-us-arms-sales-island-unchanged-14b-package-136844909","date":"2026-09-30","rang":"presse"}],"date_donnee":"2026-10-19","rang_source":"presse","coef_qualite":0.8,"severite_ajustee":3.0,"coef_stab":0.8,"coef_guerre":1.2000000000000002},{"id":"coree","domaine":"geopolitique","libelle":"Péninsule coréenne","severite":3,"tendance":"hausse","puissance_nucleaire":true,"justification":"Deuxième salve en dix jours : le 12 oct. 2026 vers 9 h 20, la Corée du Nord a tiré deux missiles balistiques depuis la région de Pyongyang, dont au moins un a parcouru plus de 900 km (état-major sud-coréen), après le tir de portée intermédiaire du 3 oct. depuis Wonsan (>700 km). Le commandement américain Indo-Pacifique n'y voit « pas de menace immédiate ». Les célébrations de l'anniversaire du Parti (10 oct.) se sont tenues sur fond de difficultés économiques ; toujours ni ICBM ni essai nucléaire en 2026.","valeur":"2 missiles balistiques le 12 oct. (>900 km) après 1 tir le 3 oct. (>700 km) ; pas d'ICBM ni d'essai nucléaire en 2026","qualite":"verifiee","sources":[{"titre":"Korea Times, US Pacific Command says N. Korea fired 2 ballistic missiles, reaffirms defense commitment","url":"https://www.koreatimes.co.kr/southkorea/defense/20261013/us-pacific-command-says-n-korea-fired-2-ballistic-missiles-reaffirms-defense-commitment","date":"2026-10-13","rang":"presse"},{"titre":"Philstar/Interaksyon, North Korea launches multiple ballistic missiles, South Korea says","url":"https://interaksyon.philstar.com/politics-issues/2026/10/12/320382/north-korea-multiple-ballistic-missiles-south-korea-says/","date":"2026-10-12","rang":"presse"}],"date_donnee":"2026-10-12","rang_source":"presse","coef_qualite":0.8,"severite_ajustee":3.25,"coef_stab":0.8,"coef_guerre":1.2000000000000002},{"id":"inde_pakistan","domaine":"geopolitique","libelle":"Inde–Pakistan","severite":3,"tendance":"stable","puissance_nucleaire":true,"justification":"Rien de nouveau trouvé du 6 au 23 oct. 2026 : aucun incident daté sur la Ligne de contrôle ni développement bilatéral (deux recherches, résultats anciens ou non datés). La fermeture réciproque des espaces aériens arrivait à échéance le 23-24 oct. ; une nouvelle prolongation est probable mais n'a pas été vérifiée. Le dernier fait notable reste la collision navale du 15 sept. ; la fiche CFR n'a pas pu être relue avec son statut.","valeur":"Aucun incident daté dans la fenêtre ; dernier fait : collision navale du 15 sept. (0 victime)","qualite":"lacune","sources":[{"titre":"CFR Global Conflict Tracker, Conflict Between India and Pakistan","url":"https://www.cfr.org/global-conflict-tracker/conflict/conflict-between-india-and-pakistan","date":"2026-09-15","rang":"institut"},{"titre":"Al Jazeera, India-Pakistan navy ship collision sparks alarm over unintended escalation","url":"https://www.aljazeera.com/news/2026/9/17/india-pakistan-navy-ship-collision-sparks-alarm-over-unintended-escalation","date":"2026-09-17","rang":"presse"}],"date_donnee":"2026-09-25","rang_source":"institut","coef_qualite":0.9,"severite_ajustee":3.0,"coef_stab":0.9,"coef_guerre":1.35},{"id":"soudan","domaine":"geopolitique","libelle":"Guerre civile au Soudan","severite":5,"tendance":"stable","puissance_nucleaire":false,"justification":"Guerre des drones à son paroxysme : une vague de frappes a fait plus de 100 morts à partir du 18 oct. 2026 (AFP) — 80 morts au pôle de transport d'Al-Dibab (Kordofan-Occidental, zone FSR, attribuée à l'armée par les FSR), 17 morts à Nyala (19 oct.) après 30 morts au marché au bétail de Nyala (16 oct.), et 4 morts dont 3 enfants dans une maison près de l'aéroport de Khartoum (19 oct., drone des FSR). Les défenses aériennes ont intercepté des drones des FSR visant l'aéroport de Khartoum et les barrages d'Atbara et de Setit. L'ONU comptait déjà plus de 1 100 morts par drones au premier semestre.","valeur":">100 morts dans des frappes de drones (18-19 oct.), dont 80 à Al-Dibab et 17 à Nyala ; 30 morts à Nyala (16 oct.)","qualite":"verifiee","sources":[{"titre":"Citizen Digital/AFP, Drone strikes across Sudan kill more than 100","url":"https://citizen.digital/article/drone-strikes-across-sudan-kill-more-than-100-n392353","date":"2026-10-19","rang":"presse"},{"titre":"Sudan Tribune, Three children killed as army intercepts RSF drones near Khartoum airport","url":"https://sudantribune.com/article/320162","date":"2026-10-19","rang":"presse"}],"date_donnee":"2026-10-19","rang_source":"presse","coef_qualite":0.8,"severite_ajustee":5.0,"coef_stab":0.8,"coef_guerre":0.8},{"id":"sahel","domaine":"geopolitique","libelle":"Sahel (Mali/AES)","severite":4,"tendance":"stable","puissance_nucleaire":false,"justification":"Fenêtre contrastée au Mali (Critical Threats) : l'armée, avec l'Africa Corps russe et des milices touarègues, a repris Kidal le 6 oct. 2026 après le retrait du FLA, avec Tinzaouaten comme prochain objectif. Mais la violence jihadiste s'intensifie : affrontements EIGS–JNIM à la frontière Mali–Burkina le 9 oct. (au moins 60 morts selon la presse, 400 revendiqués par l'EIGS), attaques de l'EIGS contre au moins cinq villages daoussak près de Ménaka les 18-19 oct. (au moins 48 civils tués selon Reuters, plus de 100 selon d'autres sources) et 33 membres du MSA tués le 18 oct. L'état du blocus de Bamako n'a pas pu être actualisé.","valeur":"Kidal reprise (6 oct.) ; ≥60 morts EIGS–JNIM (9 oct.) ; ≥48 civils tués près de Ménaka (18-19 oct.) ; 33 MSA tués (18 oct.)","qualite":"partielle","sources":[{"titre":"Critical Threats, Africa File, October 22, 2026","url":"https://www.criticalthreats.org/analysis/libya-turkey-tplf-ethiopia-fgs-al-shabaab-somalia-issp-jnim-mali","date":"2026-10-22","rang":"institut"},{"titre":"Critical Threats, Africa File, October 8, 2026 (Mali Retakes Kidal)","url":"https://www.criticalthreats.org/analysis/Ethiopia-eritrea-tigray-tplf-egypt-somalia-sudan-saf-mali-fla-jnim","date":"2026-10-08","rang":"institut"}],"date_donnee":"2026-10-19","rang_source":"institut","coef_qualite":0.9,"severite_ajustee":4.0,"coef_stab":0.9,"coef_guerre":0.9},{"id":"rdc","domaine":"geopolitique","libelle":"RDC (Est) / M23","severite":4,"tendance":"hausse","puissance_nucleaire":false,"justification":"Escalade politique et militaire : l'ancien président Joseph Kabila a pris le 12 oct. 2026 la tête politique du Front pour la refondation de la nation (FRN), nouveau nom du front politique de l'AFC/M23 (Critical Threats, 21 oct.). Près de deux semaines de combats dans les hauts plateaux de Walungu (Sud-Kivu) débordent vers les contreforts d'Uvira ; les combats à Kaziba ont déplacé plus de 12 000 ménages. Le Burundi a présenté 13 « suspects » de collaboration avec le FRN et le Rwanda (8 oct.). Le processus de Doha reste à 2 protocoles signés sur 8 (SCR, 1er oct.).","valeur":"Kabila à la tête du FRN (ex-AFC/M23, 12 oct.) ; >12 000 ménages déplacés à Kaziba ; combats étendus vers Uvira ; 2/8 protocoles de Doha","qualite":"verifiee","sources":[{"titre":"Critical Threats, Congo War Security Review, October 21, 2026","url":"https://www.criticalthreats.org/briefs/congo-war-security-review","date":"2026-10-21","rang":"institut"},{"titre":"Critical Threats, Africa File f_stab":0.8,"coef_guerre":1.2000000000000002},{"id":"espace_aerien_golfe","domaine":"aerien","libelle":"Fermetures d'espace aérien Moyen-Orient/Golfe","severite":5,"tendance":"hausse","puissance_nucleaire":true,"justification":"Le front aérien s'étend à l'Arabie saoudite. L'aéroport King Khalid de Riyad a été frappé à plusieurs reprises par les Houthis (7, 8 et 10 oct. 2026 ; au moins 12 morts selon les autorités saoudiennes ; 623 départs annulés sur 1 096 en Arabie le 11 oct. selon Cirium) et n'a rouvert que le 18 oct. L'EASA a élargi le 9 oct. son CZIB 2026-09-R1 (FIR Djeddah, valable jusqu'au 16 nov.), et des NOTAM canadien (8 oct.), américain (11 oct.), allemand (13 oct.) et français (14 oct.) ont suivi. Safe Airspace (22 oct.) classe désormais 9 espaces en niveau 1, dont l'Arabie saoudite. Légère détente ailleurs : la FIR de Téhéran est rouverte au survol et celle du Koweït à partir du FL280.","valeur":"CZIB 2026-09-R1 (Arabie, élargi le 9 oct.) + CZIB 2026-07R3 (Golfe) valides au 16 nov. ; Riyad frappé les 7, 8 et 10 oct. (≥12 morts), rouvert le 18 oct. ; Arabie en niveau 1 Safe Airspace (22 oct.)","qualite":"verifiee","sources":[{"titre":"EASA, CZIB 2026-09-R1 — Airspace of Saudi Arabia (révisé le 9 oct. 2026, valide au 16 nov.)","url":"https://www.easa.europa.eu/en/domains/air-operations/czibs/czib-2026-09-r1","date":"2026-10-09","rang":"officiel"},{"titre":"FAA, Prohibitions, Restrictions and Notices (mise à jour du 13 oct. 2026 ; KICZ A0056/26 Djeddah)","url":"https://www.faa.gov/air_traffic/publications/us_restrictions","date":"2026-10-13","rang":"officiel"},{"titre":"Safe Airspace, Risk Summary 22 Oct 2026","url":"https://safeairspace.net/summary/","date":"2026-10-22","rang":"institut"},{"titre":"Khaleej Times, Over one third of Saudi Arabia flights cancelled on Monday as Houthi attacks continue","url":"https://www.khaleejtimes.com/business/over-one-third-of-saudi-arabia-flights-cancelled-on-monday-as-houthi-attacks-continue?amp=1","date":"2026-10-12","r om/crisis-timeline/","date":"2026-10-13","rang":"secondaire"},{"titre":"Safe Airspace, Risk Summary 22 Oct 2026 (Yémen, Arabie saoudite)","url":"https://safeairspace.net/summary/","date":"2026-10-22","rang":"institut"}],"date_donnee":"2026-10-22","rang_source":"officiel","coef_qualite":1.0,"severite_ajustee":4.25,"coef_stab":1.0,"coef_guerre":1.0},{"id":"baltique","domaine":"maritime","libelle":"Baltique — flotte fantôme, câbles, escortes","severite":4,"tendance":"stable","puissance_nucleaire":true,"justification":"Le tracker Grosswald (mis à jour le 19 oct. 2026) ne relève aucun nouvel arraisonnement ni câble endommagé en Baltique. Les nouveautés sont juridiques et institutionnelles. La Russie a retenu le 1er oct. le cargo chypriote Västerbotten dans ses eaux du golfe de Finlande. Le Conseil de l'UE a étendu le 9 oct. l'opération IRINI à la flotte fantôme, et le Conseil européen a appelé le 16 oct. à multiplier les arraisonnements. Le procès du Fitburg (câbles) s'est clos le 8 oct. à Helsinki, verdict attendu. Côté hybride, une tentative d'incendie a visé une station Starlink près de Vilnius le 18 oct.","valeur":"0 câble endommagé ni arraisonnement trouvé (6-23 oct.) ; Västerbotten retenu par la Russie (1er oct.) ; mandat flotte fantôme pour IRINI (9 oct.) ; tracker Grosswald à jour au 19 oct.","qualite":"partielle","sources":[{"titre":"Grosswald, Baltic Sea Security Tracker (mise à jour du 19 oct. 2026)","url":"https://www.grosswald.org/baltic-sea-security-tracker/","date":"2026-10-19","rang":"institut"},{"titre":"The Star/Reuters, Lithuania says attempted Starlink arson was Russia-linked sabotage","url":"https://www.thestar.com.my/news/world/2026/10/18/lithuania-says-attempted-starlink-arson-was-russia-linked-sabotage","date":"2026-10-18","rang":"presse"}],"date_donnee":"2026-10-19","rang_source":"institut","coef_qualite":0.9,"severite_ajustee":4.0,"coef_stab":0.9,"coef_guerre":1.35},{"id":"mer_noire","domaine":"maritime","libelle":"Mer Noire — guerre navale par té publique France n'a été trouvé du 06 au 23/10/2026, mais la recherche est restée limitée (plafond atteint). Le dernier bilan reste celui du 16/09 : au moins 7 800 décès en excès. Il n'y a ni vigilance canicule (saison close, tempête en cours le 23/10) ni activation ORSAN repérée. La donnée ancienne est conservée, et la note de 5 maintenue pour l'ampleur du bilan.","valeur":"≥ 7 800 décès en excès (bilan SPF provisoire du 16/09/2026) ; aucun nouveau bilan ni vigilance canicule au 23/10","qualite":"lacune","sources":[{"titre":"SPF – Canicule et santé : excès de mortalité durant l'épisode du 27 juillet au 20 août 2026","url":"https://www.santepubliquefrance.fr/climat/fortes-chaleurs-canicule/bulletin-national/canicule-et-sante-exces-de-mortalite-durant-lepisode-de-canicule-du-27-juillet-au-20-aout-2026","date":"2026-09-16","rang":"officiel"},{"titre":"Météo-France – Vigilance accessible (bulletin du 22/10/2026 16 h, aucune vigilance canicule)","url":"https://vigilance.meteofrance.fr/fr/vigilance-accessible","date":"2026-10-22","rang":"officiel"}],"date_donnee":"2026-09-16","rang_source":"institut","coef_qualite":0.9,"severite_ajustee":5.0,"coef":0.9},{"id":"feux_foret_2026","composante":"alertes","libelle":"Feux de forêt 2026 : saison record","severite":4,"tendance":"stable","systemique":false,"justification":"La compilation satellitaire Sylvie Forêt (Copernicus EFFIS), mise à jour le 22/10/2026, compte environ 94 132 ha brûlés en 2026 sur 786 feux, dont 37 632 ha en Gironde, contre 93 561 ha et 769 feux au 05/10. L'activité résiduelle reste faible : 23 feux et environ 819 ha sur 30 jours, le plus grand à Saurat (Ariège, 273 ha, 25/09). Toujours aucun bilan officiel de saison de la DGSCGC. La saison est close de fait, mais la note de 4 est maintenue pour son caractère record (plus de 6 fois la moyenne 2000-2025 de 14 746 ha).","valeur":"≈ 94 132 ha et 786 feux (EFFIS/Sylvie Forêt, maj 22/10/2026) ; 819 ha sur 30 jours ; pas de bilan officiel","qualite":"partielle"," rmée sur l'injection aux joints des pompes primaires) ; le 14/10, la détection tardive d'un dépassement du critère de fuite du circuit primaire d'un réacteur 2 (site non précisé) ; le 22/10, le non-respect des RGE après indisponibilité d'une soupape. Le niveau INES n'est pas indiqué dans le flux, et aucun événement de niveau 2 ou plus n'a été relevé en 2026.","valeur":"Max INES 2026 = niveau 1 ; 4 nouveaux avis ASNR du 09 au 22/10/2026 (dont Cattenom 3, Saint-Laurent 1), niveaux non indiqués","qualite":"partielle","sources":[{"titre":"ASNR – Flux des avis d'incident des installations nucléaires","url":"https://reglementation-controle.asnr.fr/rss/avis-incidents-INB","date":"2026-10-22","rang":"officiel"}],"date_donnee":"2026-10-22","rang_source":"officiel","coef_qualite":1.0,"severite_ajustee":1.0,"coef":1.0},{"id":"ordre_public_violences_urbaines","composante":"alertes","libelle":"Ordre public et violences urbaines","severite":5,"tendance":"hausse","systemique":false,"justification":"Les 17 et 18/10/2026, en marge de la journée « contre la vie chère », pillages et attaques de bâtiments publics ont touché la plupart des grandes villes : hôtel de ville de Limoges incendié, office du tourisme de Lyon brûlé, intrusion dans l'hôtel de ville de Marseille, résidence du préfet visée à Bordeaux. Le bilan est d'environ 2 400 interpellations, 997 FDO et pompiers blessés, au moins 3 000 commerces touchés et une facture d'environ 1,1 Md€ (IFRAP). Des couvre-feux préfectoraux sont en vigueur depuis le 19/10 : Paris (République, Halles, 23h-6h, prolongé jusqu'au 26/10), Lyon (21h-6h), Marseille (mineurs), Toulouse. L'état d'urgence est écarté « pour l'heure » par S. Lecornu, mais réclamé par B. Retailleau et souhaité par 71 % des sondés (Elabe). La commission des lois de l'AN a reçu des pouvoirs d'enquête le 20/10.","valeur":"≈ 2 400 interpellations, 997 FDO/pompiers blessés, ≥ 3 000 commerces touchés, ≈ 1,1 Md€ de dégâts ; couvre-feux à Paris, Lyon, Marseille et Toulouse (19-26/1 "rang":"officiel"}],"date_donnee":"2026-03-11","prochaine_edition":"2027-03","coef_qualite":1.0,"severite_ajustee":4.25},{"id":"s_ssmsi_bilan_2025","libelle":"SSMSI – Insécurité et délinquance en 2025","severite":4,"tendance":"hausse","poids":0.8,"justification":"Bilan statistique et atlas départemental (page datée 9 juillet 2026) : 975 homicides (stable), tentatives +4 %, coups et blessures volontaires +5 %, violences sexuelles +8 %, trafic de stupéfiants +9 %, escroqueries +7 % ; atteintes aux biens en baisse (cambriolages −3 %, vols de véhicules −9 %, vols avec armes −8 %). Vérifié le 23/10/2026 : aucune nouvelle édition dans la fenêtre du 6 au 23 octobre (publication annuelle, prochaine édition attendue en 2027-01).","valeur":"975 homicides ; violences sexuelles +8 % ; trafic +9 % (2025)","rang_source":"officiel","qualite":"verifiee","sources":[{"titre":"Interstats – Insécurité et délinquance en 2025 : bilan statistique","url":"https://www.interieur.gouv.fr/Interstats/Actualites/Insecurite-et-delinquance-en-2025-bilan-statistique-et-atlas-departemental","date":"2026-07-09","rang":"officiel"}],"date_donnee":"2026-07-09","prochaine_edition":"2027-01","coef_qualite":1.0,"severite_ajustee":4.25},{"id":"s_bdf_ers_juin_2026","libelle":"Banque de France – ERS juin 2026","severite":3,"tendance":"hausse","poids":0.6,"justification":"Évaluation des risques du système financier publiée le 24 juin 2026 : risque dominant = instabilité géopolitique (conflit au Moyen-Orient depuis le 28 février, fermeture du détroit d'Ormuz, ~20 % de la consommation mondiale d'hydrocarbures) ; le système financier « continue de faire preuve de résilience ». Pas de note chiffrée. Vérifié le 23/10/2026 : pas de nouvelle ERS (prochaine en décembre) ; publications BdF de la fenêtre : enquête mensuelle de conjoncture (12/10), billets sur prix du pétrole et délais de paiement ; une étude « Comment anticiper les risques extrêmes sur la croissance en France ? » est annoncée pour le 23/10.","valeur":"Risque dominant : instabilité géopolitique (24/06/2026)","rang_source":"officiel","qualite":"verifiee","sources":[{"titre":"Banque de France – Financial Stability Report June 2026","url":"https://www.banque-france.fr/en/news/financial-stability-report-june-2026","date":"2026-06-24","rang":"officiel"},{"titre":"Banque de France – Publications (consultée le 23/10/2026)","url":"https://www.banque-france.fr/fr/publications-et-statistiques/publications","date":"2026-10-23","rang":"officiel"}],"date_donnee":"2026-06-24","prochaine_edition":"2026-12","coef_qualite":1.0,"severite_ajustee":3.25},{"id":"s_lpm_actualisee_2026","libelle":"LPM actualisée (loi n° 2026-791 du 16 août 2026)","severite":3,"tendance":"stable","poids":0.5,"justification":"LPM actualisée promulguée le 16 août 2026 : +36 Md€ sur 2026-2030 (436 Md€ au total), 2,7 % du PIB en 2030, 3,5 % visé en 2035. Première annuité dans le PLF 2027 (déposé le 01/10/2026) : environ +6,4/6,5 Md€ pour la Défense (> 63,4 Md€), l'un des seuls budgets en hausse ; le CEMA F. Mandon a été auditionné par la commission de la défense de l'AN le 8 octobre, l'avis budgétaire de cette commission (n° 3394) est daté du 22 octobre, et la discussion en séance a commencé le 13 octobre. Risque d'exécution accru : le HCFP (avis du 25/09, présenté au Sénat le 07/10) juge la croissance 2027 (1 %) « optimiste », le déficit 2026 à 5,4 % et la dette proche de 122 % du PIB en 2027, avec une charge d'intérêts qui absorbe une large part de l'effort.","valeur":"+36 Md€ 2026-2030 ; PLF 2027 Défense ≈ +6,5 Md€ (> 63,4 Md€) ; avis AN n° 3394 (22/10)","rang_source":"officiel","qualite":"verifiee","sources":[{"titre":"Assemblée nationale – Dossier législatif PLF 2027 (projet n° 3210, avis défense n° 3394 du 22/10)","url":"https://www.assemblee-nationale.fr/dyn/17/dossiers/PLF_2027","date":"2026-10-22","rang":"officiel"},{"titre":"HCFP – Avis n° HCFP-2026-5 relatif aux PLF et PLFSS 2027","url":"https://www.hcfp.fr/sites/default/files/2026-10/Avis%20HCFP%202026-5%20-%20PLF-PLFSS%202027.pdf","date":"2026-09-25","rang":"officiel"},{"titre":"Sénat – La loi en clair : actualisation de la LPM","url":"https://www.senat.fr/travaux-parlementaires/textes-legislatifs/la-loi-en-clair/projet-de-loi-actualisant-la-programmation-militaire-pour-les-annees-2024-a-2030-et-portant-diverses-dispositions-interessant-la-defense.html","date":"2026-08-16","rang":"officiel"},{"titre":"LCP – Budget 2027 : audition de Fabien Mandon, chef d'état-major des armées","url":"https://lcp.fr/index%2ephp/programmes/la-seance-est-ouverte/budget-2027-audition-de-fabien-mandon-chef-d-etat-major-des-armees","date":"2026-10-08","rang":"presse"},{"titre":"Public Sénat – Budget 2027 : le HCFP pointe des prévisions « optimistes »","url":"https://www.publicsenat.fr/actualites/economie/budget-2027-le-haut-conseil-des-finances-publiques-pointe-des-previsions-optimistes-du-gouvernement","date":"2026-10-07","rang":"presse"}],"date_donnee":"2026-10-22","prochaine_edition":"2026-12 (vote de la loi de finances 2027, mission Défense)","coef_qualite":1.0,"severite_ajustee":3.0}],"echelles":[{"nom":"Vigipirate","autorite":"SGDSN / Premier ministre","niveaux":["vigilance","vigilance renforcée","alerte attentat"],"niveau_actuel":"vigilance renforcée (présumé inchangé ; page SGDSN illisible le 23/10)","date_niveau_actuel":"2026-10-06","historique_2026":"« Urgence attentat » (ancien plan, niveau maximal) du 5 janvier au 21 juin 2026 (posture hiver-printemps, en continuité depuis le 25 mars 2024) ; nouveau plan « Faire face ensemble » et passage au niveau intermédiaire « vigilance renforcée » le 22 juin 2026 (posture été-automne 2026, priorités drones/sites touristiques/bâtiments publics) ; renforcement de Sentinelle et télégramme « extrême vigilance » début mars 2026 (guerre d'Iran) ; aucun changement en septembre 2026. Confirmé inchangé au 21 septembre 2026 (SGDSN, préfecture de l'Ain) ; réunion des préfets de zone sur la résilience nationale le 17/09/2026. Confirmé inchangé au 28 septembre 2026 (SGDSN) ; le 24/09, le président évoque publiquement un scénario d'attaques de drones russes contre la France et demande un plan de protection des infrastructures critiques (nucléaire, réseaux électriques, ports), sans relèvement du niveau ; grève et manifestations de la fonction publique le 29/09 sous cette posture. Confirmé inchangé au 6 octobre 2026 (page SGDSN consultée ce jour ; alerte MEAE du 10/09 au même stade) : aucun relèvement après l'épisode du 24/09 ni autour des manifestations du 29/09 (206 000 manifestants, 440 interpellations). — Relevé du 23/10/2026 : Du 06 au 23/10/2026, aucun changement de niveau n'a été repéré : ni après l'attaque du collège d'Aubagne (12/10, PNAT saisi le 13/10), ni après les violences du 17/10 (2 397 interpellations). La page SGDSN était bloquée par un contrôle anti-robot le 23/10, et la posture hiver-printemps n'est pas encore annoncée.","url":"https://www.sgdsn.gouv.fr/vigipirate"},{"nom":"Vigilance météorologique","autorite":"Météo-France","niveaux":["vert","jaune","orange","rouge"],"niveau_actuel":"orange vent : 15 départements (tempête Austen ; Bretagne, Normandie, Loire-Atlantique, Nord, Pas-de-Calais, Somme, Yvelines, Val-d'Oise) et 53 en jaune pour le 23/10/2026, 0 rouge (bulletin du 22/10 16 h)","date_niveau_actuel":"2026-10-22","historique_2026":"Épisodes majeurs : canicule fin mai (17 départements orange le 26-30 mai) ; 25 juin 2026 : 72 départements en rouge canicule et 14 en orange, inédit depuis 2004 ; 12 juillet : 37 rouges, 46 oranges ; 13-14 août : jusqu'à 80 départements orange ; historique complet des vigilances orange/rouge 2026 non compilé. 19/09 : jaune orages 2A/2B ; 20-21/09 : carte entièrement verte (bulletin du 20/09, 6 h). 27/09 : carte entièrement verte (bulletin du 27/09 6 h ; 22-26/09 non compilés) ; 28/09 : retour des orages, 26 départements en jaune orages (Île-de-France, Centre, Poitou-Charentes, Aquitaine, Pyrénées), > 20 mm en 3 h à Niort ; pic de chaleur tardif (> 30 °C) attendu le 29/09 et épisode cévenol annoncé pour les 30/09-01/10 (jusqu'à 300 mm). 30/09 : épisode cévenol, Gard et Hérault en vigilance ROUGE pluie-inondation (levée à 22 h 15), 337,6 mm à Saint-Hippolyte-du-Fort, 299 mm à Colognac, 80-120 mm en 3 h à Montpellier, écoles fermées, 8 évacués, 1 blessée légère, aucun décès rapporté ; orange maintenu jusqu'au 01/10 (9 h dans le Gard et l'Hérault, midi dans les Bouches-du-Rhône), Var menacé le soir du 01/10 (issue non lue) ; 02-05/10 non compilés. 06/10 (bulletin de 6 h) : nouveau passage en orange pluie-inondation/orages du Gard et de l'Hérault, 39 départements en jaune ; 61 jaune annoncés pour le 07/10. — Relevé du 23/10/2026 : Les 07-21/10/2026 n'ont pas été compilés. Le 22/10, 3 départements bretons étaient en orange vent. Pour le 23/10 (tempête Austen, première tempête d'automne), 15 départements sont en orange vent et 53 en jaune, avec des rafales de 130 à 140 km/h sur les côtes ; la presse annonce 23 départements en orange, dont l'Île-de-France, au bulletin du 23/10 6 h (non vérifié).","url":"https://vigilance.meteofrance.fr/fr/vigilance-accessible"},{"nom":"ORSAN (organisation de la réponse du système de santé)","autorite":"Ministère de la Santé / ARS (volets AMAVI, CLIM, EPI-VAC, BIO, NRC)","niveaux":["niveau 1 – surveillance","niveau 2 – coordination renforcée","niveau 3 – mobilisation maximale (déprogrammations ciblées)","niveau 4 – dépassement des capacités nationales"],"niveau_actuel":"aucune activation nationale signalée","date_niveau_actuel":"2026-10-23","historique_2026":"Niveau 2 activé le 23 juin 2026 puis niveau 3 activé nationalement le 25 juin 2026 (72 départements, 51,1 M d'habitants, réserve sanitaire mobilisée) — première activation nationale simultanée du niveau 3 ; date de désactivation non retrouvée ; aucune activation signalée en septembre. Aucune activation signalée du 18 au 21 septembre 2026. Aucune activation signalée du 22 au 28 septembre 2026 (ministère de la Santé non consulté ; aucune vigilance canicule). Aucune activation signalée du 28 septembre au 6 octobre 2026 (recherche presse ; ministère de la Santé non consulté) ; lors de l'épisode cévenol du 30/09, seul un aménagement d'activité du CHU de Nîmes (report des rendez-vous non urgents) est rapporté. — Relevé du 23/10/2026 : Aucune activation ORSAN signalée du 06 au 23/10/2026 (recherche presse limitée ; ministère de la Santé non consulté), y compris après les violences du 17/10 (997 membres des forces de l'ordre blessés) et pendant la tempête Austen.","url":"https://www.journaldeleconomie.fr/orsan-niveau-3-comment-sante-canicule/"},{"nom":"Vigilance canicule / plan de gestion des vagues de chaleur","autorite":"Météo-France (vigilance) / ministère de la Santé, Santé publique France","niveaux":["vert – pas de vigilance","jaune – pic de chaleur","orange – canicule","rouge – canicule extrême"],"niveau_actuel":"vert – aucune vigilance canicule en cours","date_niveau_actuel":"2026-10-22","historique_2026":"Quatre épisodes : 24-28 mai (≥ 300 décès en excès), 17 juin-2 juillet (5 764 décès en excès, 72 départements rouges le 25 juin, température moyenne nationale record de 30 °C les 24-25 juin), 3-20 juillet (≥ 1 243), 27 juillet-20 août (≥ 817, 79 départements, durée record égalant juillet 1983) ; ≥ 7 800 décès en excès cumulés, été le plus meurtrier depuis 2003 ; bilan consolidé SPF à venir. Aucun nouveau bilan SPF depuis le 16/09/2026 ; aucune vigilance au 20-21/09. Aucune vigilance canicule du 22 au 28/09/2026 malgré un pic de chaleur tardif annoncé (> 30 °C le 29/09) ; aucun nouveau bilan SPF depuis le 16/09 (≥ 7 800 décès en excès). Aucune vigilance canicule du 29/09 au 06/10/2026 (bulletin Météo-France du 06/10 : pluie-inondation et orages seulement) ; toujours pas de bilan consolidé SPF (dernier : 16/09, ≥ 7 800 décès en excès ; ≈ 7 919 selon l'addition de presse du 17/09). — Relevé du 23/10/2026 : Aucune vigilance canicule du 06 au 23/10/2026 (bulletin du 22/10 : vent, pluie-inondation, orages, vagues-submersion) ; aucun nouveau bilan SPF repéré depuis celui du 16/09 (≥ 7 800 décès en excès).","url":"https://www.santepubliquefrance.fr/climat/fortes-chaleurs-canicule/bulletin-national/canicule-et-sante-exces-de-mortalite-durant-lepisode-de-canicule-du-27-juillet-au-20-aout-2026"},{"nom":"Vigilance feux de forêt (Météo des forêts)","autorite":"Météo-France / DGSCGC (sécurité civile)","niveaux":["vert – danger faible","jaune – danger modéré","orange – danger élevé","rouge – danger très élevé"],"niveau_actuel":"non compilé (carte Météo des forêts non consultée ; saison close de fait, tempête et pluies sur l'ouest)","date_niveau_actuel":"2026-10-22","historique_2026":"Saison record : ≈ 96 300 ha brûlés au 24 août (EFFIS ; précédent record 66 300 ha en 2022), ~11 000 départs de feu ; incendie de Saumos (Gironde) du 23 juillet : 42 000 ha, 252 bâtiments détruits, 208 000 personnes évacuées, 330+ pompiers blessés, 3 300 sapeurs-pompiers et 1 500 militaires engagés, « plus grande opération feu de forêt de l'histoire de la sécurité civile » ; sécheresse extrême des sols sur 77 % du territoire mi-août. Estimations divergentes : 71 612 ha (VigieFeux/EFFIS au 20/09/2026, 37 626 ha en Gironde) vs ≈ 96 300-100 000 ha (compilations EFFIS fin août) ; hommage national aux pompiers morts en Gironde le 18/09/2026 à Bordeaux. Aucun grand feu signalé du 22 au 28/09/2026 ; toujours pas de bilan officiel DGSCGC de la saison (dernière estimation : 71 612 ha VigieFeux/EFFIS au 20/09). Au 05/10/2026 : 93 561 ha et 769 feux cartographiés par satellite (Sylvie Forêt ; 37 632 ha en Gironde), dont ≈ 1 084 ha sur les 30 derniers jours (Ariège 409 ha, Landes 292 ha) ; départs encore signalés dans l'Aude du 21 au 27/09 ; toujours pas de bilan officiel DGSCGC. — Relevé du 23/10/2026 : Au 22/10/2026 : environ 94 132 ha et 786 feux cartographiés par satellite (Sylvie Forêt/EFFIS ; 37 632 ha en Gironde), dont 23 feux et environ 819 ha sur 30 jours ; toujours pas de bilan officiel de la DGSCGC.","url":"https://www.gironde.gouv.fr/Actualites/Communiques-de-presse/Communiques-de-presse-2026/Aout-2026/Incendie-de-Saumos-point-de-situation-ce-samedi-1er-aout-a-20h"},{"nom":"Échelle INES (événements nucléaires et radiologiques)","autorite":"ASNR (Autorité de sûreté nucléaire et de radioprotection)","niveaux":["0 – écart","1 – anomalie","2 – incident","3 – incident grave","4 – accident n'entraînant pas de risque important hors du site","5 – accident entraînant un risque hors du site","6 – accident grave","7 – accident majeur"],"niveau_actuel":"niveau 1 (maximum 2026) ; 4 avis d'incident ASNR du 09 au 22/10/2026, niveaux non indiqués","date_niveau_actuel":"2026-10-22","historique_2026":"Au moins 15 événements de niveau 1 entre le 25 juin et le 17 septembre 2026 (Cattenom 2 et 4, Nogent 1, Chooz B2, Saint-Alban 1, Tricastin, Golfech 1 et 2, Blayais 1, Dampierre, Chinon B1, Bugey 2, CEA LECI Saclay, Framatome) plus des avis antérieurs (février-mars) ; aucun événement ≥ niveau 2 identifié en 2026 ; arrêt temporaire de Golfech le 23 juin pour canicule. Aucun nouvel avis du 18 au 21 septembre 2026. 23/09/2026 : trois nouveaux avis d'incident ASNR (Civaux : indisponibilité de deux chaînes de mesure neutronique détectée tardivement ; RHF de l'ILL : distribution de faisceau de neutrons ; Tricastin : indisponibilité d'une alimentation électrique de secours), niveaux INES non vérifiés ; EDF a déclaré le 14/09 un ESS de niveau 1 sur Blayais 1 (faits du 10/09) ; aucun événement ≥ 2. 29/09/2026 : deux nouveaux avis ASNR (Chooz B1 : indisponibilité prolongée d'un groupe diesel de secours après erreur de maintenance ; Blayais : indisponibilité de la source électrique externe auxiliaire au-delà du délai autorisé), déclarés au niveau 1 par EDF ; aucun avis daté d'octobre au 06/10, aucun événement ≥ 2. — Relevé du 23/10/2026 : ASNR : le 09/10/2026, avis sur Cattenom 3 (réglage erroné des soupapes du circuit de réfrigération à l'arrêt) et Saint-Laurent-des-Eaux 1 (soupape bloquée sur l'injection aux joints des pompes primaires) ; le 14/10, détection tardive d'un dépassement de débit de fuite du circuit primaire (réacteur 2, site non précisé) ; le 22/10, non-respect des RGE après indisponibilité d'une soupape. Niveaux INES non indiqués ; aucun événement de niveau 2 ou plus.","url":"https://reglementation-controle.asnr.fr/controle/ines-et-asn-sfro"},{"nom":"CERT-FR – alertes de sécurité (CERTFR-AAAA-ALE-nnn)","autorite":"ANSSI / CERT-FR","niveaux":["pas d'échelle de niveau : alerte ouverte / alerte clôturée (indicateur = nombre d'alertes ouvertes)"],"niveau_actuel":"4 alertes ouvertes : ALE-014 PHP (21/10), ALE-013 Ivanti Connect Secure (14/10), ALE-012 contrôleurs de réfrigération (12/10), ALE-011 Citrix NetScaler (28/09)","date_niveau_actuel":"2026-10-22","historique_2026":"10 alertes émises en 2026 (ALE-001 Ivanti EPMM 30/01 ; ALE-002 Cisco SD-WAN 25/02 ; ALE-003 ciblage des messageries instantanées 20/03 ; ALE-004 F5 BIG-IP ; ALE-005 Exchange 15/05 ; ALE-006 SonicWall 15/07 ; ALE-007 WordPress 20/07 ; ALE-008/009/010 ouvertes) ; contexte : fuite ANTS 11,7 M de comptes (avril), vague de fuites publiques en août, attribution au FSB le 13 juillet 2026. Clôtures : ALE-002 (26/03), ALE-003 (20/04), ALE-005 (13/07), ALE-001 et ALE-004 (28/07), ALE-006 et ALE-007 (24/08) ; aucune nouvelle alerte ni clôture du 19 au 21/09/2026. Clôture de CERTFR-2026-ALE-008 (Microsoft SharePoint, publiée le 22/07) le 22/09/2026 ; aucune nouvelle alerte (pas d'ALE-011) au 28/09 ; 10 émises, 8 clôturées en 2026. 28/09/2026 : ouverture de CERTFR-2026-ALE-011 (Citrix NetScaler ADC et Gateway, exploitation active antérieure aux correctifs, mise à jour le 30/09) ; au 06/10 : 3 ouvertes, 11 émises, 8 clôturées ; le 30/09, l'ANSSI reconnaît la compromission de 120 de ses comptes (118 ANSSI, 2 DINUM) via la faille Metabase (ALE-010), au lendemain de son rapport sur le piratage de la DGFiP (≈ 700 000 contribuables). — Relevé du 23/10/2026 : Le 12/10/2026, ouverture d'ALE-012 (incident ciblant les contrôleurs à distance des installations de réfrigération : Danfoss, Copeland/Dixell ; compromissions nombreuses, mise à jour le 13/10). Le 13/10, clôture d'ALE-009 (SonicWall SMA) et d'ALE-010 (Metabase). Le 14/10, ouverture d'ALE-013 (Ivanti Connect Secure) ; le 21/10, d'ALE-014 (PHP, mise à jour le 22/10). Au 23/10 : 4 alertes ouvertes, 14 émises, 10 clôturées ; le site a migré vers cert.cyber.gouv.fr.","url":"https://www.cert.ssi.gouv.fr/alerte/"},{"nom":"FR-Alert (alerte des populations par diffusion cellulaire)","autorite":"Ministère de l'Intérieur (DGSCGC) / préfectures","niveaux":["pas d'échelle : alerte déclenchée par type d'événement (incendie, inondation, orage, attentat, accident industriel, alerte enlèvement)"],"niveau_actuel":"aucune alerte en cours connue ; dernière diffusion identifiée le 30/09/2026 ; tableau officiel inaccessible (robots, 23/10)","date_niveau_actuel":"2026-09-30","historique_2026":"Extension au relais des alertes enlèvement (mars 2026) ; utilisé pour l'évacuation du Cap Ferret / Bassin d'Arcachon (~40 000 personnes en quelques heures) lors de l'incendie de Saumos fin juillet 2026 ; tableau des alertes 2026 disponible sur fr-alert.gouv.fr mais non consultable. Aucune diffusion FR-Alert signalée par la presse du 18 au 21/09/2026 (non vérifiable sur le tableau officiel). Aucune diffusion FR-Alert identifiée du 22 au 28/09/2026 (tableau officiel toujours inaccessible, robots/TLS ; presse non exhaustive). 30/09/2026 : messages FR-Alert diffusés dans le Gard et l'Hérault pendant la vigilance rouge pluie-inondation (consigne de rester à l'abri ; source AFP, périmètre exact non précisé) ; tableau officiel toujours inaccessible au 06/10 ; diffusion éventuelle pour la vigilance orange du 06/10 non vérifiée. — Relevé du 23/10/2026 : Aucune diffusion FR-Alert identifiée du 06 au 23/10/2026 (tableau officiel bloqué par robots.txt ; recherche limitée). Une éventuelle diffusion pour la tempête Austen (orange vent, 23/10) n'a pas été vérifiée.","url":"https://fr-alert.gouv.fr/tableau-alertes"},{"nom":"État d'urgence (loi n° 55-385 du 3 avril 1955)","autorite":"Président de la République en Conseil des ministres (décret, 12 jours) puis Parlement (loi de prorogation)","niveaux":["non déclaré","déclaré par décret (12 jours)","prorogé par la loi"],"niveau_actuel":"non déclaré","date_niveau_actuel":"2026-10-23","historique_2026":"Aucun décret d'état d'urgence identifié en 2026 (à confirmer sur Légifrance) ; la LPM actualisée (loi 2026-791 du 16 août 2026) crée par ailleurs un « état d'alerte de sécurité nationale », non activé. Aucun décret d'état d'urgence ni activation de l'« état d'alerte de sécurité nationale » signalés au 21/09/2026. Aucun décret d'état d'urgence ni activation de l'« état d'alerte de sécurité nationale » signalés au 28/09/2026 (Légifrance non consulté ; rien dans l'interview présidentielle du 24/09 ni dans la presse). Aucun décret d'état d'urgence ni activation de l'« état d'alerte de sécurité nationale » signalés au 06/10/2026 (recherche presse sans résultat ; Légifrance non consulté). — Relevé du 23/10/2026 : Après les émeutes et pillages des 17-18/10/2026, l'état d'urgence n'a pas été déclaré au 23/10. S. Lecornu l'écarte « pour l'heure » tout en se disant prêt à le décréter « si c'est nécessaire » ; B. Retailleau (LR) le réclame et 71 % des sondés le souhaitent dans les zones touchées (Elabe, 21/10). Le gouvernement privilégie des couvre-feux préfectoraux localisés depuis le 19/10 (Paris, Lyon, Marseille, Toulouse) et des interdictions de manifester, seules les manifestations syndicales étant autorisées le 24/10 (annonce d'E. Macron, 22/10). Un Conseil de sécurité s'est tenu à l'Élysée le 22/10. L'« état d'alerte de sécurité nationale » n'a pas été activé (Légifrance non consulté).","url":"https://www.legifrance.gouv.fr"},{"nom":"Notations souveraines (dette long terme de la France)","autorite":"Fitch Ratings, S&P Global Ratings, Moody's","niveaux":["AAA / oc":"Non consultés (contenus payants, budget de recherche épuisé le 23/10/2026).","journal":[{"date":"2026-09-19","statut":"non sollicitée"},{"date":"2026-09-21","statut":"non sollicitée"},{"date":"2026-09-28","statut":"non sollicitée"},{"date":"2026-10-06","statut":"bloqué"},{"date":"2026-10-23","statut":"bloqué"}]},{"domaine":"presse","nom":"Cerfia, Entrevue, communautés OSINT FR (X/Telegram)","editeur":"Comptes/agrégateurs","url":"https://x.com/CerfiaFR ; https://entrevue.fr","frequence":"Continu","mesure":"Reprise rapide d'indices/événements (fiabilité variable, à recouper)","acces":"Public","niveau":"B","verifie":"2026-10-23","consultee":true,"statut":"répondu","dernier_doc":"Entrevue : « Budget 2027 : après avoir détricoté le projet de Lecornu, les députés suspendent les débats » (20/10/2026) ; Cerfia (X) non consulté.","journal":[{"date":"2026-09-19","statut":"répondu"},{"date":"2026-09-21","statut":"répondu"},{"date":"2026-09-28","statut":"non sollicitée"},{"date":"2026-10-06","statut":"sans nouveauté"},{"date":"2026-10-23","statut":"répondu"}]}]},"historique":[{"date":"2026-09-18","stabilite_niveau":2,"stabilite_continu":2.02,"guerre_niveau":3,"guerre_continu":1.97,"guerre_brut":2,"stabilite_conj":3.86,"stabilite_struct":4.25,"guerre_conj":3.94,"guerre_struct":4.25,"n_indicateurs":44,"modele":"v2","france_niveau":3,"france_continu":2.37,"france_brut":2,"france_exterieur":2.42,"france_interieur":1.95,"france_alertes":2.97,"faits_marquants":"Relevé initial (modèle v2 appliqué le 19 sept.) : guerre É-U/Israël–Iran jour 203, Ormuz 4-12 transits/j, Brent 130,80 $ (15 sept.), 23 violations aériennes en Roumanie, New START expiré, Horloge 85 s."},{"date":"2026-09-21","stabilite_niveau":2,"stabilite_continu":2.08,"guerre_niveau":3,"guerre_continu":2.04,"guerre_brut":2,"stabilite_conj":3.78,"stabilite_struct":4.24,"guerre_conj":3.85,"guerre_struct":4.21,"france_niveau":3,"france_continu":2.42,"france_brut":2,"france_exterieur":2.53,"france_interieur":2.08,"france_al  Mokha/Bab el-Mandeb (4 oct.), plus de 100 avions saoudiens ; Ormuz : 8 navires frappés du 28 sept. au 4 oct. (2 la semaine précédente), renforts navals US ; mer Noire : cargo Royad Mammadov coulé par drones en ZEE roumaine (5 oct.) ; non-papier russe à l'OTAN menaçant d'un emploi nucléaire sur Kaliningrad (30 sept.), Hegseth confirme des retraits d'Europe (3 oct.) ; aucune violation aérienne OTAN confirmée ; CZIB EASA prolongé au 16 nov. ; OAT-Bund 130 pb (1er oct.) puis 146,9 pb (2 oct., pic 152), UST 10 ans 5,32 %, HY OAS 310 pb, Brent 97,73 $ (G7 : 100 Mb) ; France : PLF 2027 présenté le 1er oct. (déficit 5,0 %), PS maintient la menace de censure, mouvement lycéen violent (1 027 lycées, 625 interpellations), inflation +3,0 %, rouge pluie-inondation Gard/Hérault (30 sept.), CERT-FR à 3 alertes, West Nile 145 cas, Yanbu confirmé par le MEAE."},{"date":"2026-10-23","stabilite_niveau":2,"stabilite_continu":1.94,"guerre_niveau":3,"guerre_continu":1.92,"guerre_brut":2,"stabilite_conj":3.99,"stabilite_struct":4.24,"guerre_conj":4.02,"guerre_struct":4.21,"france_niveau":3,"france_continu":2.2,"france_brut":2,"france_exterieur":2.48,"france_interieur":1.74,"france_alertes":2.39,"n_indicateurs":44,"modele":"v3","faits_marquants":"Ormuz : record de 27 attaques en octobre, GFS Pride coulé (13 oct.), Gardiens déclarent le détroit fermé (20 oct.), Brent daté 126,55 $ (14 oct.) puis ~114 $ ; mer Noire : ≥8 navires frappés par drones en eaux roumaines et ZEE bulgare (≥23 marins morts/disparus), 2 Geran abattus par F-16 roumains (17 oct.), Conseil de l'Atlantique Nord saisi sans article 4 ; Ukraine : trêve énergétique du 11 oct. violée dès le 14, 580 drones (14-15 oct.) ; Witkoff–Poutine (21 oct.) : trilatérale après le 10 nov. ; Houthis : 20 attaques sur l'aéroport de Riyad (12 morts le 10 oct.), missile intercepté au-dessus de Yanbu (16 oct.) ; Iran : Trump exclut une frappe avant le 3 nov., plans post-élection (NYT) ; complot de Fairford attribué aux Gardiens (12 oct.) ; marchés : TTF ~92 €/MWh, VIX 19,99 (16 oct.), OAT-Bund 174,6 pb (22 oct.), OAT 10 ans > 5 % ; France : émeutes et pillages des 17-18 oct. (≈2 400 interpellations, 997 FDO blessés), couvre-feux à Paris, Lyon, Marseille, Toulouse ; PLF 2027 détricoté (−10 Md€), vote des recettes reporté au 3 nov. ; Moody's attendu le 23 oct. ; fusillade terroriste au collège d'Aubagne (12 oct.) ; CERT-FR à 4 alertes ; tempête Austen (15 départements orange vent)"}]};
const REPORT = "<p>Relevé du <strong>vendredi 23 octobre 2026<\/strong> (données arrêtées le 23 au matin, heure de Paris), comparé au relevé du 6 octobre. Modèle v3 inchangé. <strong>La fenêtre est de dix-sept jours<\/strong> : le relevé hebdomadaire du 13 octobre n'a pas eu lieu, et les tendances sont mesurées par rapport au 6 octobre.<\/p>\n<h3>Synthèse<\/h3>\n<p><strong>Stabilité mondiale : niveau 2, « Crise systémique » (1,94, contre 2,02 le 6 oct.).<\/strong> <strong>Risque de guerre mondiale : niveau 3, « Risque élevé » (calculé 1,92, contre 2,00 ; le niveau calculé brut est 2, maintenu à 3 par la règle de palier).<\/strong> <strong>France : niveau 3, « Tension marquée » (2,20, contre 2,29 ; brut 2, plancher 3).<\/strong> Ses sous-niveaux : risque extérieur 2,48 (niveau 2, contre 2,57 et niveau 3), tension intérieure 1,74 (niveau 2, contre 1,93) et alertes officielles 2,39 (niveau 2, contre 2,50).<\/p>\n<p>Les trois indices se dégradent, sans franchir de seuil d'affichage. Le recul du risque extérieur France sous 2,5 fait passer cette composante en « Risque critique ». Quatre mouvements expliquent l'essentiel de la dégradation :<\/p>\n<ol>\n<li><strong>Ormuz.<\/strong> La guerre maritime atteint un record : 27 attaques contre des navires de commerce en octobre au 22 du mois, le <em>GFS Pride<\/em> coulé le 13 et le détroit déclaré fermé par les Gardiens le 20. Le Brent daté a culminé à 126,55 $ le 14 octobre.<\/li>\n<li><strong>Mer Noire.<\/strong> Elle devient un théâtre de friction directe avec l'OTAN. Au moins huit navires ont été frappés par des drones dans les eaux roumaines et la ZEE bulgare, avec au moins 23 marins morts ou disparus. Des F-16 roumains ont abattu deux Geran le 17 octobre et le Conseil de l'Atlantique Nord a été saisi, sans invocation de l'article 4. L'indicateur « seuil article 5 » passe de 3 à 4.<\/li>\n<li><strong>Guerre hybride.<\/strong> Londres attribue aux Gardiens le complot contre la base RAF de Fairford (12 oct.). Des stations Starlink ont été sabotées en Bulgarie et en Lituanie. Le sabotage passe à 5.<\/li>\n<li><strong>France.<\/strong> Après la journée « contre la vie chère » du 17 octobre (550 000 manifestants selon l'Intérieur), les émeutes et pillages des 17 et 18 ont provoqué environ 2 400 interpellations et fait 997 blessés parmi les forces de l'ordre et les pompiers. Des couvre-feux sont en vigueur à Paris, Lyon, Marseille et Toulouse. Dans le même temps, le spread OAT-Bund atteint 174,6 pb (22 oct.) et l'OAT 10 ans dépasse 5 % pour la première fois depuis 2002, à la veille de la revue Moody's du 23 octobre.<\/li>\n<\/ol>\n<p><strong>Paliers.<\/strong> Aucun palier n'est franchi :<\/p>\n<ul>\n<li><strong>Guerre :<\/strong> aucun tir direct et délibéré entre forces de puissances nucléaires n'est constaté. Les drones abattus par la Roumanie au-dessus de son territoire relèvent de la défense aérienne et non d'un échange de feu, et l'article 4 n'a pas été invoqué.<\/li>\n<li><strong>France :<\/strong> pas d'« alerte attentat », pas d'état d'urgence (les couvre-feux reposent sur des arrêtés préfectoraux, et le Premier ministre écarte l'état d'urgence « pour l'heure »), pas de chute du gouvernement.<\/li>\n<\/ul>\n<p><strong>Sources.<\/strong> Les 84 sources mondiales et les 61 sources françaises ont été sollicitées. Le quota de recherche web de la session (200 requêtes, partagé entre sept agents) a été épuisé en fin de relevé, comme lors des relevés précédents. Le résultat de la revue Moody's n'était pas publié au moment du relevé.<\/p>\n<p><strong>Tableau.<\/strong> Le tableau ci-dessous résume les variations. Sévérité de 1 à 5 (5 = pire) ; ↑ = tendance à la hausse (aggravation), ↓ = à la baisse, = = stable.<\/p>\n<table>\n<thead>\n<tr>\n<th>Indicateur<\/th>\n<th>6 oct.<\/th>\n<th>23 oct.<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Seuil article 4/5 OTAN<\/td>\n<td>3 =<\/td>\n<td>4 ↑<\/td>\n<\/tr>\n<tr>\n<td>Diplomatie Iran<\/td>\n<td>3 ↑<\/td>\n<td>4 ↑<\/td>\n<\/tr>\n<tr>\n<td>Sabotage hybride<\/td>\n<td>4 ↑<\/td>\n<td>5 ↑<\/td>\n<\/tr>\n<tr>\n<td>VIX<\/td>\n<td>2 =<\/td>\n<td>3 ↑<\/td>\n<\/tr>\n<tr>\n<td>Gaz TTF<\/td>\n<td>4 ↑<\/td>\n<td>5 ↑<\/td>\n<\/tr>\n<tr>\n<td>Fret (Baltic Dry)<\/td>\n<td>4 ↓<\/td>\n<td>3 ↓<\/td>\n<\/tr>\n<tr>\n<td>France : notations souveraines<\/td>\n<td>3 =<\/td>\n<td>4 ↑<\/td>\n<\/tr>\n<tr>\n<td>France : ordre public, violences urbaines<\/td>\n<td>3 ↑<\/td>\n<td>5 ↑<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Monde<\/h2>\n<h3>Ukraine et seuil OTAN<\/h3>\n<p>La « trêve énergétique » annoncée par Donald Trump le 11 octobre a échoué : dès le 14, la Russie tire 39 missiles balistiques et plus de 120 drones, privant 600 000 foyers de courant (<a target=\"_blank\" rel=\"noopener\" href=\"https://kyivindependent.com/ostentatious-disrespect-zelensky-says-russia-defied-trumps-energy-ceasefire-with-massive-missile-strike/\">Kyiv Independent<\/a>), puis 580 drones dans la nuit suivante. Le 22, Kyiv subit 210 drones et 21 missiles (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.criticalthreats.org/analysis/russian-offensive-campaign-assessment-october-22-2026\">ISW, 22 oct.<\/a>). Au sol, la Russie a perdu 241 km² net depuis le 1er septembre. Le débordement en mer Noire (voir plus bas) fait passer le seuil article 4/5 de 3 à 4 ; les marchés restent impassibles (Metaculus Russie–OTAN 2027 : 4,2 %).<\/p>\n<h3>Diplomatie Ukraine<\/h3>\n<p>Le 21 octobre, Witkoff obtient de Poutine un accord de principe pour des pourparlers trilatéraux « après le 10 novembre », sans date ni lieu (<a target=\"_blank\" rel=\"noopener\" href=\"https://greekreporter.com/2026/10/21/ukraine-peace-talks-putin-witkoff/\">Greek Reporter<\/a>). Sévérité inchangée (4).<\/p>\n<h3>Iran et Golfe<\/h3>\n<p>Aucune avancée des négociations ce mois-ci (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.criticalthreats.org/analysis/iran-update-october-22-2026\">ISW, 22 oct.<\/a>). Trump exclut une frappe avant le 3 novembre et maintient le blocus, mais une opération postélectorale se prépare (voir <em>Nucléaire<\/em>) ; l'Iran a testé plus de 30 missiles le 11 octobre : la diplomatie Iran passe de 3 à 4. Les Houthis ont visé 20 fois l'aéroport de Riyad depuis le 1er octobre, puis le ministère de la Défense le 22 ; Taiz est encerclée (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.criticalthreats.org/analysis/iran-update-october-19-2026\">ISW, 19 oct.<\/a>).<\/p>\n<h3>Asie<\/h3>\n<p>La Corée du Nord a tiré deux missiles balistiques le 12 octobre (plus de 900 km) (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.koreatimes.co.kr/southkorea/defense/20261013/us-pacific-command-says-n-korea-fired-2-ballistic-missiles-reaffirms-defense-commitment\">Korea Times<\/a>). Autour de Taïwan, l'APL reste modérée, mais les garde-côtes chinois accentuent leur pression (244 navires en septembre). Washington et Pékin préparent la rencontre Xi–Trump de l'APEC à Shenzhen en novembre.<\/p>\n<h3>Afrique<\/h3>\n<p>Au Soudan, des frappes de drones font plus de 100 morts les 18 et 19 octobre (<a target=\"_blank\" rel=\"noopener\" href=\"https://citizen.digital/article/drone-strikes-across-sudan-kill-more-than-100-n392353\">AFP<\/a>). Au Mali, Kidal est reprise le 6 octobre, mais l'EIGS massacre au moins 48 civils près de Ménaka. En RDC, Joseph Kabila prend la tête du FRN, front politique du M23, et les combats gagnent Uvira (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.criticalthreats.org/briefs/congo-war-security-review\">Congo War Security Review<\/a>) : tendance en hausse.<\/p>\n<h3>Ormuz et Golfe : record d'attaques<\/h3>\n<p>L'OMI recense <strong>27 attaques<\/strong> contre des navires de commerce en octobre au 22, contre 22 en mars, pire mois depuis le début de la guerre (<a target=\"_blank\" rel=\"noopener\" href=\"https://news.usni.org/2026/10/22/october-marks-highest-number-of-strait-of-hormuz-attacks\">USNI, 22 oct.<\/a>). Le porte-conteneurs <em>GFS Pride<\/em> est coulé le 13 octobre, par un projectile iranien selon le CENTCOM, par une mine selon les Gardiens. Le 20, ceux-ci déclarent le détroit fermé ; le CENTCOM revendique pourtant environ 400 transits sur la semaine. IMF PortWatch ne voit que 4 transits AIS le 18 et 144 navires attendent (<a target=\"_blank\" rel=\"noopener\" href=\"https://straits.live/\">Straits.live<\/a>). L'Iran menace aussi sept câbles sous-marins du détroit. Deux groupes aéronavals américains restent en mer d'Arabie.<\/p>\n<h3>Espace aérien et mer Rouge<\/h3>\n<p>Les frappes houthies sur Riyad et Dammam ont fait annuler jusqu'à <strong>57 % des départs saoudiens le 11 octobre<\/strong> (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.khaleejtimes.com/business/over-one-third-of-saudi-arabia-flights-cancelled-on-monday-as-houthi-attacks-continue?amp=1\">Khaleej Times<\/a>). L'EASA a élargi son <a target=\"_blank\" rel=\"noopener\" href=\"https://www.easa.europa.eu/en/domains/air-operations/czibs/czib-2026-09-r1\">CZIB 2026-09-R1<\/a> jusqu'au 16 novembre ; Riyad a rouvert le 18. En mer Rouge, les Houthis frappent surtout la terre ferme ; aucune attaque de navire n'y est documentée depuis le 4 octobre.<\/p>\n<h3>Mer Noire et flanc est : la guerre des drones gagne les eaux de l'OTAN<\/h3>\n<p>Au moins huit navires ont été frappés dans les eaux roumaines et bulgares depuis le 5 octobre, dont le <em>Dignity<\/em>, coulé le 13, et le <em>Wine Trader<\/em>, touché près de Sulina (drones « d'origine russe » selon un responsable de l'OTAN) (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.news4jax.com/news/world/2026/10/15/drone-strike-and-fire-on-ship-in-romanian-waters-raise-fears-that-war-in-ukraine-is-spreading/\">AP<\/a>) : au moins 23 marins morts ou disparus. Le 17, des F-16 roumains abattent deux Geran ; la Roumanie compte 35 incursions en 2026, contre 9 en 2025 (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.stripes.com/theaters/europe/2026-10-19/romania-drones-nato-meeting-23196504.html\">Stars and Stripes<\/a>). Le Conseil de l'Atlantique Nord du 20 envoie avions de patrouille, radars et drones (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.aljazeera.com/amp/news/2026/10/20/nato-to-send-additional-patrol-planes-to-black-sea-after-drone-attacks\">Al Jazeera<\/a>), sans invocation de l'article 4 ni attribution officielle.<\/p>\n<h3>Hybride et câbles<\/h3>\n<p>Le 12 octobre, Andy Burnham attribue aux Gardiens le complot contre la RAF Fairford (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.expressandstar.com/uk-news/andy-burnham-raf-fairford-incident-almost-certainly-directed-by-iran-9283081\">Express &amp; Star<\/a>). Des stations Starlink utilisées par l'Ukraine sont visées en Bulgarie (10 oct.) et près de Vilnius (18 oct.) (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.thestar.com.my/news/world/2026/10/18/lithuania-says-attempted-starlink-arson-was-russia-linked-sabotage\">Reuters/The Star<\/a>), et Poutine aurait ordonné d'intensifier le sabotage (WSJ, 21 oct.). La Baltique est calme, mais le Conseil de l'UE étend le 9 octobre l'opération IRINI à la flotte fantôme.<\/p>\n<h3>Marchés : la France redevient l'épicentre, l'énergie flambe<\/h3>\n<p>Le fait majeur est la réouverture du spread OAT-Bund (voir <em>France<\/em>). Le Brent daté a culminé à <a target=\"_blank\" rel=\"noopener\" href=\"https://fred.stlouisfed.org/series/DCOILBRENTEU\">126,55 $ le 14 oct.<\/a> et revient vers <a target=\"_blank\" rel=\"noopener\" href=\"https://tradingeconomics.com/commodity/brent-crude-oil\">114 $ le 23<\/a>, contre 97,7 $ le 6. Le TTF grimpe à <a target=\"_blank\" rel=\"noopener\" href=\"https://tradingeconomics.com/commodity/eu-natural-gas\">~92 €/MWh<\/a> (+23 % sur un mois), stocks européens à 74,6 %, plus bas saisonnier depuis 2009 : sévérité 5. La vente des valeurs IA a porté le VIX à <a target=\"_blank\" rel=\"noopener\" href=\"https://fred.stlouisfed.org/series/VIXCLS\">19,99 le 16 oct.<\/a> avant un reflux à 16,68 : sévérité 3. Le spread high yield remonte à 3,27 % et l'or recule vers 4 011 $ (−6 % sur un mois). Fed et BCE devraient rester en pause les 28 et 29 octobre. Le <a target=\"_blank\" rel=\"noopener\" href=\"https://thenationalherald.com/imf-raises-its-forecast-for-world-growth-this-year-but-says-economies-will-slow-in-2027\">WEO du FMI<\/a> relève la croissance mondiale 2026 à 3,1 %. Le BDI recule à 2 693 (−21 %) : fret ramené à 3.<\/p>\n<h3>Nucléaire et alliances<\/h3>\n<p>Selon le <a target=\"_blank\" rel=\"noopener\" href=\"https://www.timesofisrael.com/netanyahu-planned-attack-on-iran-earlier-this-month-but-trump-opposed-it-report/\">Financial Times (21 oct.)<\/a>, Israël était prêt à frapper des sites nucléaires et énergétiques iraniens vers le 10 octobre ; Trump a différé l'opération au-delà du 3 novembre. L'AIEA reste sans accès. L'exercice <a target=\"_blank\" rel=\"noopener\" href=\"https://www.nato.int/en/news-and-events/articles/news/2026/10/08/nato-holds-annual-nuclear-exercise-steadfast-noon\">Steadfast Noon<\/a> débute le 13 octobre, sans changement de posture russe observé. À Tallinn, Rutte ne voit « aucune menace imminente » ; les indicateurs de retrait américain sont maintenus faute de données.<\/p>\n<h2>France<\/h2>\n<p><strong>Postures officielles au 23 octobre :<\/strong> Vigipirate « vigilance renforcée » (page SGDSN non relue) ; orange vent pour 15 départements (tempête Austen) ; CERT-FR : 4 alertes ouvertes contre 3 ; état d'urgence non déclaré ; Moody's Aa3 négative (revue du 23 non publiée), S&amp;P le 27 novembre.<\/p>\n<h3>Composante intérieure : gouvernement et budget<\/h3>\n<p>La séquence budgétaire se double d'une crise d'ordre public et d'une tension obligataire inédite depuis la crise des dettes souveraines. L'examen du PLF 2027, ouvert le 13 octobre, a tourné au détricotage : au 19, 15 des 58 articles de la première partie étaient examinés et plus de 2 600 amendements restaient en discussion. D. Amiel chiffre à <strong>10 Md€<\/strong> la dégradation du solde votée par les oppositions (<a target=\"_blank\" rel=\"noopener\" href=\"https://entrevue.fr/politique/budget-2027-apres-avoir-detricote-le-projet-de-lecornu-les-deputes/\">Entrevue, 20/10<\/a>). Le vote sur les recettes est <strong>reporté au 3 novembre<\/strong>, celui de l'ensemble reste fixé au 17. Ni 49.3 ni ordonnances ne sont décidés.<\/p>\n<h3>Marchés et notation<\/h3>\n<p>Le spread OAT-Bund 10 ans passe de <strong>127 pb le 6 octobre à 174,6 pb le 22<\/strong> (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.ideal-investisseur.fr/en/markets/oat-bund-spread.html\">Ideal-Investisseur<\/a>) ; le 21, l'OAT franchit 5 % pour la première fois depuis 2002 (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.boursedirect.fr/fr/actualites/categorie/divers/taux-l-oat-a-10-ans-a-atteint-la-barre-des-5-boursier-a6b4fe8ae17d5a6dabdc59e0e9498d1dca24e4c7\">Bourse Direct<\/a>). Le CDS 5 ans touche 80,8 pb le 12, plus haut depuis 2013, et la France paie davantage que l'Italie. Lagarde a renvoyé Paris à sa politique budgétaire (14 oct.) et l'IPT reste inutilisé. La plupart des économistes anticipent une baisse de Moody's à A1 (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.boursorama.com/bourse/actualites/dette-francaise-l-agence-moody-s-devrait-degrader-la-note-de-la-france-vendredi-estime-la-plupart-des-economistes-2f9bf4142e1dd174c99a6f728c1c7129\">Boursorama<\/a>) : notations passées de 3 à 4.<\/p>\n<h3>Mobilisations et ordre public<\/h3>\n<p>La journée du <strong>17 octobre<\/strong> a dégénéré en pillages jusqu'au 18 (bilan en synthèse) : un manifestant mort d'un malaise, au moins 3 000 commerces touchés, la mairie de Limoges incendiée, environ 1,1 Md€ de dégâts (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.ifrap.org/etat-et-collectivites/violences-des-17-et-18-octobre-2026-une-facture-qui-approche-le-milliard-deuros\">IFRAP<\/a>). Les couvre-feux courent depuis le 19 (Paris jusqu'au 26). S. Lecornu écarte l'état d'urgence, que B. Retailleau réclame (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.publicsenat.fr/actualites/politique/violences-du-17-octobre-pourquoi-letat-durgence-est-ecarte-par-le-gouvernement\">Public Sénat<\/a>). Seules les manifestations syndicales sont autorisées le 24 octobre, et l'intersyndicale maintient la <strong>grève du 5 novembre<\/strong> (<a target=\"_blank\" rel=\"noopener\" href=\"https://basta.media/Appel-greve-generale-5-novembre-manifestation-24-octobre-intersyndicale-refuse-de-se-laisser-intimider\">Basta!<\/a>). L'indicateur passe de 3 à 5.<\/p>\n<h3>Conjoncture, opinion et outre-mer<\/h3>\n<p>L'inflation de septembre est révisée à <strong>3,1 %<\/strong> (gazole +44,1 %) (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.boursorama.com/actualite-economique/actualites/france-l-inflation-a-3-1-sur-un-an-en-septembre-au-plus-haut-depuis-janvier-2024-55fa6c703d953e33b3a7503c2c13f318\">Boursorama/AFP<\/a>). E. Macron tombe à 17 % de satisfaits (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.ifopgroup.com/article/indices-de-popularite-barometre-ifop-opinion-octobre-2026/\">Ifop<\/a>) ; 71 % des sondés veulent l'état d'urgence (Elabe) ; M. Le Pen atteint 36 % (OpinionWay). En Martinique, la mobilisation contre la vie chère reprend le 19 octobre. À Marseille, les narchomicides s'effondrent : 5 en 2026 contre 49 en 2023.<\/p>\n<h3>Alertes intérieures<\/h3>\n<p>Le <strong>12 octobre<\/strong>, un collégien de 14 ans ouvre le feu à Aubagne, blessant deux adultes ; le PNAT se saisit le <strong>13<\/strong> pour « tentatives d'assassinats en relation avec une entreprise terroriste ». C'est un passage à l'acte et non un projet déjoué (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.brut.media/fr/articles/fusillade-au-college-d-aubagne-le-parquet-antiterroriste-se-saisit-de-l-enquete\">Brut<\/a>). Le CERT-FR ouvre ALE-012, ALE-013 (Ivanti) et ALE-014 (PHP) (<a target=\"_blank\" rel=\"noopener\" href=\"https://cert.cyber.gouv.fr/alerte\">CERT-FR<\/a>), et des fuites touchent CAF/Vacaf, Ined et Icantec. La tempête Austen apporte des rafales jusqu'à 140 km/h le 23 (<a target=\"_blank\" rel=\"noopener\" href=\"https://vigilance.meteofrance.fr/fr/vigilance-accessible\">Météo-France<\/a>).<\/p>\n<h3>Extérieur<\/h3>\n<p>Le déploiement défensif à Yanbu entre en mise en œuvre (15/10) alors que l'article 35 est débattu (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.atalayar.com/en/articulo/politics/france-assesses-military-deployment-at-the-saudi-terminal-in-yanbu-amid-parliamentary-doubts-and-the-houthi-threat/20261013093000229779.html\">Atalayar<\/a>) ; un missile houthi y est intercepté le 16. Aucune perte française. Des drones non identifiés ont survolé la base de Toulon (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.opex360.com/2026/10/21/des-drones-non-autorises-ont-ete-detectes-aux-abords-et-au-dessus-de-sites-militaires-de-la-region-de-toulon/\">Opex360<\/a>). Après le tir de M51.3 du 6 octobre, le Kremlin parle d'« impasse » sans menace explicite. La DGA commande 4 SAMP/T NG et un accord Rafale F5 est signé avec les EAU (21/10). Christophe Gleizes reste détenu, et sa famille dénonce un durcissement algérien (15/10).<\/p>\n<h2>Socle structurel<\/h2>\n<p><strong>Monde : aucune nouvelle édition de niveau A du 6 au 23 octobre.<\/strong> Les neuf entrées sont reconduites sans changement de sévérité :<\/p>\n<ul>\n<li>GPI 4 ↑, SIPRI 5 ↑, Horloge 5 ↑, MSC 4 ↑, IISS 4 ↑ ;<\/li>\n<li>ODNI 4 =, WEF 4 =, ACLED 4 = ;<\/li>\n<li>prévisions de long terme Metaculus 3 = : troisième guerre mondiale avant 2050 à 22 %, prochaine guerre entre grandes puissances en juillet 2035 (lecture du 23 oct.).<\/li>\n<\/ul>\n<p>Le calendrier à surveiller :<\/p>\n<ul>\n<li>l'<strong>Ecological Threat Report 2026<\/strong> de l'IEP, toujours ni paru ni daté (l'édition 2025 était sortie le 29 octobre 2025), donc probable d'ici la mi-novembre ;<\/li>\n<li>le <strong>RiskMap 2027<\/strong> de Control Risks, annoncé pour le 10 novembre ;<\/li>\n<li>l'<strong>Armed Conflict Survey<\/strong> de l'IISS, en décembre ;<\/li>\n<li>l'<strong>ACLED Conflict Index<\/strong>, en décembre.<\/li>\n<\/ul>\n<p>Le <strong>Strategic Survey 2026<\/strong> de l'IISS n'est ni paru ni annoncé.<\/p>\n<p><strong>France : aucun indice annuel republié dans la fenêtre.<\/strong> L'enquête Ipsos <strong>« Fractures françaises » 2026<\/strong>, attendue vers le 20 octobre, n'est pas parue ou n'a pas été repérée au 23 : l'entrée garde les chiffres de 2025 (90 % des Français jugent que « la France est en déclin »). La seule entrée actualisée est la LPM et le PLF Défense, qui reste à 3 :<\/p>\n<ul>\n<li>audition du chef d'état-major des armées à l'Assemblée le 8 octobre ;<\/li>\n<li>avis de la commission de la défense n° 3394 le 22 octobre ;<\/li>\n<li>crédits de la Défense en hausse d'environ 6,5 Md€.<\/li>\n<\/ul>\n<p>Le HCFP, entendu au Sénat le 7 octobre, juge « optimiste » la croissance de 1 % retenue pour 2027 et anticipe une dette proche de 122 % du PIB, ce qui fait peser un risque sur l'exécution de la LPM. L'évaluation des risques du système financier (ERS) de la Banque de France est attendue en décembre.<\/p>\n<h2>Publications de la semaine (niveaux A et C)<\/h2>\n<p>Sélection parmi 57 publications mondiales et 31 françaises relevées du 6 au 23 octobre (liste complète dans l'onglet Sources).<\/p>\n<ul>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.ifri.org/fr/briefings/lia-hors-de-sa-boite-apocalypse-now\">IFRI — L'IA hors de sa boîte : apocalypse now? (22/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://ecfr.eu/article/trumps-russia-deals-are-not-his-to-make/\">ECFR — Trump's Russia deals are not his to make (oct. 2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.swp-berlin.org/en/publication/sea-lanes-at-risk-maritime-order-under-threat\">SWP — Comment 41/2026, Sea Lanes at Risk, Maritime Order under Threat (15/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.chathamhouse.org/2026/10/yemen-war-not-just-saudi-arabias-problem-its-gulfs-too\">Chatham House — The Yemen war is not just Saudi Arabia's problem. It's the Gulf's too (14/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.chathamhouse.org/2026/10/russias-kaliningrad-threats-show-value-baltic-preparedness\">Chatham House — Russia's Kaliningrad threats show the value of Baltic preparedness (07/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.csis.org/analysis/art-swarming\">CSIS — The Art of Swarming (rapport, 14/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://carnegieendowment.org/europe/strategic-europe/2026/10/containing-escalation-in-the-black-sea\">Carnegie — Containing Escalation in the Black Sea (oct. 2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.rand.org/pubs/research_reports/RRA4027-1.html\">RAND — Winning the Undersea Knife Fight (20/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.armscontrol.org/act/2026-10/news/iaea-reports-iran-un-security-council\">Arms Control Association — Arms Control Today oct. 2026 : IAEA Reports Iran to UN Security Council<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.belfercenter.org/research-analysis/countering-drone-proliferation-russias-war-against-ukraine-implications-arms\">Belfer Center — Countering Drone Proliferation from Russia's War Against Ukraine (21/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.controlrisks.com/riskmap\">Control Risks — RiskMap 2027 annoncé pour le 10/11/2026 (annonce consultée le 23/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.hcfp.fr/sites/default/files/2026-10/Avis%20HCFP%202026-5%20-%20PLF-PLFSS%202027.pdf\">HCFP — Avis n° HCFP-2026-5 relatif aux projets de lois de finances et de financement de la sécurité sociale pour 2027 (25/09/2026, présenté au Sénat le 07/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.assemblee-nationale.fr/dyn/17/dossiers/PLF_2027\">Assemblée nationale, commission de la défense — Avis n° 3394 sur le PLF 2027 (22/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.strategie-plan.gouv.fr/publications\">Haut-commissariat à la Stratégie et au Plan — France 2035, France 2050. Comment vivrons-nous en France demain ? (12/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.ofce.fr/\">OFCE — Budget 2027 : un effort inégalement réparti entre les ménages, P. Madec (16/10/2026)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.imf.org/en/Publications/WEO\">FMI — World Economic Outlook, octobre 2026 (2026-10-13)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.imf.org/en/publications/gfsr/issues/2026/10/13/global-financial-stability-report-october-2026\">FMI — Global Financial Stability Report, octobre 2026 : Resilience, Risk, and Transformation (2026-10-13)<\/a><\/li>\n<li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.bis.org/\">BRI — BIS Bulletin n° 138, Chokepoint disruptions and the macroeconomy (2026-10-15)<\/a><\/li>\n<\/ul>";
const TABS = [
 ['synthese','Synthèse'],['methode','Méthode'],['geopolitique','Géopolitique'],['aerien_maritime','Aérien & maritime'],['financier','Financier'],
 ['nucleaire_alliances','Nucléaire & alliances'],['hybride_diplomatie','Hybride & diplomatie'],['structurel','Socle structurel'],['france','🇫🇷 France'],['historique','Historique'],['rapport','Rapport'],['sources','Sources'],['lacunes','Lacunes & signaux']
];
const DOM_LABEL={geopolitique:'Géopolitique / conflits',financier:'Économique & financier',maritime:'Maritime',nucleaire:'Nucléaire & maîtrise des armements',hybride:'Hybride & cyber',aerien:'Aérien',alliances:'Alliances & mobilisation',diplomatie:'Diplomatie & prévision (contre-indicateurs)'};
const SEVC=['','var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'], SEVB=['','var(--s1-bg)','var(--s2-bg)','var(--s3-bg)','var(--s4-bg)','var(--s5-bg)'];
const LVLC=n=>SEVC[6-n], LVLB=n=>SEVB[6-n];
const SEV_LABEL=['','Calme','Faible','Modéré','Élevé','Critique'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=x=>x.toFixed(2).replace('.',',');

function gauge(key,name,levels){
  const s=D.scores[key], n=s.niveau, cont=s.niveau_continu;
  let sub = key==='stabilite'
    ? `Valeur continue <b>${f2(cont)}</b> / 5 — couche conjoncturelle ${f2(s.couche_conjoncturelle)} (70 %) · socle structurel ${f2(s.couche_structurelle)} (30 %), en sévérité. Échelle type DEFCON : 5 = stable, 1 = effondrement.`
    : `Valeur calculée <b>${f2(cont)}</b> / 5 (conjoncturel ${f2(s.couche_conjoncturelle)} · structurel ${f2(s.couche_structurelle)}) → niveau brut ${s.niveau_calcule_brut}, <b>relevé au palier ${s.plancher_qualitatif}</b> par la règle qualitative (pas d'échange de feu direct et assumé entre puissances nucléaires, pas d'article 5). Échelle : 5 = risque minimal, 1 = guerre mondiale imminente.`;
  return `<section class="gauge" style="--c:${LVLC(n)}">
    <div class="big" style="color:${LVLC(n)}">${n}</div>
    <div class="name">${name}</div>
    <div><span class="lvl" style="background:${LVLB(n)};color:${LVLC(n)}">● Niveau ${n} — ${esc(s.libelle)}</span></div>
