P.synthese.chart=()=>lineChart($('#ch-main'),[{k:'stabilite_continu',l:'Stabilité',c:'var(--s1)'},{k:'guerre_continu',l:'Guerre',c:'var(--s2)'},{k:'france_continu',l:'France',c:'var(--s3)'}],{aria:'Trajectoire des trois indices',h:200});

P.carte=()=>{
  const all=spotsAll(),n5=all.filter(s=>s.x.severite>=5),nuc5=n5.filter(s=>s.x.puissance_nucleaire).length,up=all.filter(s=>s.x.tendance==='hausse').length,down=all.filter(s=>s.x.tendance==='baisse').length;
  const mar5=n5.filter(s=>s.x.domaine==='maritime').map(s=>s.x.libelle.split(/\s[—–-]\s|\s\(/)[0]);
  return `${crumbs([['Synthèse','synthese'],['Carte des tensions','carte']])}
   <section class="sheet pagehead"><div class="phi">${picto('carte')}<div><div class="lbl">${all.length} foyers localisés · relevé du ${fdate(dateRel)}</div><h1>Carte des tensions</h1><p>Chaque foyer est un indicateur du modèle placé sur la carte et coloré par sa sévérité. Un cercle extérieur signale une aggravation depuis le relevé précédent. Les indicateurs sans localisation (marchés, diplomatie, maîtrise des armements) n'y figurent pas.</p></div></div></section>
   <section class="sheet" id="fullmap" style="margin-top:16px">
    <div class="maphead" style="padding:12px 16px;border-bottom:1px solid var(--rule);margin:0">${mapChips()}<div class="seg" role="group" aria-label="Lecture"><button type="button" data-lens="sev" aria-pressed="true">Sévérité</button><button type="button" data-lens="tend" aria-pressed="false">Tendance</button><button type="button" data-lens="nuc" aria-pressed="false">Puissances nucléaires</button></div></div>
    <div class="mapcard" style="margin:0"><div class="m"><div class="map"></div><div class="mleg"></div><div class="mdet" aria-live="polite" style="padding:14px 0 0;border-top:1px solid var(--rule);margin-top:12px"></div></div><div class="mlist" aria-label="Foyers par sévérité"></div></div>
   </section>
   <div class="mstats"><section class="card"><b style="color:var(--sev5)">${n5.length}</b>foyers au niveau critique (5/5), dont ${nuc5} impliquant une puissance nucléaire</section><section class="card"><b>${up}</b>foyers en aggravation depuis le ${prev?fdate(prev.date):'relevé précédent'} ; ${down} en apaisement</section><section class="card"><b>${mar5.length}</b>foyers maritimes à 5/5${mar5.length?' : '+esc(mar5.join(', ')):''}</section></div>`;
};
P.carte.after=()=>mountMap($('#fullmap'));

P.monde=()=>{
  const st=S.stabilite,gu=S.guerre,sec=sectionOf('monde');
  const nh=D.indicateurs.filter(x=>x.tendance==='hausse').length,nb=D.indicateurs.filter(x=>x.tendance==='baisse').length;
  return `<div class="l-side">${sideNav(sec,'monde')}<div>
   ${crumbs([['Synthèse','synthese'],['Monde','monde']])}
   <section class="sheet pagehead"><div><div class="lbl">Vue d’ensemble · ${D.indicateurs.length} indicateurs, 8 domaines</div><h1>Monde</h1><p>${esc(N.lecture_monde||'')}</p></div>
    <div class="kpis"><div class="kpi"><div class="v" style="color:${lvlVar(st.niveau)}">${st.niveau} · ${fr(st.niveau_continu)}</div><div class="k">stabilité</div></div><div class="kpi"><div class="v" style="color:${lvlVar(gu.niveau)}">${gu.niveau} · ${fr(gu.niveau_continu)}</div><div class="k">guerre (calculé ${gu.niveau_calcule_brut})</div></div><div class="kpi"><div class="v">${D.stats.n5}</div><div class="k">indicateurs à 5/5</div></div><div class="kpi"><div class="v">${nh} ↑ · ${nb} ↓</div><div class="k">tendances</div></div></div></section>
   <div class="g2" style="margin-top:16px">
    ${card('<span>Sévérité par domaine</span><span>stabilité / guerre</span>',`<div class="dbars">${domOrder.map(k=>{const v=st.domaines[k],w=gu.domaines[k];return `<span><a href="#monde-${k}">${esc(DOM[k])}</a><small>poids ${Math.round(st.poids[k]*100)} % / ${Math.round(gu.poids[k]*100)} %</small></span><span class="tk" style="--c:${sevVar(v)}"><b style="width:${(v-1)/4*100}%"></b><em style="left:calc(${(w-1)/4*100}% - 1px)"></em></span><span class="dv">${fr(v)} <small>/ ${fr(w)}</small></span>`;}).join('')}<span class="ax5"><span>1 calme</span><span>3</span><span>5 critique</span></span></div><p class="small" style="margin:12px 0 0">Barre : score pour la stabilité. Trait : score pour l’indice guerre, où les sujets impliquant une puissance nucléaire pèsent 1,5 fois plus.</p>`)}
    ${card('<span>Carte des tensions</span><span>1 case = 1 indicateur</span>',heat(domOrder.map(k=>({l:DOM[k],href:'monde-'+k,items:D.indicateurs.filter(x=>x.domaine===k).sort((a,b)=>b.severite_ajustee-a.severite_ajustee)}))))}
   </div>
   ${card('<span>Trajectoire des indices mondiaux</span>','<div class="chart" id="ch-monde"></div>','style="margin-top:16px"')}
   <p class="note">${esc(N.palier_guerre||'')}</p>
  </div></div>`;
};
P.monde.after=()=>lineChart($('#ch-monde'),[{k:'stabilite_continu',l:'Stabilité',c:'var(--s1)'},{k:'guerre_continu',l:'Guerre',c:'var(--s2)'}],{aria:'Trajectoire des indices mondiaux',h:220});
function pageDomaine(k){
  const st=S.stabilite,gu=S.guerre,items=D.indicateurs.filter(x=>x.domaine===k);
  const nh=items.filter(x=>x.tendance==='hausse').length,nb=items.filter(x=>x.tendance==='baisse').length;
  const rank=domOrder.indexOf(k)+1;
  return `<div class="l-side">${sideNav(sectionOf('monde'),'monde-'+k)}<div>
   ${crumbs([['Synthèse','synthese'],['Monde','monde'],[DOM[k],'monde-'+k]])}
   <section class="sheet pagehead"><div class="phi">${picto(k)}<div><div class="lbl">Domaine · ${items.length} indicateurs · ${rank}${rank===1?'er':'e'} sur 8 par sévérité</div><h1>${esc(DOM[k])}</h1><p>${esc(DOM_TXT[k])}</p></div></div>
    <div class="kpis"><div class="kpi"><div class="v" style="color:${sevVar(st.domaines[k])}">${fr(st.domaines[k])}</div><div class="k">score stabilité</div></div><div class="kpi"><div class="v" style="color:${sevVar(gu.domaines[k])}">${fr(gu.domaines[k])}</div><div class="k">score guerre</div></div><div class="kpi"><div class="v">${Math.round(st.poids[k]*100)} % · ${Math.round(gu.poids[k]*100)} %</div><div class="k">poids stab. · guerre</div></div><div class="kpi"><div class="v">${nh} ↑ · ${nb} ↓</div><div class="k">tendances</div></div></div></section>
   ${fichesBlock(items)}</div></div>`;
}
function pageSocle(scope){
  const isM=scope==='monde',rows=isM?D.structurels:F.structurels;
  return `<div class="l-side">${sideNav(sectionOf(scope),scope+'-socle')}<div>
   ${crumbs([['Synthèse','synthese'],[isM?'Monde':'France',scope],['Socle structurel',scope+'-socle']])}
   <section class="sheet pagehead"><div><div class="lbl">Indices annuels de référence · 30 % de l’indice</div><h1>Socle structurel ${isM?'mondial':'France'}</h1><p>Ces indices ne changent qu’à la parution d’une nouvelle édition. Ils stabilisent la série et donnent leur place aux instituts de référence, qui ne publient pas chaque semaine.</p></div>
    <div class="kpis">${isM?`<div class="kpi"><div class="v">${fr(S.stabilite.couche_structurelle)}</div><div class="k">couche stabilité</div></div><div class="kpi"><div class="v">${fr(S.guerre.couche_structurelle)}</div><div class="k">couche guerre</div></div>`:`<div class="kpi"><div class="v">${fr(F.couche_structurelle)}</div><div class="k">couche structurelle</div></div><div class="kpi"><div class="v">${rows.length}</div><div class="k">indices</div></div>`}</div></section>
   <div class="tw" style="margin-top:16px"><table class="t"><thead><tr><th>Indice</th><th>Sév.</th><th>Tendance</th><th>Pertinence</th><th>Édition</th><th>Prochaine édition</th></tr></thead><tbody>${rows.map(x=>{const t=TEND[x.tendance]||TEND.stable;return `<tr><td><b>${esc(x.libelle)}</b><div class="small">${esc(x.valeur)}</div></td><td><span class="sevb" style="--c:${sevVar(x.severite)}">${x.severite}</span></td><td><span class="chip ${t.c}">${t.t}</span></td><td class="num">${isM?`${fr(x.poids_stab,1)} / ${fr(x.poids_guerre,1)}`:fr(x.poids,1)}</td><td class="num">${fdate(x.date_donnee)}</td><td>${esc(x.prochaine_edition||'—')}</td></tr>`;}).join('')}</tbody></table></div></div></div>`;

P['france-postures']=()=>{

};

const cbFetch=()=>{if(cbLive||!/^https?:/.test(location.protocol))return;fetch(CB_URL+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.national){CB=j;cbLive=true;if(curId==='france-carburant')route();}}).catch(()=>{});};
const eur=(v,n=3)=>v==null?'—':Number(v).toFixed(n).replace('.',',');
const pct=v=>v==null?'—':String(v).replace('.',',')+' %';
const rCol=v=>v==null?'var(--rule)':v>=8?'var(--sev5)':v>=4?'var(--sev4)':v>=2?'var(--sev3)':v>=1?'var(--rule-2)':'var(--map-dot)';
const hhmm=iso=>{const d=new Date(iso);return isNaN(d)?'':d.toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'});};
let FRDOTS=null;
function frMap(vals,sel){
  if(!FRDOTS){FRDOTS={};for(const part of FRM.p.split('|')){const [d,pts]=part.split(':');FRDOTS[d]=pts.split(' ').map(p=>{const [x,y]=p.split(',');return `M${x-4.3},${y}a4.3,4.3 0 1,0 8.6,0a4.3,4.3 0 1,0 -8.6,0`;}).join('');}}
  let s='';for(const d in FRDOTS)s+=`<path class="fd${d===sel?' on':''}" data-dep="${d}" d="${FRDOTS[d]}" fill="${rCol(vals[d])}"><title>${esc(FRM.n[d])} (${d}) · ${pct(vals[d])}</title></path>`;
  if(sel&&FRM.c[sel]){const [x,y]=FRM.c[sel];s+=`<g class="fpin"><rect x="${x-52}" y="${y-76}" width="104" height="46" rx="5"/><text x="${x}" y="${y-44}" text-anchor="middle">${pct(vals[sel])}</text></g>`;}
  return `<svg class="frmap" viewBox="-6 -6 ${FRM.w+6} ${FRM.h+6}" role="img" aria-label="Carte des ruptures de ${esc(CBN[cbFuel])} par département">${s}</svg>`;
}
function cbSpark(c){const sr=(CB.serie||[]).filter(e=>e[c]&&e[c][0]).slice(-30);if(sr.length<2)return '';const v=sr.map(e=>e[c][0]),mn=Math.min(...v),mx=Math.max(...v),r=Math.max(mx-mn,0.06),X=i=>3+294*i/(v.length-1),Y=x=>27-23*(x-mn)/r;return `<svg class="spark" viewBox="0 0 300 30" preserveAspectRatio="none" aria-hidden="true"><path d="${v.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(x).toFixed(1)).join('')}" fill="none" stroke="var(--navy-2)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;}
function cbPrix(){
  const sr=(CB.serie||[]).slice(-90);const ks=[['Gazole','var(--s1)'],['E10','var(--s2)']];
  if(sr.length<2)return `<p class="small" style="margin:0">La courbe s’affichera après quelques jours de relevés (un point par jour).</p>`;
  const all=sr.flatMap(e=>ks.map(([k])=>e[k]&&e[k][0]).filter(Boolean));const mn=Math.floor((Math.min(...all)-0.02)*20)/20,mx=Math.ceil((Math.max(...all)+0.02)*20)/20;
  const W=innerWidth<640?380:440,Hh=200,X=i=>44+(W-54)*i/(sr.length-1),Y=v=>Hh-26-(Hh-40)*(v-mn)/(mx-mn);
  let g='';for(let v=mn;v<=mx+1e-9;v+=0.05){g+=`<line x1="44" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="38" y="${Y(v)+4}" text-anchor="end" class="ax">${eur(v,2)}</text>`;}
  const ticks=[0,Math.floor((sr.length-1)/2),sr.length-1];for(const i of ticks)g+=`<text x="${X(i)}" y="${Hh-6}" text-anchor="${i===0?'start':i===sr.length-1?'end':'middle'}" class="ax">${fdate(sr[i].d,false)}</text>`;
  for(const [k,c] of ks){const pts=sr.map((e,i)=>e[k]&&e[k][0]?[X(i),Y(e[k][0])]:null).filter(Boolean);if(pts.length>1)g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="2.4" vector-effect="non-scaling-stroke"/>`;}
  return `<svg class="cbch" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Prix moyens du gazole et du SP95-E10">${g}</svg><div class="cbleg"><span><i style="background:var(--s1)"></i>Gazole</span><span><i style="background:var(--s2)"></i>SP95-E10</span><span class="small">€ / litre · moyenne nationale</span></div>`;
}
function cbFan(){
  const pj=CBX.projection||{},sc=pj.scenarios||[];const base=CB.national.Gazole&&CB.national.Gazole.prix;
  const sr=(CB.serie||[]).filter(e=>e.Gazole&&e.Gazole[0]).slice(-56);
  if(!sc.length||!base)return '';
  const obs=sr.length?sr.map(e=>e.Gazole[0]):[base];const nObs=obs.length,nP=28,N=nObs+nP;
  const ext=[...obs,...sc.flatMap(s=>s.gazole||[])];const mn=Math.floor((Math.min(...ext)-0.03)*20)/20,mx=Math.ceil((Math.max(...ext)+0.03)*20)/20;
  const sm=innerWidth<640,W=sm?380:860,Hh=sm?240:280,X=i=>44+(W-56)*i/Math.max(1,N-1),Y=v=>Hh-26-(Hh-40)*(v-mn)/(mx-mn);
  let g='';for(let v=mn;v<=mx+1e-9;v+=0.05)g+=`<line x1="44" x2="${W-12}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="38" y="${Y(v)+4}" text-anchor="end" class="ax">${eur(v,2)}</text>`;
  const x0=X(nObs-1),x1=X(N-1);
  for(const s of [...sc].sort((a,b)=>(b.proba||0)-(a.proba||0)).reverse()){const [lo,hi]=s.gazole||[];if(lo==null||hi==null)continue;
    g+=`<path d="M${x0},${Y(base)} L${x1},${Y(hi)} L${x1},${Y(lo)}Z" fill="${sevVar(s.sev||3)}" opacity="${s.sev===3?.32:.2}"/>`;}
  g+=`<line x1="${x0}" x2="${x0}" y1="12" y2="${Hh-26}" stroke="var(--ink)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/><text x="${x0+6}" y="20" class="ax" style="font-weight:700;fill:var(--ink)">AUJOURD’HUI</text><text x="${x1}" y="${Hh-6}" text-anchor="end" class="ax">+4 sem.</text>`;
  if(nObs>1)g+=`<text x="44" y="${Hh-6}" class="ax">${fdate(sr[0].d,false)}</text><path d="${obs.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join('')}" fill="none" stroke="var(--navy-2)" stroke-width="2.6" vector-effect="non-scaling-stroke"/>`;
  g+=`<circle cx="${x0}" cy="${Y(base)}" r="4" fill="var(--navy-2)"/>`;
  return `<svg class="cbfan" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Projection du prix du gazole à 4 semaines">${g}</svg><div class="cbleg"><span><i style="background:var(--navy-2)"></i>Relevé</span>${sc.map(s=>`<span><i style="background:${sevVar(s.sev||3)};opacity:.55"></i>${esc(s.nom)}</span>`).join('')}</div>`;
}

function noteSpy(){
  const doc=$('#note-doc');if(!doc)return;
  const hs=[...doc.querySelectorAll('.prose h2,.prose h3')];
  const r=doc.getBoundingClientRect(),vh=innerHeight;
  const pct=Math.max(0,Math.min(1,(vh*0.3-r.top)/(r.height-vh*0.5)));

P.methode=()=>{const ws=S.stabilite.poids,wg=S.guerre.poids,se=D.sensibilite,sf=F.sensibilite;
 return `<div class="l-side">${sideNav(sectionOf('sources'),'methode')}<div>
   ${crumbs([['Synthèse','synthese'],['Sources & méthode','sources'],['Méthode du modèle','methode']])}
   <article class="sheet doc"><div class="lbl">Modèle ${esc(D.version_modele||'v3')} · figé pour la comparabilité de la série</div><h1>Méthode du modèle</h1>
   <p class="para">Le modèle s’inspire des indices composites de référence (Global Peace Index, ACLED) et du DEFCON. Chaque indicateur reçoit une sévérité de 1 (calme) à 5 (critique), pondérée par la cotation de sa source. Le niveau final se lit de 5 (calme) à 1 (critique).</p>
   <h3 class="s">Calcul</h3><pre class="formula">sévérité_ajustée = borne[1;5](sévérité + tendance)     aggravation +0,25 · stable 0 · apaisement −0,25
cotation         = meilleur rang des sources citées : officiel 1,0 · institut 0,9 · presse 0,8 · secondaire 0,6 · lacune 0,5
                   (donnée de plus de 30 jours : un cran de moins)
MONDE   coef = cotation × 1,5 si puissance nucléaire (indice guerre seulement)
        score_domaine = Σ(sév_aj × coef) / Σ(coef) ;  conjoncturel = Σ poids_domaine × score_domaine
FRANCE  coef = cotation × 1,5 si systémique
        conjoncturel = 0,40 × intérieur + 0,30 × extérieur + 0,30 × alertes
SOCLE   structurel = Σ(sév_aj × pertinence × cotation) / Σ(pertinence × cotation)
composite = 0,70 × conjoncturel + 0,30 × structurel ;  niveau_continu = 6 − composite ;  niveau = arrondi</pre>
   <h3 class="s">Poids des domaines</h3><div class="tw"><table class="t"><thead><tr><th>Domaine</th><th>Stabilité</th><th>Guerre</th><th>Contenu</th></tr></thead><tbody>${Object.keys(DOM).map(k=>`<tr><td><a href="#monde-${k}">${DOM[k]}</a></td><td class="num">${fr(ws[k])}</td><td class="num">${fr(wg[k])}</td><td>${DOM_TXT[k]}</td></tr>`).join('')}</tbody></table></div>
   <h3 class="s">Paliers qualitatifs</h3>
   <p class="para"><b>Guerre :</b> sous 3 seulement si des forces de puissances nucléaires (ou de leurs alliances) échangent des tirs directs et délibérés, ou si l’article 5 est invoqué ; sous 2 seulement en cas de guerre ouverte et soutenue entre au moins deux puissances nucléaires ou blocs.</p>
   <p class="para"><b>France :</b> sous 3 seulement en cas de Vigipirate « alerte attentat », d’état d’urgence déclaré (même local) ou de chute du gouvernement sans successeur cumulée à une dégradation de note ; sous 2 seulement en cas d’état d’urgence national, d’attaque armée sur le territoire ou de mobilisation.</p>
   <h3 class="s">Robustesse du résultat</h3><div class="tw"><table class="t"><thead><tr><th>Variante</th><th>Stabilité</th><th>Guerre</th><th>France</th></tr></thead><tbody>
    <tr><td><b>Modèle retenu</b></td><td class="num">${fr(S.stabilite.niveau_continu)}</td><td class="num">${fr(S.guerre.niveau_continu)}</td><td class="num">${fr(F.niveau_continu)}</td></tr>
    <tr><td>Poids égaux</td><td class="num">${fr(se.stabilite.poids_egaux)}</td><td class="num">${fr(se.guerre.poids_egaux)}</td><td class="num">${fr(sf.poids_egaux)}</td></tr>
    <tr><td>Sans ajustement de tendance</td><td class="num">${fr(se.stabilite.sans_tendance)}</td><td class="num">${fr(se.guerre.sans_tendance)}</td><td class="num">${fr(sf.sans_tendance)}</td></tr>
    <tr><td>Sans coefficient nucléaire / systémique</td><td class="num">—</td><td class="num">${fr(se.guerre.sans_coef_nucleaire)}</td><td class="num">${fr(sf.sans_coef_systemique)}</td></tr>
    <tr><td>Couche conjoncturelle seule</td><td class="num">${fr(se.stabilite.sans_couche_structurelle)}</td><td class="num">${fr(se.guerre.sans_couche_structurelle)}</td><td class="num">${fr(sf.sans_couche_structurelle)}</td></tr>
    <tr><td>Socle structurel seul</td><td class="num">${fr(se.stabilite.structurel_seul)}</td><td class="num">${fr(se.guerre.structurel_seul)}</td><td class="num">${fr(sf.structurel_seul)}</td></tr>
    <tr><td>Moyenne simple des sévérités</td><td class="num">${fr(se.stabilite.brut_moyenne_simple)}</td><td class="num">${fr(se.guerre.brut_moyenne_simple)}</td><td class="num">${fr(sf.brut_moyenne_simple)}</td></tr></tbody></table></div>
   <h3 class="s">Limites</h3><p class="para">Les sévérités sont des jugements d’analyste adossés aux faits cités, pas des mesures. Les indicateurs conjoncturels sont des points chauds ; le domaine « diplomatie & prévision » et le socle structurel servent de contrepoids.</p>
   </article></div></div>`;};

(function(){

   <div class="i-card"><div class="i-band">Sources ouvertes · Usage personnel</div><div class="i-mk">VSM</div><h2>Veille stratégique mondiale</h2><p class="i-sub">Bulletin n° ${(D.historique||[]).length} · ${fdate(D.date_releve,true,true)}</p>

  document.body.appendChild(el);document.body.style.overflow='hidden';
  const q=s=>el.querySelector(s),sweep=q('#i-sweep'),scan=q('#i-scan'),card=q('.i-card'),gs=[...el.querySelectorAll('.i-spot')];

  el.addEventListener('click',()=>{if(t0!==null)t0=Math.min(t0,performance.now()-T);});
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'||e.key==='Enter'||e.key===' '){if(t0!==null)t0=Math.min(t0,performance.now()-T);document.removeEventListener('keydown',k);}});

})();

})();
