name: Bulletin sur Discord

on:
  push:
    branches: [main]
    paths: ['data/veille.json']
  workflow_dispatch:

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publier le bulletin et les alertes
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_ALERTES: ${{ secrets.DISCORD_WEBHOOK_ALERTES }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
        run: node Scripts/discord.js
